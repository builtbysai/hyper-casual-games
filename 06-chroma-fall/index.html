<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B0B1A">
<title>Chroma Fall — Hyper Casual 06</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0B0B1A;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #F2F2FF; }
  #wrap { position: relative; width: 100%; height: 100%; max-width: 520px; margin: 0 auto; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #hud { position: absolute; top: 0; left: 0; right: 0; padding: calc(10px + env(safe-area-inset-top)) 14px 0;
    display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; z-index: 6; }
  #hud .left { text-shadow: 0 2px 12px rgba(0,0,0,.7); }
  #score { font-size: 52px; font-weight: 900; line-height: 1; letter-spacing: -1px; }
  #bestLine { font-size: 13px; font-weight: 700; letter-spacing: 1px; color: #9B9BC0; margin-top: 4px; }
  #bestLine b { color: #FFD93D; }
  #youAre { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 11px;
    font-weight: 800; letter-spacing: 1.5px; color: #B9C0FF; background: rgba(53,167,255,.14);
    border: 1px solid rgba(53,167,255,.45); padding: 5px 9px; border-radius: 999px; }
  #youAre .dot { width: 10px; height: 10px; border-radius: 50%; background: #35A7FF;
    box-shadow: 0 0 8px #35A7FF; }
  #hud .right { display: flex; gap: 10px; pointer-events: auto; }
  .iconbtn { width: 46px; height: 46px; border-radius: 50%; border: 2px solid rgba(255,255,255,.35);
    background: rgba(11,11,26,.55); color: #fff; font-size: 21px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
  .iconbtn:active { transform: scale(.92); }
  #flash { position: absolute; top: 24%; left: 0; right: 0; text-align: center; z-index: 5;
    font-size: 30px; font-weight: 900; letter-spacing: 2px; color: #FFD93D; opacity: 0;
    text-shadow: 0 0 22px rgba(255,217,61,.8); transition: opacity .25s; pointer-events: none; }
  #flash.show { opacity: 1; }
  .overlay { position: absolute; inset: 0; z-index: 5; display: flex; align-items: center;
    justify-content: center; padding: 22px; background: rgba(5,5,18,.45); }
  .overlay[hidden], #hud[hidden] { display: none !important; }
  .card { width: 100%; max-width: 340px; background: #141428; border: 2px solid #35A7FF;
    border-radius: 22px; padding: 30px 24px 26px; text-align: center;
    box-shadow: 0 0 0 1px rgba(53,167,255,.25), 0 18px 60px rgba(0,0,0,.6); }
  .card h1 { font-size: 44px; font-weight: 900; letter-spacing: 1px; line-height: 1.02; }
  .card h1 .c1 { color: #FFD93D; } .card h1 .c2 { color: #FF3B5C; }
  .card h1 .c3 { color: #35A7FF; } .card h1 .c4 { color: #B565FF; }
  .card h2 { font-size: 34px; font-weight: 900; letter-spacing: 1px; }
  .card p { font-size: 15px; line-height: 1.55; color: #C9C9E8; margin: 14px 0 20px; }
  .card p b { color: #fff; }
  .bigscore { font-size: 64px; font-weight: 900; line-height: 1; margin: 6px 0 2px;
    text-shadow: 0 0 24px rgba(53,167,255,.7); }
  .stats { display: flex; justify-content: center; gap: 28px; margin: 14px 0 18px; }
  .stats div { font-size: 24px; font-weight: 900; }
  .stats span { display: block; font-size: 10px; font-weight: 800; letter-spacing: 1.5px; color: #8E8EB0; margin-top: 3px; }
  .btn { display: block; width: 100%; padding: 16px; margin-top: 12px; border: none; border-radius: 15px;
    font-size: 19px; font-weight: 900; letter-spacing: 2px; cursor: pointer; }
  .btn.primary { background: #35A7FF; color: #04121F; box-shadow: 0 6px 24px rgba(53,167,255,.45); }
  .btn.ghost { background: transparent; color: #D6D6F5; border: 2px solid #35A7FF; }
  .btn:active { transform: scale(.97); }
  #hint { position: absolute; bottom: calc(26px + env(safe-area-inset-bottom)); left: 0; right: 0;
    text-align: center; z-index: 4; font-size: 15px; font-weight: 800; letter-spacing: 3px;
    color: #D6D6F5; text-shadow: 0 2px 10px rgba(0,0,0,.8); pointer-events: none; }
  #hint small { display: block; margin-top: 6px; font-size: 12px; font-weight: 600; letter-spacing: .5px; color: #9B9BC0; }
  #hint[hidden] { display: none !important; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="hud" hidden>
    <div class="left">
      <div id="score">0</div>
      <div id="bestLine">BEST <b id="best">0</b></div>
      <div id="youAre"><span class="dot"></span>YOU ARE BLUE</div>
    </div>
    <div class="right">
      <button class="iconbtn" id="muteBtn" aria-label="Sound">&#9834;</button>
      <button class="iconbtn" id="pauseBtn" aria-label="Pause">&#10074;&#10074;</button>
    </div>
  </div>
  <div id="flash"></div>
  <div id="hint" hidden>TAP TO RISE<small>Pass through blue only. Touch any other color and you fall.</small></div>

  <div class="overlay" id="titleScr">
    <div class="card">
      <h1><span class="c1">C</span><span class="c2">H</span><span class="c3">R</span><span class="c4">O</span><span class="c1">M</span><span class="c2">A</span><br><span class="c3">F</span><span class="c4">A</span><span class="c1">L</span><span class="c2">L</span></h1>
      <p>Your ball is <b>blue</b>. Tap to rise through the spinning rings. Pass through <b>blue</b> only. Touch any other color and you fall back to the start.</p>
      <button class="btn primary" id="playBtn">PLAY</button>
      <p style="margin:12px 0 0; font-size:12px; color:#8E8EB0;" id="titleBest"></p>
    </div>
  </div>

  <div class="overlay" id="overScr" hidden>
    <div class="card">
      <h2 id="overTitle">COLOR LOST</h2>
      <div class="bigscore" id="overScore">0</div>
      <div class="stats">
        <div><span id="overBest">0</span><span>BEST</span></div>
        <div><span id="overRings">0</span><span>RINGS</span></div>
      </div>
      <p id="overMsg"></p>
      <button class="btn primary" id="againBtn">TRY AGAIN</button>
      <button class="btn ghost" id="menuBtn">MENU</button>
    </div>
  </div>

  <div class="overlay" id="pauseScr" hidden>
    <div class="card">
      <h2>PAUSED</h2>
      <p id="pauseInfo"></p>
      <button class="btn primary" id="resumeBtn">RESUME</button>
      <button class="btn ghost" id="restartBtn">RESTART</button>
      <button class="btn ghost" id="quitBtn">MENU</button>
      <button class="btn ghost" id="soundBtn">SOUND ON</button>
    </div>
  </div>
</div>
<script>
/*
  Chroma Fall — rebuilt from scratch per the Kodeco Color Switch guide
  (kodeco.com/790, SpriteKit + Swift). Guide numbers, unmodified, in guide
  points (375x667 scene), scaled to the phone by S = W/375.
  Guide spec: tap sets vy = 800; gravity -22 (~3300 pts/s2); ball r 40
  visual / 30 physics, starts blue on a ledge at y=160; rings are 4-color
  circles (outer 200, inner 160), one full turn per 8s; spacing 800;
  camera follows above screen center; wrong color or falling = restart.
*/
'use strict';
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
const hud = $('hud'), scoreEl = $('score'), bestEl = $('best'),
  flashEl = $('flash'), hintEl = $('hint'),
  titleScr = $('titleScr'), overScr = $('overScr'), pauseScr = $('pauseScr');

/* guide constants (points) */
const GW = 375;                 // guide scene width
const GRAV = 3300;              // -22 * 150 pts per meter
const TAP_V = 800;              // tap sets upward velocity
const BALL_R = 30, BALL_DRAW = 40;
const R_OUT = 200, R_IN = 160;
const SPACING = 800;
const ROT = Math.PI * 2 / 8;    // one full turn per 8s
const LEDGE_Y = 160, LEDGE_W = 200, LEDGE_H = 10;
const START_Y = 200;
const COLORS = ['#FFD93D', '#FF3B5C', '#35A7FF', '#B565FF']; // yellow red blue purple
const NAMES = ['yellow', 'red', 'blue', 'purple'];
const BALL_COLOR = 2;           // blue, per the guide (player starts blue)

/* canvas + scale */
let W = 0, H = 0, S = 1, LH = 0; // CSS size, scale, logical height
function resize(){
  const r = cv.parentElement.getBoundingClientRect();
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  W = r.width; H = r.height;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  S = W / GW;
  LH = H / S; // logical height in guide points
}
window.addEventListener('resize', resize);
resize();

/* state */
let state = 'title'; // title | play | pause | over
let score = 0, best = +(localStorage.getItem('cf_best') || 0);
let muted = localStorage.getItem('cf_muted') === '1';
let ball = { y: START_Y, vy: 0, resting: true };
let camY = 0;              // world y of the screen bottom
let rings = [];            // {y, rot, dir, passed, index}
let parts = [];            // particles {x, y, vx, vy, t, life, color, r}
let trail = [];            // {y, t}
let time = 0, shake = 0, flashT = 0, lastTs = 0, deadT = 0;

/* ---------- audio ---------- */
let AC = null;
function audio(){
  if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freq, dur, type, vol, slideTo){
  if (muted || !AC) return;
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(vol || 0.12, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(AC.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
function noiseBurst(dur, vol){
  if (muted || !AC) return;
  const t = AC.currentTime, len = Math.floor(AC.sampleRate * dur),
        buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = AC.createBufferSource(); src.buffer = buf;
  const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 800;
  const g = AC.createGain(); g.gain.value = vol || 0.25;
  src.connect(f); f.connect(g); g.connect(AC.destination); src.start(t);
}
const sfxTap = () => tone(520, 0.07, 'sine', 0.08, 760);
const sfxPass = () => { tone(660, 0.09, 'sine', 0.11); setTimeout(() => tone(990, 0.12, 'sine', 0.11), 70); };
const sfxDie = () => { noiseBurst(0.3, 0.3); tone(140, 0.35, 'sine', 0.25, 50); };
function setMuted(m){
  muted = m; localStorage.setItem('cf_muted', m ? '1' : '0');
  $('muteBtn').innerHTML = m ? '&#9834;&#8413;' : '&#9834;';
  $('soundBtn').textContent = m ? 'SOUND OFF' : 'SOUND ON';
}
function suspendAudio(){ if (AC && AC.state === 'running') AC.suspend(); }
function resumeAudio(){ if (AC && AC.state === 'suspended' && !muted) AC.resume(); }
document.addEventListener('visibilitychange', () => {
  if (document.hidden){ suspendAudio(); if (state === 'play') pauseGame(); }
  else resumeAudio();
});
window.addEventListener('blur', () => { suspendAudio(); if (state === 'play') pauseGame(); });
window.addEventListener('pagehide', suspendAudio);

/* ---------- input ---------- */
function tap(){
  if (state !== 'play') return;
  audio();
  ball.vy = TAP_V;          // guide: tap SETS the upward velocity
  ball.resting = false;
  sfxTap();
  burst(GW / 2, ball.y - BALL_R, '#35A7FF', 4, 90);
}
cv.addEventListener('pointerdown', e => { e.preventDefault(); tap(); });
window.addEventListener('keydown', e => {
  if (e.key === ' ' || e.key === 'ArrowUp'){ e.preventDefault(); tap(); }
  if ((e.key === 'p' || e.key === 'Escape') && state === 'play') pauseGame();
  else if ((e.key === 'p' || e.key === 'Escape') && state === 'pause') resumeGame();
  else if (e.key === 'Enter' && state === 'title') startGame();
  else if (e.key === 'Enter' && state === 'over') startGame();
});

/* ---------- helpers ---------- */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
function showFlash(txt){
  flashEl.textContent = txt;
  flashEl.classList.add('show'); flashT = 0.8;
}
function burst(x, y, color, n, spd){
  for (let i = 0; i < n; i++){
    const a = Math.random() * TAU, s = (0.3 + Math.random() * 0.7) * (spd || 120);
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      t: 0, life: 0.4 + Math.random() * 0.4, color, r: 3 + Math.random() * 4 });
  }
}
/* world y -> logical screen y (0 = top) */
function sy(worldY){ return LH - (worldY - camY); }

/* ---------- rings (guide: 4-color circles, 8s per turn) ---------- */
/* quadrant colors at rot 0: q0 [0,90) q1 [90,180) q2 [180,270) q3 [270,360)
   dir +1 = guide clockwise=true layout; dir -1 = mirrored layout */
const QUAD_PLUS = [1, 2, 3, 0];  // red blue purple yellow
const QUAD_MINUS = [3, 2, 1, 0]; // purple blue red yellow
let nextIndex = 1;
function spawnRing(){
  const i = nextIndex++;
  rings.push({ y: SPACING * i, rot: Math.random() * TAU,
    dir: (i % 2 === 1) ? 1 : -1, passed: false, index: i });
}
function colorAt(ring, angle){
  let local = (angle - ring.rot) % TAU;
  if (local < 0) local += TAU;
  const q = Math.floor(local / (Math.PI / 2)) % 4;
  return (ring.dir === 1 ? QUAD_PLUS : QUAD_MINUS)[q];
}
/* guide contact rule: the ball overlaps a ring band only if its color
   matches every segment it touches. Returns {ok, arc, color} */
function checkContact(){
  for (const ring of rings){
    const d = ball.y - ring.y;
    if (Math.abs(d) > R_OUT + BALL_R) continue;
    const lo = ball.y - BALL_R, hi = ball.y + BALL_R;
    const bands = [];
    if (hi >= ring.y - R_OUT && lo <= ring.y - R_IN) bands.push({ dir: -Math.PI / 2, arc: 'lower' });
    if (hi >= ring.y + R_IN && lo <= ring.y + R_OUT) bands.push({ dir: Math.PI / 2, arc: 'upper' });
    for (const b of bands){
      const half = Math.asin(clamp(BALL_R / Math.max(Math.abs(d), BALL_R + 1), 0, 1));
      for (const a of [b.dir, b.dir - half, b.dir + half]){
        const c = colorAt(ring, a);
        if (c !== BALL_COLOR) return { ok: false, arc: b.arc, color: c };
      }
    }
  }
  return { ok: true };
}

/* ---------- flow ---------- */
function show(el){ el.hidden = false; }
function hide(el){ el.hidden = true; }
function updateHud(){
  scoreEl.textContent = score;
  bestEl.textContent = best;
}
function startGame(){
  audio();
  state = 'play';
  score = 0; camY = 0; time = 0; shake = 0; deadT = 0;
  ball = { y: START_Y, vy: 0, resting: true };
  rings = []; parts = []; trail = [];
  nextIndex = 1;
  spawnRing(); spawnRing(); spawnRing(); // guide starts with three
  hide(titleScr); hide(overScr); hide(pauseScr); show(hud); show(hintEl);
  updateHud();
}
function pauseGame(){
  if (state !== 'play') return;
  state = 'pause';
  $('pauseInfo').textContent = 'Score ' + score + '  ·  Best ' + best;
  show(pauseScr);
}
function resumeGame(){
  if (state !== 'pause') return;
  state = 'play'; hide(pauseScr); resumeAudio();
}
function gameOver(kind, detail){
  if (state !== 'play') return;
  state = 'over'; deadT = 0;
  sfxDie();
  shake = 12;
  burst(GW / 2, ball.y, COLORS[BALL_COLOR], 26, 260);
  burst(GW / 2, ball.y, '#FFFFFF', 10, 160);
  const prevBest = best;
  if (score > best){ best = score; localStorage.setItem('cf_best', String(best)); }
  $('overScore').textContent = score;
  $('overBest').textContent = best;
  $('overRings').textContent = score;
  if (kind === 'color'){
    $('overTitle').textContent = 'COLOR LOST';
    $('overMsg').textContent = 'The ' + detail.arc + ' arc was ' + NAMES[detail.color] +
      '. Pass through blue only.';
  } else {
    $('overTitle').textContent = 'YOU FELL';
    $('overMsg').textContent = 'You fell below the screen. Keep tapping to stay up.';
  }
  if (score > prevBest && score > 0) $('overTitle').textContent = 'NEW BEST!';
  setTimeout(() => { if (state === 'over'){ show(overScr); updateHud(); } }, 600);
}
function toMenu(){
  state = 'title';
  hide(overScr); hide(pauseScr); hide(hud); hide(hintEl); show(titleScr);
  $('titleBest').textContent = best > 0 ? 'BEST ' + best : '';
}

/* ---------- update ---------- */
function update(dt){
  time += dt;
  if (flashT > 0){ flashT -= dt; if (flashT <= 0) flashEl.classList.remove('show'); }
  if (shake > 0) shake = Math.max(0, shake - dt * 24);
  for (const r of rings) r.rot += r.dir * ROT * dt; // rings always spin
  updateParts(dt);
  if (state !== 'play') return;
  // physics (guide: gravity pulls down, tap sets vy)
  if (!ball.resting){
    ball.vy -= GRAV * dt;
    ball.y += ball.vy * dt;
  }
  // ledge (guide: static platform at y=160, ball rests on it)
  if (ball.vy <= 0 && ball.y - BALL_R <= LEDGE_Y + LEDGE_H && ball.y > LEDGE_Y - 40){
    ball.y = LEDGE_Y + LEDGE_H + BALL_R;
    ball.vy = 0; ball.resting = true;
  }
  trail.push({ y: ball.y, t: 0 });
  if (trail.length > 14) trail.shift();
  // camera (guide: follow when the player is in the top half)
  const half = LH / 2;
  if (ball.y > camY + half) camY = ball.y - half;
  // spawn ahead, clean up behind (guide lacks cleanup; the forum flagged it)
  const top = rings.length ? rings[rings.length - 1].y : 0;
  if (top < ball.y + 2 * SPACING) spawnRing();
  rings = rings.filter(r => r.y > camY - 400);
  // score (guide: print("score") TODO — implemented as rings passed)
  for (const r of rings){
    if (!r.passed && ball.y > r.y){
      r.passed = true; score++;
      sfxPass(); showFlash('+' + 1);
      burst(GW / 2, r.y, COLORS[BALL_COLOR], 10, 140);
      updateHud();
    }
  }
  // contact (guide: wrong color = die and restart)
  const hit = checkContact();
  if (!hit.ok){ gameOver('color', hit); return; }
  // fell below the screen (guide: playerPositionInCamera.y < -height/2)
  if (ball.y + BALL_R < camY){ gameOver('fell'); return; }
  if (ball.y > START_Y + 60) hide(hintEl);
}
function updateParts(dt){
  for (const p of parts){ p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy -= 500 * dt; }
  parts = parts.filter(p => p.t < p.life);
  for (const t of trail) t.t += dt;
}

/* ---------- render ---------- */
const STARS = [];
for (let i = 0; i < 40; i++){
  STARS.push({ x: Math.random() * GW, y: Math.random() * 900,
    r: 0.6 + Math.random() * 1.3, a: 0.15 + Math.random() * 0.4 });
}
function render(){
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  ctx.setTransform(dpr * S, 0, 0, dpr * S, 0, 0);
  ctx.clearRect(0, 0, GW, LH);
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  // backdrop
  const bg = ctx.createLinearGradient(0, 0, 0, LH);
  bg.addColorStop(0, '#0D0D24'); bg.addColorStop(0.6, '#0B0B1A'); bg.addColorStop(1, '#080814');
  ctx.fillStyle = bg; ctx.fillRect(-20, -20, GW + 40, LH + 40);
  // starfield (drifts with the camera, wraps)
  for (const s of STARS){
    const y = ((s.y - camY * 0.4) % 900 + 900) % 900;
    if (y > LH + 4) continue;
    ctx.fillStyle = 'rgba(255,255,255,' + s.a.toFixed(2) + ')';
    ctx.beginPath(); ctx.arc(s.x, y, s.r, 0, TAU); ctx.fill();
  }
  // ledge (guide: static platform, ball rests on it at the start)
  const ledgeSy = sy(LEDGE_Y + LEDGE_H / 2);
  if (ledgeSy > -20 && ledgeSy < LH + 20){
    ctx.fillStyle = '#23234A';
    ctx.strokeStyle = 'rgba(53,167,255,.5)'; ctx.lineWidth = 2;
    const lw = LEDGE_W, lh = LEDGE_H, lx = GW / 2 - lw / 2, ly = ledgeSy - lh / 2;
    ctx.beginPath();
    ctx.roundRect(lx, ly, lw, lh, 5);
    ctx.fill(); ctx.stroke();
  }
  // rings
  const midR = (R_OUT + R_IN) / 2, thick = R_OUT - R_IN;
  for (const ring of rings){
    const cy = sy(ring.y);
    if (cy < -R_OUT - 20 || cy > LH + R_OUT + 20) continue;
    for (let q = 0; q < 4; q++){
      const col = (ring.dir === 1 ? QUAD_PLUS : QUAD_MINUS)[q];
      // world span [q*90+rot, (q+1)*90+rot] -> canvas angles negate (y down)
      const a0 = -(q + 1) * Math.PI / 2 - ring.rot;
      const a1 = -q * Math.PI / 2 - ring.rot;
      ctx.strokeStyle = COLORS[col];
      ctx.lineWidth = thick;
      ctx.lineCap = 'butt';
      ctx.shadowColor = COLORS[col]; ctx.shadowBlur = 14;
      ctx.beginPath();
      ctx.arc(GW / 2, cy, midR, a0, a1);
      ctx.stroke();
    }
    ctx.shadowBlur = 0;
    // center star (decorative guide-star, marks the ring heart)
    ctx.fillStyle = 'rgba(255,217,61,.85)';
    ctx.beginPath();
    ctx.arc(GW / 2, cy, 4, 0, TAU); ctx.fill();
  }
  // trail
  for (const t of trail){
    const a = Math.max(0, 0.35 - t.t * 0.9);
    if (a <= 0) continue;
    ctx.fillStyle = 'rgba(53,167,255,' + a.toFixed(2) + ')';
    ctx.beginPath(); ctx.arc(GW / 2, sy(t.y), 7, 0, TAU); ctx.fill();
  }
  // particles
  for (const p of parts){
    const a = 1 - p.t / p.life;
    ctx.fillStyle = p.color;
    ctx.globalAlpha = Math.max(0, a);
    ctx.beginPath(); ctx.arc(p.x, sy(p.y), p.r * a + 1, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
  // ball
  if (state !== 'over' || deadT < 0.25){
    const by = sy(ball.y);
    ctx.save();
    ctx.shadowColor = COLORS[BALL_COLOR]; ctx.shadowBlur = 22;
    ctx.fillStyle = COLORS[BALL_COLOR];
    ctx.beginPath(); ctx.arc(GW / 2, by, BALL_DRAW, 0, TAU); ctx.fill();
    ctx.restore();
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    ctx.beginPath(); ctx.arc(GW / 2 - 12, by - 13, 9, 0, TAU); ctx.fill();
  }
  ctx.restore();
  // vignette
  const vg = ctx.createRadialGradient(GW / 2, LH / 2, LH * 0.35, GW / 2, LH / 2, LH * 0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.4)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, GW, LH);
}

/* ---------- loop ---------- */
function frame(ts){
  const dt = Math.min(0.05, (ts - lastTs) / 1000 || 0.016);
  lastTs = ts;
  if (state === 'over') deadT += dt;
  update(dt);
  render();
  requestAnimationFrame(frame);
}

/* ---------- wiring ---------- */
$('playBtn').addEventListener('click', startGame);
$('againBtn').addEventListener('click', startGame);
$('menuBtn').addEventListener('click', toMenu);
$('quitBtn').addEventListener('click', toMenu);
$('restartBtn').addEventListener('click', startGame);
$('resumeBtn').addEventListener('click', resumeGame);
$('pauseBtn').addEventListener('click', () => { if (state === 'play') pauseGame(); });
$('muteBtn').addEventListener('click', () => { audio(); setMuted(!muted); });
$('soundBtn').addEventListener('click', () => { audio(); setMuted(!muted); });
setMuted(muted);
$('titleBest').textContent = best > 0 ? 'BEST ' + best : '';
spawnRing(); spawnRing(); spawnRing(); // lively title backdrop
requestAnimationFrame(frame);
</script>
