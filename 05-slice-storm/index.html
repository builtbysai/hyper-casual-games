<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a1030">
<title>Slice Storm</title>
<!-- SLICE-STORM-05 -->
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #1a1030;
    touch-action: none; -webkit-user-select: none; user-select: none;
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif; }
  canvas { display: block; position: fixed; inset: 0; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
// SLICE STORM — game 05. Model: Fruit Ninja. Swipe to slice.
// Twist: FRENZY (3+ fruit in one swipe = 3s slow-mo + 2x), golden fruit (10x).
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// ---------- utils ----------
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function rnd(a, b) { return a + Math.random() * (b - a); }
function buzz(ms) {
  try { if (typeof navigator.vibrate === 'function') navigator.vibrate(ms); } catch (e) {}
}
// segment-point distance (for swept swipe collision)
function segDist(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay;
  const L2 = dx * dx + dy * dy;
  let t = L2 ? ((px - ax) * dx + (py - ay) * dy) / L2 : 0;
  t = clamp(t, 0, 1);
  const cx = ax + dx * t, cy = ay + dy * t;
  return Math.hypot(px - cx, py - cy);
}

// ---------- audio ----------
let AC = null, muted = false;
function initAudio() {
  if (AC) return;
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); }
  catch (e) { AC = null; }
}
function audioSuspend() { try { if (AC && AC.state === 'running') AC.suspend(); } catch (e) {} }
function audioResume() { try { if (AC && AC.state === 'suspended' && !muted) AC.resume(); } catch (e) {} }
document.addEventListener('visibilitychange', () => { if (document.hidden) audioSuspend(); else audioResume(); });
window.addEventListener('blur', audioSuspend);
window.addEventListener('focus', audioResume);
window.addEventListener('pagehide', audioSuspend);
function tone(freq, dur, type, vol, when, slideTo) {
  if (!AC || muted) return;
  try {
    const t0 = AC.currentTime + (when || 0);
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.2, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(AC.destination);
    o.start(t0); o.stop(t0 + dur + 0.05);
  } catch (e) {}
}
function noiseBurst(dur, vol, freq) {
  if (!AC || muted) return;
  try {
    const t0 = AC.currentTime, len = Math.floor(AC.sampleRate * dur);
    const buf = AC.createBuffer(1, len, AC.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = AC.createBufferSource(); src.buffer = buf;
    const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq || 2000;
    const g = AC.createGain(); g.gain.value = vol || 0.25;
    src.connect(f).connect(g).connect(AC.destination);
    src.start(t0);
  } catch (e) {}
}
const sfx = {
  slice() { noiseBurst(0.09, 0.28, 4200); tone(900, 0.08, 'sine', 0.1, 0, 2400); },
  splat() { noiseBurst(0.14, 0.22, 900); },
  bomb() { noiseBurst(0.5, 0.4, 180); tone(90, 0.5, 'sawtooth', 0.25, 0, 40); },
  frenzy() { tone(440, 0.3, 'sawtooth', 0.16, 0, 880); tone(660, 0.4, 'sawtooth', 0.12, 0.1, 1320); },
  miss() { tone(220, 0.25, 'sine', 0.16, 0, 110); },
  golden() { tone(880, 0.2, 'triangle', 0.2); tone(1320, 0.3, 'triangle', 0.16, 0.08); },
  over() { tone(330, 0.6, 'sawtooth', 0.2, 0, 80); },
  combo(n) { const p = Math.pow(1.059, Math.min(n, 12)); tone(520 * p, 0.15, 'triangle', 0.14); }
};

// ---------- constants ----------
const GRAV = 1900, MAX_FALL = 1500;
const BEST_KEY = 'slice_best';
const F_WATERMELON = 0, F_ORANGE = 1, F_APPLE = 2, F_KIWI = 3, F_BOMB = 4, F_GOLDEN = 5;

// ---------- state ----------
let state = 'ready'; // ready | play | dead
let fruits = [], halves = [], parts = [], trail = [];
let score = 0, best = 0, lives = 3, misses = 0;
let combo = 0, maxCombo = 0;
let frenzyT = 0, shakeT = 0, shakeMag = 0;
let spawnT = 0, elapsed = 0, deadT = 0;
let floatingTexts = [];
try { best = parseInt(localStorage.getItem(BEST_KEY) || '0', 10) || 0; } catch (e) { best = 0; }
function saveBest() { try { localStorage.setItem(BEST_KEY, String(best)); } catch (e) {} }

const FRUIT_DEF = [
  { r: 42, juice: '#ff4d6d', flesh: '#ff5d7a', skin: '#2d9e5b', score: 10 },  // watermelon
  { r: 34, juice: '#ffa02e', flesh: '#ffab3d', skin: '#ff8c1a', score: 10 },  // orange
  { r: 32, juice: '#ff6b5e', flesh: '#ffd9d2', skin: '#e0302e', score: 10 },  // apple
  { r: 30, juice: '#9fe870', flesh: '#a8e063', skin: '#7a5c3e', score: 10 },  // kiwi
  { r: 34, juice: '#ff9d2e', flesh: '#3a3a44', skin: '#22222a', score: 0 },   // bomb
  { r: 30, juice: '#ffe066', flesh: '#fff3b0', skin: '#f5b800', score: 100 }  // golden
];

function reset() {
  fruits = []; halves = []; parts = []; trail = []; floatingTexts = [];
  score = 0; lives = 3; misses = 0; combo = 0; maxCombo = 0;
  frenzyT = 0; shakeT = 0; spawnT = 0.6; elapsed = 0; deadT = 0;
}

function spawnFruit() {
  const roll = Math.random();
  let type;
  if (roll < 0.10) type = F_BOMB;
  else if (roll < 0.15) type = F_GOLDEN;
  else type = (Math.random() * 4) | 0;
  const def = FRUIT_DEF[type];
  const x = rnd(W * 0.12, W * 0.88);
  const up = H * rnd(1.55, 1.85);
  fruits.push({
    x, y: H + 50, vx: rnd(-90, 90), vy: -up,
    r: def.r * rnd(0.92, 1.08), type,
    rot: rnd(0, 6.28), vr: rnd(-2.5, 2.5),
    squashT: 0, // time since launch (anticipation squash)
    sliced: false
  });
  // occasionally spawn a pair
  if (Math.random() < 0.35 && type !== F_BOMB) {
    const x2 = clamp(x + rnd(-160, 160), W * 0.1, W * 0.9);
    fruits.push({
      x: x2, y: H + 50, vx: rnd(-90, 90), vy: -H * rnd(1.5, 1.8),
      r: def.r * rnd(0.92, 1.08), type: (Math.random() * 4) | 0,
      rot: rnd(0, 6.28), vr: rnd(-2.5, 2.5), squashT: 0, sliced: false
    });
  }
}

// ---------- slicing ----------
function sliceFruit(f, sx, sy) {
  f.sliced = true;
  const def = FRUIT_DEF[f.type];
  const ang = Math.atan2(sy - f.y, sx - f.x) + Math.PI / 2;
  // two halves fly apart perpendicular to the swipe
  const sp = 260;
  for (const side of [-1, 1]) {
    halves.push({
      x: f.x, y: f.y,
      vx: f.vx * 0.4 + Math.cos(ang) * sp * side + rnd(-40, 40),
      vy: f.vy * 0.3 - 120,
      rot: f.rot, vr: f.vr + side * rnd(3, 7),
      r: f.r, type: f.type, side,
      life: 1.1, cutAng: ang
    });
  }
  // juice particles in the fruit's color
  const n = f.type === F_GOLDEN ? 26 : 16;
  for (let i = 0; i < n; i++) {
    const a = rnd(0, 6.28), s = rnd(80, 420);
    parts.push({
      x: f.x, y: f.y, vx: Math.cos(a) * s + f.vx * 0.3, vy: Math.sin(a) * s - 100,
      life: rnd(0.4, 0.9), col: def.juice, size: rnd(2, 6)
    });
  }
  return def;
}

function onSlice(f, swipeCount) {
  const def = FRUIT_DEF[f.type];
  if (f.type === F_BOMB) {
    lives--;
    shakeT = 0.35; shakeMag = 14;
    sfx.bomb(); buzz(80);
    burstAt(f.x, f.y, '#ff9d2e', 30);
    addText('BOMB', '#ff5d5d', 34, f.x, f.y - 40);
    combo = 0;
    if (lives <= 0) onDeath('bomb');
    return;
  }
  combo++;
  if (combo > maxCombo) maxCombo = combo;
  const mult = Math.min(5, 1 + ((combo / 8) | 0));
  let pts = def.score * mult;
  if (frenzyT > 0) pts *= 2;
  score += pts;
  if (score > best) { best = score; saveBest(); }
  if (f.type === F_GOLDEN) { sfx.golden(); addText('+' + pts + ' GOLD', '#ffe066', 30, f.x, f.y - 40); }
  else { sfx.slice(); sfx.splat(); }
  if (mult > 1) { sfx.combo(mult); addText('x' + mult, '#8ef7ff', 26, f.x, f.y - 60); }
  // FRENZY check is done by the caller counting swipe slices
}

function burstAt(x, y, col, n) {
  for (let i = 0; i < n; i++) {
    const a = rnd(0, 6.28), s = rnd(100, 480);
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 140,
      life: rnd(0.5, 1), col, size: rnd(2, 7) });
  }
}
function addText(txt, col, size, x, y) {
  floatingTexts.push({ txt, col, size, x: x == null ? W / 2 : x, y: y == null ? H * 0.4 : y, life: 1 });
}
function onDeath(reason) {
  state = 'dead'; deadT = 0;
  sfx.over(); buzz(120);
}

// ---------- swipe ----------
let swiping = false, lastSX = 0, lastSY = 0;
const muteBox = { x: 0, y: 0, w: 44, h: 44 };
function layoutMute() { muteBox.x = W - 52; muteBox.y = 14; }

function onDown(x, y) {
  initAudio();
  if (AC && AC.state === 'suspended' && !muted) { try { AC.resume(); } catch (e) {} }
  layoutMute();
  if (x >= muteBox.x && x <= muteBox.x + muteBox.w && y >= muteBox.y && y <= muteBox.y + muteBox.h) {
    muted = !muted;
    if (muted) audioSuspend(); else audioResume();
    return;
  }
  if (state === 'ready') { state = 'play'; reset(); }
  else if (state === 'dead' && deadT > 0.8) { state = 'play'; reset(); return; }
  if (state !== 'play') return;
  swiping = true;
  lastSX = x; lastSY = y;
  trail.push({ x, y, age: 0 });
}
function onMove(x, y) {
  if (!swiping || state !== 'play') return;
  const px = lastSX, py = lastSY;
  lastSX = x; lastSY = y;
  trail.push({ x, y, age: 0 });
  if (trail.length > 24) trail.shift();
  // swept collision: check every fruit against the swipe segment
  let slicedThisMove = 0;
  for (const f of fruits) {
    if (f.sliced) continue;
    if (segDist(f.x, f.y, px, py, x, y) < f.r + 6) {
      sliceFruit(f, x, y);
      onSlice(f, 0);
      slicedThisMove++;
    }
  }
  // FRENZY: 3+ fruit in a single swipe move
  if (slicedThisMove >= 3 && frenzyT <= 0) {
    frenzyT = 3;
    sfx.frenzy(); buzz(40);
    addText('FRENZY 2x', '#ff9df5', 38, W / 2, H * 0.35);
  }
}
function onUp() { swiping = false; }

// ---------- physics ----------
function step(dt) {
  elapsed += dt;
  // FRENZY slow-mo
  let pdt = dt;
  if (frenzyT > 0) { frenzyT -= dt; pdt = dt * 0.35; }
  if (shakeT > 0) shakeT -= dt;

  // spawn pacing ramps with score (only while playing)
  if (state === 'play') {
    spawnT -= dt;
    if (spawnT <= 0) {
      spawnFruit();
      spawnT = clamp(0.85 - score * 0.0012, 0.38, 0.85);
    }
  }

  // fruit physics (swept-safe: cap fall speed)
  for (let i = fruits.length - 1; i >= 0; i--) {
    const f = fruits[i];
    f.vy += GRAV * pdt;
    if (f.vy > MAX_FALL) f.vy = MAX_FALL;
    f.x += f.vx * pdt; f.y += f.vy * pdt;
    f.rot += f.vr * pdt;
    f.squashT += pdt;
    if (f.sliced) { fruits.splice(i, 1); continue; }
    // missed = fell off bottom (bombs don't count); only counts while playing
    if (f.y - f.r > H + 60) {
      fruits.splice(i, 1);
      if (state === 'play' && f.type !== F_BOMB) {
        misses++; combo = 0;
        sfx.miss(); buzz(30);
        addText('MISS', '#ff8a8a', 28, W / 2, H * 0.5);
        if (misses >= 3) onDeath('misses');
      }
    }
    // despawn far sides
    if (f.x < -120 || f.x > W + 120) fruits.splice(i, 1);
  }

  // halves
  for (let i = halves.length - 1; i >= 0; i--) {
    const h = halves[i];
    h.vy += GRAV * pdt;
    if (h.vy > MAX_FALL) h.vy = MAX_FALL;
    h.x += h.vx * pdt; h.y += h.vy * pdt;
    h.rot += h.vr * pdt; h.life -= pdt;
    if (h.life <= 0 || h.y > H + 80) halves.splice(i, 1);
  }
  // particles
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.vy += 1400 * pdt;
    p.x += p.vx * pdt; p.y += p.vy * pdt;
    p.life -= pdt;
    if (p.life <= 0) parts.splice(i, 1);
  }
  // trail fade
  for (let i = trail.length - 1; i >= 0; i--) {
    trail[i].age += dt;
    if (trail[i].age > 0.28) trail.splice(i, 1);
  }
  // floating texts
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const t = floatingTexts[i];
    t.life -= dt * 1.1; t.y -= 46 * dt;
    if (t.life <= 0) floatingTexts.splice(i, 1);
  }
  if (state === 'dead') deadT += dt;
}

// ---------- drawing ----------
function drawFruit(f) {
  const def = FRUIT_DEF[f.type];
  ctx.save();
  ctx.translate(f.x, f.y);
  // launch squash: brief vertical squash right after spawn
  const sq = f.squashT < 0.18 ? 1 - 0.25 * Math.sin((f.squashT / 0.18) * Math.PI) : 1;
  ctx.scale(1 / Math.sqrt(sq), sq);
  ctx.rotate(f.rot * 0.12);
  const r = f.r;
  if (f.type === F_BOMB) {
    const g = ctx.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.1, 0, 0, r);
    g.addColorStop(0, '#5a5a6a'); g.addColorStop(1, '#16161c');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.29); ctx.fill();
    ctx.strokeStyle = '#8a6a3a'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(0, -r); ctx.quadraticCurveTo(r * 0.4, -r * 1.4, r * 0.7, -r * 1.1); ctx.stroke();
    ctx.fillStyle = '#ffcf3d';
    ctx.beginPath(); ctx.arc(r * 0.7, -r * 1.1, 5, 0, 6.29); ctx.fill();
  } else if (f.type === F_WATERMELON) {
    ctx.fillStyle = def.skin;
    ctx.beginPath(); ctx.ellipse(0, 0, r, r * 0.88, 0, 0, 6.29); ctx.fill();
    ctx.strokeStyle = '#1d6b3c'; ctx.lineWidth = 3;
    for (let i = -2; i <= 2; i++) {
      ctx.beginPath(); ctx.ellipse(i * r * 0.32, 0, r * 0.1, r * 0.82, 0, 0, 6.29); ctx.stroke();
    }
    const g = ctx.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.1, 0, 0, r);
    g.addColorStop(0, 'rgba(255,255,255,0.25)'); g.addColorStop(0.5, 'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(0, 0, r, r * 0.88, 0, 0, 6.29); ctx.fill();
  } else if (f.type === F_GOLDEN) {
    ctx.shadowColor = '#ffe066'; ctx.shadowBlur = 24;
    const g = ctx.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.1, 0, 0, r);
    g.addColorStop(0, '#fff8d0'); g.addColorStop(0.6, '#ffd93d'); g.addColorStop(1, '#c98f00');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.29); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    for (let i = 0; i < 4; i++) {
      const a = elapsed * 2 + i * 1.57;
      ctx.fillRect(Math.cos(a) * r * 1.35 - 1.5, Math.sin(a) * r * 1.35 - 1.5, 3, 3);
    }
  } else {
    const g = ctx.createRadialGradient(-r * 0.35, -r * 0.35, r * 0.1, 0, 0, r * 1.05);
    if (f.type === F_ORANGE) { g.addColorStop(0, '#ffd9a0'); g.addColorStop(0.55, '#ff9d2e'); g.addColorStop(1, '#d96a00'); }
    else if (f.type === F_APPLE) { g.addColorStop(0, '#ff9d9d'); g.addColorStop(0.55, '#e0302e'); g.addColorStop(1, '#8f1414'); }
    else { g.addColorStop(0, '#c9a97a'); g.addColorStop(0.55, '#8a6a44'); g.addColorStop(1, '#5a422a'); }
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.29); ctx.fill();
    if (f.type === F_APPLE) {
      ctx.fillStyle = '#3da35d';
      ctx.beginPath(); ctx.ellipse(r * 0.25, -r * 1.02, r * 0.28, r * 0.14, 0.6, 0, 6.29); ctx.fill();
      ctx.strokeStyle = '#6b4a2a'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(0, -r); ctx.lineTo(0, -r * 1.18); ctx.stroke();
    }
    if (f.type === F_KIWI) {
      ctx.strokeStyle = 'rgba(60,40,20,0.35)'; ctx.lineWidth = 1.5;
      for (let i = 0; i < 10; i++) {
        const a = i * 0.63;
        ctx.beginPath(); ctx.moveTo(Math.cos(a) * r * 0.7, Math.sin(a) * r * 0.7);
        ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); ctx.stroke();
      }
    }
  }
  ctx.restore();
}

function drawHalf(h) {
  const def = FRUIT_DEF[h.type];
  ctx.save();
  ctx.globalAlpha = clamp(h.life * 1.6, 0, 1);
  ctx.translate(h.x, h.y);
  ctx.rotate(h.cutAng + h.rot * 0.3);
  const r = h.r;
  // half body: clipped circle showing the cut face
  ctx.beginPath();
  if (h.side < 0) ctx.arc(0, 0, r, -Math.PI / 2, Math.PI / 2);
  else ctx.arc(0, 0, r, Math.PI / 2, Math.PI * 1.5);
  ctx.closePath();
  const g = ctx.createRadialGradient(0, 0, r * 0.1, 0, 0, r);
  if (h.type === F_BOMB) { g.addColorStop(0, '#4a4a55'); g.addColorStop(1, '#16161c'); }
  else { g.addColorStop(0, '#ffffff'); g.addColorStop(0.35, def.flesh); g.addColorStop(1, def.skin); }
  ctx.fillStyle = g;
  ctx.fill();
  // seeds for watermelon
  if (h.type === F_WATERMELON) {
    ctx.fillStyle = '#2a1a12';
    for (let i = 0; i < 5; i++) {
      ctx.beginPath();
      ctx.ellipse(rnd(-r * 0.5, r * 0.5), rnd(-r * 0.4, r * 0.4), 3, 4.5, 0, 0, 6.29);
      ctx.fill();
    }
  }
  ctx.restore();
}

function drawTrail() {
  if (trail.length < 2) return;
  ctx.save();
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.shadowColor = '#b48cff'; ctx.shadowBlur = 18;
  for (let i = 1; i < trail.length; i++) {
    const a = trail[i - 1], b = trail[i];
    const life = 1 - b.age / 0.28;
    ctx.globalAlpha = clamp(life, 0, 1) * 0.9;
    ctx.strokeStyle = '#d9c6ff';
    ctx.lineWidth = 2 + 9 * life;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
  ctx.restore();
}

function drawHUD() {
  ctx.save();
  ctx.textAlign = 'left';
  ctx.fillStyle = '#fff';
  ctx.font = '800 44px -apple-system, "Segoe UI", system-ui, sans-serif';
  ctx.fillText(String(score), 18, 58);
  ctx.font = '600 17px -apple-system, "Segoe UI", system-ui, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.65)';
  ctx.fillText('BEST ' + best, 18, 84);
  // lives
  ctx.textAlign = 'right';
  ctx.font = '800 26px -apple-system, "Segoe UI", system-ui, sans-serif';
  ctx.fillStyle = '#ff8a8a';
  let hearts = '';
  for (let i = 0; i < lives; i++) hearts += '●';
  ctx.fillText(hearts, W - 70, 52);
  // misses as X marks
  ctx.fillStyle = 'rgba(255,138,138,0.5)';
  ctx.font = '700 20px -apple-system, "Segoe UI", system-ui, sans-serif';
  let xs = '';
  for (let i = 0; i < misses; i++) xs += '✕ ';
  ctx.fillText(xs, W - 70, 78);
  // combo
  const mult = Math.min(5, 1 + ((combo / 8) | 0));
  if (mult > 1 && state === 'play') {
    ctx.textAlign = 'center';
    ctx.font = '800 30px -apple-system, "Segoe UI", system-ui, sans-serif';
    ctx.fillStyle = '#8ef7ff';
    ctx.shadowColor = '#8ef7ff'; ctx.shadowBlur = 16;
    ctx.fillText('COMBO x' + mult, W / 2, 60);
    ctx.shadowBlur = 0;
  }
  // frenzy banner
  if (frenzyT > 0) {
    ctx.textAlign = 'center';
    ctx.font = '800 24px -apple-system, "Segoe UI", system-ui, sans-serif';
    ctx.fillStyle = '#ff9df5';
    ctx.shadowColor = '#ff9df5'; ctx.shadowBlur = 20;
    ctx.fillText('FRENZY ' + frenzyT.toFixed(1) + 's', W / 2, 96);
    ctx.shadowBlur = 0;
  }
  ctx.restore();
}

function drawMute() {
  layoutMute();
  const x = muteBox.x, y = muteBox.y;
  ctx.save();
  ctx.globalAlpha = 0.55;
  ctx.strokeStyle = '#c9d4ff'; ctx.fillStyle = '#c9d4ff'; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x + 8, y + 18); ctx.lineTo(x + 14, y + 18); ctx.lineTo(x + 20, y + 12);
  ctx.lineTo(x + 20, y + 32); ctx.lineTo(x + 14, y + 26); ctx.lineTo(x + 8, y + 26);
  ctx.closePath(); ctx.fill();
  if (muted) {
    ctx.beginPath(); ctx.moveTo(x + 24, y + 16); ctx.lineTo(x + 36, y + 28); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x + 36, y + 16); ctx.lineTo(x + 24, y + 28); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.arc(x + 22, y + 22, 6, -0.9, 0.9); ctx.stroke();
    ctx.beginPath(); ctx.arc(x + 22, y + 22, 10, -0.9, 0.9); ctx.stroke();
  }
  ctx.restore();
}

function render() {
  ctx.save();
  // screen shake
  if (shakeT > 0) {
    const m = shakeMag * (shakeT / 0.35);
    ctx.translate(rnd(-m, m), rnd(-m, m));
  }
  // dusk orchard sky
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#120a28');
  bg.addColorStop(0.45, '#2b1448');
  bg.addColorStop(0.75, '#4a1e52');
  bg.addColorStop(1, '#1c0f2e');
  ctx.fillStyle = bg; ctx.fillRect(-20, -20, W + 40, H + 40);
  // low sun glow
  const sun = ctx.createRadialGradient(W * 0.72, H * 0.66, 10, W * 0.72, H * 0.66, H * 0.4);
  sun.addColorStop(0, 'rgba(255,150,80,0.35)');
  sun.addColorStop(1, 'rgba(255,150,80,0)');
  ctx.fillStyle = sun; ctx.fillRect(-20, -20, W + 40, H + 40);
  // orchard hill silhouettes
  ctx.fillStyle = '#140b26';
  ctx.beginPath();
  ctx.moveTo(-20, H);
  ctx.quadraticCurveTo(W * 0.25, H * 0.82, W * 0.5, H * 0.9);
  ctx.quadraticCurveTo(W * 0.75, H * 0.97, W + 20, H * 0.86);
  ctx.lineTo(W + 20, H + 20); ctx.lineTo(-20, H + 20);
  ctx.closePath(); ctx.fill();
  // frenzy tint
  if (frenzyT > 0) {
    ctx.fillStyle = 'rgba(255,157,245,0.08)';
    ctx.fillRect(-20, -20, W + 40, H + 40);
  }

  for (const f of fruits) drawFruit(f);
  for (const h of halves) drawHalf(h);
  // juice particles
  for (const p of parts) {
    ctx.globalAlpha = clamp(p.life * 1.8, 0, 1);
    ctx.fillStyle = p.col;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * clamp(p.life * 2, 0.3, 1), 0, 6.29); ctx.fill();
  }
  ctx.globalAlpha = 1;
  drawTrail();
  // floating texts
  ctx.textAlign = 'center';
  for (const t of floatingTexts) {
    ctx.globalAlpha = clamp(t.life * 1.5, 0, 1);
    ctx.font = '800 ' + t.size + 'px -apple-system, "Segoe UI", system-ui, sans-serif';
    ctx.fillStyle = t.col;
    ctx.fillText(t.txt, t.x, t.y);
  }
  ctx.globalAlpha = 1;

  if (state === 'ready') {
    ctx.textAlign = 'center';
    ctx.fillStyle = '#fff';
    ctx.font = '800 52px -apple-system, "Segoe UI", system-ui, sans-serif';
    ctx.fillText('SLICE STORM', W / 2, H * 0.38);
    ctx.font = '600 20px -apple-system, "Segoe UI", system-ui, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.fillText('Swipe to slice. Dodge the bombs.', W / 2, H * 0.38 + 44);
    ctx.fillStyle = '#ffe066';
    ctx.fillText('Tap to start', W / 2, H * 0.38 + 84);
  }
  if (state === 'dead') {
    ctx.textAlign = 'center';
    ctx.fillStyle = '#fff';
    ctx.font = '800 52px -apple-system, "Segoe UI", system-ui, sans-serif';
    ctx.fillText('GAME OVER', W / 2, H * 0.38);
    ctx.font = '600 24px -apple-system, "Segoe UI", system-ui, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.fillText('Score ' + score + '   Best ' + best, W / 2, H * 0.38 + 46);
    if (deadT > 0.8) {
      ctx.fillStyle = '#8ef7ff';
      ctx.fillText('Tap to retry', W / 2, H * 0.38 + 88);
    }
  }
  drawHUD();
  drawMute();
  ctx.restore();
}

// ---------- input wiring ----------
cv.addEventListener('pointerdown', e => { e.preventDefault(); onDown(e.clientX, e.clientY); }, { passive: false });
cv.addEventListener('pointermove', e => { e.preventDefault(); onMove(e.clientX, e.clientY); }, { passive: false });
window.addEventListener('pointerup', onUp);
window.addEventListener('pointercancel', onUp);

// ---------- main loop ----------
let lastT = 0;
function frame(t) {
  const dt = Math.min(0.05, (t - lastT) / 1000 || 0.016);
  lastT = t;
  if (state === 'play' || state === 'dead') step(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---------- debug ----------
window.__ss = {
  get state() { return state; },
  get score() { return score; },
  get lives() { return lives; },
  get misses() { return misses; },
  get combo() { return combo; },
  get frenzy() { return frenzyT > 0; },
  get fruitCount() { return fruits.length; },
  fruits() { return fruits.map(f => ({ x: Math.round(f.x), y: Math.round(f.y), type: f.type, sliced: f.sliced })); },
  spawn() { spawnFruit(); },
  swipe(x1, y1, x2, y2) { // test helper: simulate a swipe segment
    const px = lastSX, py = lastSY;
    lastSX = x2; lastSY = y2;
    for (const f of fruits) {
      if (f.sliced) continue;
      if (segDist(f.x, f.y, x1, y1, x2, y2) < f.r + 6) {
        sliceFruit(f, x2, y2); onSlice(f, 0);
      }
    }
  },
  start() { if (state === 'ready') { state = 'play'; reset(); } }
};
</script>
