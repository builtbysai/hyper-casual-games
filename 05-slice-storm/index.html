<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1422">
<meta name="description" content="A fast, tactile swipe-to-slice arcade game. Build a streak, dodge bombs, and trigger Frenzy.">
<title>Slice Storm</title>
<!-- SLICE-STORM-05 -->
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0b1422;
    touch-action: none; -webkit-user-select: none; user-select: none;
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif; }
  canvas { display: block; position: fixed; inset: 0; }
</style>
</head>
<body>
<canvas id="c" role="application" tabindex="0" aria-label="Slice Storm. Swipe or drag across fruit to slice. Avoid bombs. Press Space to start or restart, P to pause, M to mute."></canvas>
<script>
'use strict';
// SLICE STORM — game 05. Model: Fruit Ninja. Swipe to slice.
// Twist: FRENZY (3+ fruit in one swipe = 3s slow-mo + 2x), golden fruit (10x).
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, S = 1; // S = UI scale factor for responsiveness
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  S = clamp(Math.min(W / 400, H / 680), 0.75, 1.35); // consistent targets on tall phones and wide displays
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// ---------- utils ----------
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function rnd(a, b) { return a + Math.random() * (b - a); }
// fitFont: set font size so text fits within maxW (scales down from baseSize)
function fitFont(text, baseSize, maxW, weight = 800) {
  let size = baseSize;
  ctx.font = `${weight} ${size}px -apple-system, "Segoe UI", system-ui, sans-serif`;
  while (ctx.measureText(text).width > maxW && size > 12) {
    size -= 2;
    ctx.font = `${weight} ${size}px -apple-system, "Segoe UI", system-ui, sans-serif`;
  }
}
function buzz(ms) {
  try { if (typeof navigator.vibrate === 'function') navigator.vibrate(ms); } catch (e) {}
}
// segment-point distance (for swept swipe collision)
function segDist(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay;
  const L2 = dx * dx + dy * dy;
  let t = L2 ? ((px - ax) * dx + (py - ay) * dy) / L2 : 0;
  t = clamp(t, 0, 1);
  const cx = ax + dx * t, cy = ay + dy * t;
  return Math.hypot(px - cx, py - cy);
}

// ---------- audio ----------
let AC = null, muted = false;
function initAudio() {
  if (AC) return;
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); }
  catch (e) { AC = null; }
}
function audioSuspend() { try { if (AC && AC.state === 'running') AC.suspend(); } catch (e) {} }
function audioResume() { try { if (AC && AC.state === 'suspended' && !muted) AC.resume(); } catch (e) {} }
document.addEventListener('visibilitychange', () => { if (document.hidden) audioSuspend(); else audioResume(); });
window.addEventListener('blur', audioSuspend);
window.addEventListener('focus', audioResume);
window.addEventListener('pagehide', audioSuspend);
function tone(freq, dur, type, vol, when, slideTo) {
  if (!AC || muted) return;
  try {
    const t0 = AC.currentTime + (when || 0);
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.2, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(AC.destination);
    o.start(t0); o.stop(t0 + dur + 0.05);
  } catch (e) {}
}
function noiseBurst(dur, vol, freq) {
  if (!AC || muted) return;
  try {
    const t0 = AC.currentTime, len = Math.floor(AC.sampleRate * dur);
    const buf = AC.createBuffer(1, len, AC.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = AC.createBufferSource(); src.buffer = buf;
    const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq || 2000;
    const g = AC.createGain(); g.gain.value = vol || 0.25;
    src.connect(f).connect(g).connect(AC.destination);
    src.start(t0);
  } catch (e) {}
}
const sfx = {
  slice() { noiseBurst(0.09, 0.28, 4200); tone(900, 0.08, 'sine', 0.1, 0, 2400); },
  splat() { noiseBurst(0.14, 0.22, 900); },
  bomb() { noiseBurst(0.5, 0.4, 180); tone(90, 0.5, 'sawtooth', 0.25, 0, 40); },
  frenzy() { tone(440, 0.3, 'sawtooth', 0.16, 0, 880); tone(660, 0.4, 'sawtooth', 0.12, 0.1, 1320); },
  miss() { tone(220, 0.25, 'sine', 0.16, 0, 110); },
  golden() { tone(880, 0.2, 'triangle', 0.2); tone(1320, 0.3, 'triangle', 0.16, 0.08); },
  over() { tone(330, 0.6, 'sawtooth', 0.2, 0, 80); },
  combo(n) { const p = Math.pow(1.059, Math.min(n, 12)); tone(520 * p, 0.15, 'triangle', 0.14); }
};

// ---------- constants ----------
const GRAV = 1900, MAX_FALL = 1500;
const BEST_KEY = 'slice_best';
const SOUND_KEY = 'slice_sound_enabled';
const F_WATERMELON = 0, F_ORANGE = 1, F_APPLE = 2, F_KIWI = 3, F_BOMB = 4, F_GOLDEN = 5;

// ---------- state ----------
let state = 'ready'; // ready | play | paused | dead
let fruits = [], halves = [], parts = [], trail = [];
let score = 0, best = 0, lives = 3, misses = 0;
let combo = 0, maxCombo = 0;
let frenzyT = 0, shakeT = 0, shakeMag = 0;
let spawnT = 0, elapsed = 0, deadT = 0, ambientT = 0;
let impactRings = [];
let swipeCuts = 0, activePointer = null, lastWave = 0;
let floatingTexts = [];
try {
  best = Math.max(0, parseInt(localStorage.getItem(BEST_KEY) || '0', 10) || 0);
  muted = localStorage.getItem(SOUND_KEY) === 'false';
} catch (e) { best = 0; }
function saveBest() { try { localStorage.setItem(BEST_KEY, String(best)); } catch (e) {} }

const FRUIT_DEF = [
  { r: 42, juice: '#ff4d6d', flesh: '#ff5d7a', skin: '#2d9e5b', score: 10 },  // watermelon
  { r: 34, juice: '#ffa02e', flesh: '#ffab3d', skin: '#ff8c1a', score: 10 },  // orange
  { r: 32, juice: '#ff6b5e', flesh: '#ffd9d2', skin: '#e0302e', score: 10 },  // apple
  { r: 30, juice: '#9fe870', flesh: '#a8e063', skin: '#7a5c3e', score: 10 },  // kiwi
  { r: 34, juice: '#ff9d2e', flesh: '#3a3a44', skin: '#22222a', score: 0 },   // bomb
  { r: 30, juice: '#ffe066', flesh: '#fff3b0', skin: '#f5b800', score: 100 }  // golden
];

function reset() {
  fruits = []; halves = []; parts = []; trail = []; floatingTexts = []; impactRings = [];
  score = 0; lives = 3; misses = 0; combo = 0; maxCombo = 0;
  frenzyT = 0; shakeT = 0; spawnT = 0.25; elapsed = 0; deadT = 0;
  swipeCuts = 0; activePointer = null; swiping = false;
}

function spawnFruit() {
  // A wave flies as a readable group, allowing real multi-fruit strokes.
  // Bombs are separate launches so they cannot hide directly behind fruit.
  const difficulty = clamp(elapsed / 90, 0, 1);
  const isBomb = Math.random() < 0.10 + 0.035 * difficulty;
  const triple = !isBomb && elapsed > 7 && Math.random() < 0.29 + difficulty * 0.10;
  const count = isBomb ? 1 : triple ? 3 : (Math.random() < 0.45 ? 2 : 1);
  const gap = clamp(W * 0.18, 58 * S, 94 * S);
  const center = rnd(W * 0.27, W * 0.73);
  const wave = ++lastWave;
  const speed = Math.sqrt(2 * GRAV * H * rnd(0.49, 0.62));
  for (let i = 0; i < count; i++) {
    let type = isBomb ? F_BOMB : Math.random() < 0.07 ? F_GOLDEN : (Math.random() * 4) | 0;
    const def = FRUIT_DEF[type];
    const r = def.r * S * rnd(0.94, 1.06);
    const x = clamp(center + (i - (count - 1) / 2) * gap, r + 8, W - r - 8);
    fruits.push({
      x, y: H + r + 10 + Math.abs(i - (count - 1) / 2) * 7,
      vx: (W / 2 - x) * rnd(0.09, 0.16),
      vy: -speed * rnd(0.97, 1.04),
      r, type, wave, rot: rnd(-0.4, 0.4), vr: rnd(-2, 2),
      squashT: 0, sliced: false
    });
  }
}

// ---------- slicing ----------
function sliceFruit(f, angle) {
  f.sliced = true;
  const def = FRUIT_DEF[f.type];
  impactRings.push({ x: f.x, y: f.y, r: f.r * 0.6, max: f.r * 1.85, life: 0.34, col: def.juice });
  // The cut line follows the swipe; the two pieces separate across it.
  const normal = angle + Math.PI / 2;
  const sp = 225 * S;
  for (const side of [-1, 1]) {
    halves.push({
      x: f.x, y: f.y,
      vx: f.vx * 0.4 + Math.cos(normal) * sp * side + rnd(-18, 18),
      vy: f.vy * 0.25 + Math.sin(normal) * sp * side - 80,
      rot: f.rot, vr: f.vr + side * rnd(2, 4),
      r: f.r, type: f.type, side, life: 1.15, cutAng: angle
    });
  }
  const n = f.type === F_GOLDEN ? 24 : 14;
  for (let i = 0; i < n; i++) {
    const a = rnd(0, 6.28), speed = rnd(65, 340) * S;
    parts.push({
      x: f.x, y: f.y,
      vx: Math.cos(a) * speed + f.vx * 0.25,
      vy: Math.sin(a) * speed - 70,
      life: rnd(0.28, 0.7), col: def.juice, size: rnd(2, 5) * S
    });
  }
  return def;
}

function onSlice(f) {
  if (f.type === F_BOMB) {
    f.sliced = true;
    lives--;
    shakeT = 0.35; shakeMag = 12;
    sfx.bomb(); buzz(70);
    burstAt(f.x, f.y, '#ff9d52', 26);
    impactRings.push({ x: f.x, y: f.y, r: 8, max: f.r * 3.2, life: 0.5, col: '#ff786d' });
    addText('BOMB', '#ff786d', 28 * S, f.x, f.y - 36);
    combo = 0;
    if (lives <= 0) onDeath('bomb');
    return false;
  }
  combo++;
  maxCombo = Math.max(maxCombo, combo);
  const mult = Math.min(5, 1 + Math.floor(combo / 8));
  let pts = FRUIT_DEF[f.type].score * mult * (frenzyT > 0 ? 2 : 1);
  score += pts;
  if (score > best) { best = score; saveBest(); }
  if (f.type === F_GOLDEN) {
    sfx.golden(); buzz(25);
    addText('+' + pts + ' GOLD', '#ffe3a1', 25 * S, f.x, f.y - 46);
  } else {
    sfx.slice();
    if (combo > 1 && combo % 4 === 0) sfx.combo(combo);
    if (combo > 1) addText('+' + pts, '#fff2da', 21 * S, f.x, f.y - 45);
  }
  if (mult > 1 && combo % 8 === 0) addText('x' + mult + ' STREAK', '#a9f2d7', 23 * S, f.x, f.y - 74);
  return true;
}

function triggerFrenzy() {
  frenzyT = 3;
  sfx.frenzy(); buzz(45);
  addText('FRENZY  /  2×', '#b9f6e4', 32 * S, W / 2, H * 0.31);
}

function processSwipe(px, py, x, y) {
  if (state !== 'play' || Math.hypot(x - px, y - py) < 1.5) return;
  const angle = Math.atan2(y - py, x - px);
  // Resolve nearest hit first, so an explosion stops the rest of this stroke.
  const touched = [];
  for (const f of fruits) {
    if (!f.sliced && segDist(f.x, f.y, px, py, x, y) < f.r + 3 * S) {
      const dx = x - px, dy = y - py;
      const t = clamp(((f.x - px) * dx + (f.y - py) * dy) / (dx * dx + dy * dy), 0, 1);
      touched.push({ f, t });
    }
  }
  touched.sort((a, b) => a.t - b.t);
  for (const hit of touched) {
    if (state !== 'play') break;
    if (hit.f.type !== F_BOMB) sliceFruit(hit.f, angle);
    if (onSlice(hit.f)) {
      swipeCuts++;
      if (swipeCuts >= 3 && frenzyT <= 0) triggerFrenzy();
    }
  }
}



function burstAt(x, y, col, n) {
  for (let i = 0; i < n; i++) {
    const a = rnd(0, 6.28), s = rnd(100, 480);
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 140,
      life: rnd(0.5, 1), col, size: rnd(2, 7) });
  }
}
function addText(txt, col, size, x, y) {
  floatingTexts.push({ txt, col, size, x: x == null ? W / 2 : x, y: y == null ? H * 0.4 : y, life: 1 });
}
function onDeath(reason) {
  if (state !== 'play') return;
  state = 'dead'; deadT = 0; swiping = false; activePointer = null;
  sfx.over(); buzz(120);
}

// ---------- swipe ----------
let swiping = false, lastSX = 0, lastSY = 0;
const muteBox = { x: 0, y: 0, w: 44, h: 44 };
function layoutMute() { muteBox.x = W - 56; muteBox.y = 14; }
function toggleMute() {
  muted = !muted;
  try { localStorage.setItem(SOUND_KEY, String(!muted)); } catch (e) {}
  if (muted) audioSuspend();
  else { initAudio(); audioResume(); }
}
function onDown(x, y, id) {
  if (activePointer !== null) return false;
  layoutMute();
  if (x >= muteBox.x && x <= muteBox.x + muteBox.w &&
      y >= muteBox.y && y <= muteBox.y + muteBox.h) {
    toggleMute(); return false;
  }
  if (state === 'ready') { state = 'play'; reset(); }
  else if (state === 'dead') {
    if (deadT < 0.5) return false;
    state = 'play'; reset();
  } else if (state === 'paused') { state = 'play'; return false; }
  if (state !== 'play') return false;
  if (!muted) { initAudio(); audioResume(); }
  activePointer = id;
  swiping = true; swipeCuts = 0;
  lastSX = x; lastSY = y;
  trail.push({ x, y, age: 0 });
  return true;
}
function onMove(x, y, id) {
  if (!swiping || state !== 'play' || activePointer !== id) return;
  const px = lastSX, py = lastSY;
  lastSX = x; lastSY = y;
  if (Math.hypot(x - px, y - py) < 1) return;
  trail.push({ x, y, age: 0 });
  if (trail.length > 28) trail.shift();
  processSwipe(px, py, x, y);
}
function onUp(id, x, y) {
  if (activePointer !== id) return;
  if (x != null && y != null && swiping) onMove(x, y, id);
  swiping = false;
  activePointer = null;
  swipeCuts = 0;
}
function pause() {
  if (state === 'play') { state = 'paused'; swiping = false; activePointer = null; trail = []; }
}
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
window.addEventListener('blur', pause);



// ---------- physics ----------
function step(dt) {
  if (state === 'play') elapsed += dt;
  // FRENZY slow-mo
  let pdt = dt;
  if (state === 'play' && frenzyT > 0) { frenzyT = Math.max(0, frenzyT - dt); pdt = dt * 0.45; }
  if (shakeT > 0) shakeT -= dt;

  // spawn pacing ramps with score (only while playing)
  if (state === 'play') {
    spawnT -= dt;
    if (spawnT <= 0) {
      spawnFruit();
      spawnT = clamp(1.22 - elapsed * 0.008, 0.67, 1.22);
    }
  }

  // fruit physics (swept-safe: cap fall speed)
  for (let i = fruits.length - 1; i >= 0; i--) {
    const f = fruits[i];
    f.vy += GRAV * pdt;
    if (f.vy > MAX_FALL) f.vy = MAX_FALL;
    f.x += f.vx * pdt; f.y += f.vy * pdt;
    f.rot += f.vr * pdt;
    f.squashT += pdt;
    if (f.sliced) { fruits.splice(i, 1); continue; }
    // missed = fell off bottom (bombs don't count); only counts while playing
    if (f.y - f.r > H + 60) {
      fruits.splice(i, 1);
      if (state === 'play' && f.type !== F_BOMB) {
        misses++; combo = 0;
        sfx.miss(); buzz(30);
        addText('MISS', '#ff8a8a', 28, W / 2, H * 0.5);
        if (misses >= 3) onDeath('misses');
      }
    }
    // despawn far sides
    if (f.x < -f.r - 40 || f.x > W + f.r + 40) {
      const index = fruits.indexOf(f);
      if (index >= 0) fruits.splice(index, 1);
    }
  }

  // halves
  for (let i = halves.length - 1; i >= 0; i--) {
    const h = halves[i];
    h.vy += GRAV * pdt;
    if (h.vy > MAX_FALL) h.vy = MAX_FALL;
    h.x += h.vx * pdt; h.y += h.vy * pdt;
    h.rot += h.vr * pdt; h.life -= pdt;
    if (h.life <= 0 || h.y > H + 80) halves.splice(i, 1);
  }
  // particles
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.vy += 1400 * pdt;
    p.x += p.vx * pdt; p.y += p.vy * pdt;
    p.life -= pdt;
    if (p.life <= 0) parts.splice(i, 1);
  }
  // trail fade
  for (let i = trail.length - 1; i >= 0; i--) {
    trail[i].age += dt;
    if (trail[i].age > 0.28) trail.splice(i, 1);
  }
  // floating texts
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const t = floatingTexts[i];
    t.life -= dt * 1.1; t.y -= 46 * dt;
    if (t.life <= 0) floatingTexts.splice(i, 1);
  }
  if (state === 'dead') deadT += dt;
  if (parts.length > 320) parts.splice(0, parts.length - 320);
  for (let i = impactRings.length - 1; i >= 0; i--) {
    const ring = impactRings[i]; ring.life -= dt;
    ring.r += (ring.max - ring.r) * Math.min(1, dt * 11);
    if (ring.life <= 0) impactRings.splice(i, 1);
  }
}

// ---------- drawing ----------
function drawFruit(f) {
  const def = FRUIT_DEF[f.type];
  ctx.save();
  ctx.translate(f.x, f.y);
  // launch squash: brief vertical squash right after spawn
  const sq = f.squashT < 0.18 ? 1 - 0.25 * Math.sin((f.squashT / 0.18) * Math.PI) : 1;
  ctx.scale(1 / Math.sqrt(sq), sq);
  ctx.rotate(f.rot * 0.12);
  const r = f.r;
  ctx.shadowColor = 'rgba(0,0,0,.35)';
  ctx.shadowBlur = 10 * S; ctx.shadowOffsetY = 5 * S;
  if (f.type === F_BOMB) {
    const g = ctx.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.1, 0, 0, r);
    g.addColorStop(0, '#5a5a6a'); g.addColorStop(1, '#16161c');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.29); ctx.fill();
    ctx.strokeStyle = '#8a6a3a'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(0, -r); ctx.quadraticCurveTo(r * 0.4, -r * 1.4, r * 0.7, -r * 1.1); ctx.stroke();
    ctx.shadowColor = '#ff9d52'; ctx.shadowBlur = 13;
    ctx.fillStyle = '#ffb567';
    ctx.beginPath(); ctx.arc(r * 0.7, -r * 1.1, 5, 0, 6.29); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#f69b78';ctx.lineWidth=2.5;
    ctx.beginPath();ctx.moveTo(-r*.3,-r*.1);ctx.lineTo(r*.3,r*.42);
    ctx.moveTo(r*.3,-r*.1);ctx.lineTo(-r*.3,r*.42);ctx.stroke();
  } else if (f.type === F_WATERMELON) {
    ctx.fillStyle = def.skin;
    ctx.beginPath(); ctx.ellipse(0, 0, r, r * 0.88, 0, 0, 6.29); ctx.fill();
    ctx.strokeStyle = '#1d6b3c'; ctx.lineWidth = 3;
    for (let i = -2; i <= 2; i++) {
      ctx.beginPath(); ctx.ellipse(i * r * 0.32, 0, r * 0.1, r * 0.82, 0, 0, 6.29); ctx.stroke();
    }
    const g = ctx.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.1, 0, 0, r);
    g.addColorStop(0, 'rgba(255,255,255,0.25)'); g.addColorStop(0.5, 'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(0, 0, r, r * 0.88, 0, 0, 6.29); ctx.fill();
  } else if (f.type === F_GOLDEN) {
    ctx.shadowColor = '#ffe066'; ctx.shadowBlur = 24;
    const g = ctx.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.1, 0, 0, r);
    g.addColorStop(0, '#fff8d0'); g.addColorStop(0.6, '#ffd93d'); g.addColorStop(1, '#c98f00');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.29); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    for (let i = 0; i < 4; i++) {
      const a = elapsed * 2 + i * 1.57;
      ctx.fillRect(Math.cos(a) * r * 1.35 - 1.5, Math.sin(a) * r * 1.35 - 1.5, 3, 3);
    }
  } else {
    const g = ctx.createRadialGradient(-r * 0.35, -r * 0.35, r * 0.1, 0, 0, r * 1.05);
    if (f.type === F_ORANGE) { g.addColorStop(0, '#ffd9a0'); g.addColorStop(0.55, '#ff9d2e'); g.addColorStop(1, '#d96a00'); }
    else if (f.type === F_APPLE) { g.addColorStop(0, '#ff9d9d'); g.addColorStop(0.55, '#e0302e'); g.addColorStop(1, '#8f1414'); }
    else { g.addColorStop(0, '#c9a97a'); g.addColorStop(0.55, '#8a6a44'); g.addColorStop(1, '#5a422a'); }
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.29); ctx.fill();
    if (f.type === F_APPLE) {
      ctx.fillStyle = '#3da35d';
      ctx.beginPath(); ctx.ellipse(r * 0.25, -r * 1.02, r * 0.28, r * 0.14, 0.6, 0, 6.29); ctx.fill();
      ctx.strokeStyle = '#6b4a2a'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(0, -r); ctx.lineTo(0, -r * 1.18); ctx.stroke();
    }
    if (f.type === F_KIWI) {
      ctx.strokeStyle = 'rgba(60,40,20,0.35)'; ctx.lineWidth = 1.5;
      for (let i = 0; i < 10; i++) {
        const a = i * 0.63;
        ctx.beginPath(); ctx.moveTo(Math.cos(a) * r * 0.7, Math.sin(a) * r * 0.7);
        ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); ctx.stroke();
      }
    }
  }
  ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
  if (f.type !== F_BOMB && f.type !== F_GOLDEN) {
    ctx.strokeStyle = 'rgba(255,255,255,.27)';ctx.lineWidth=2.5*S;ctx.lineCap='round';
    ctx.beginPath();ctx.arc(-r*.08,-r*.08,r*.73,3.65,4.93);ctx.stroke();
  }
  ctx.restore();
}

function drawHalf(h) {
  const def = FRUIT_DEF[h.type];
  const r = h.r;
  ctx.save();
  ctx.globalAlpha = clamp(h.life * 1.4, 0, 1);
  ctx.translate(h.x, h.y);
  ctx.rotate(h.cutAng + h.rot * 0.24);
  ctx.shadowColor = 'rgba(0,0,0,.25)';
  ctx.shadowBlur = 10; ctx.shadowOffsetY = 5;
  ctx.beginPath();
  if (h.side < 0) ctx.arc(0, 0, r, -Math.PI / 2, Math.PI / 2);
  else ctx.arc(0, 0, r, Math.PI / 2, Math.PI * 1.5);
  ctx.closePath();
  const g = ctx.createRadialGradient(-r * 0.2, -r * 0.2, 1, 0, 0, r);
  g.addColorStop(0, '#fff8df');
  g.addColorStop(0.25, def.flesh);
  g.addColorStop(0.88, def.flesh);
  g.addColorStop(1, def.skin);
  ctx.fillStyle = g; ctx.fill();
  ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
  ctx.clip();
  if (h.type === F_WATERMELON) {
    ctx.strokeStyle = '#28402c'; ctx.fillStyle = '#342522';
    for (let i = -2; i <= 2; i++) {
      const yy = i * r * 0.24;
      const xx = (h.side < 0 ? 1 : -1) * r * 0.44;
      ctx.save(); ctx.translate(xx, yy); ctx.rotate(0.25);
      ctx.beginPath(); ctx.ellipse(0, 0, r * 0.055, r * 0.095, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    }
  } else if (h.type === F_KIWI) {
    ctx.fillStyle = '#fbebc0';
    ctx.beginPath(); ctx.arc(0, 0, r * 0.23, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#2b3624';
    for (let i = 0; i < 16; i++) {
      const a = i * Math.PI / 8;
      ctx.beginPath(); ctx.ellipse(Math.cos(a) * r * 0.55, Math.sin(a) * r * 0.55, r * .035, r * .065, a, 0, Math.PI * 2); ctx.fill();
    }
  } else if (h.type === F_ORANGE) {
    ctx.strokeStyle = 'rgba(255,250,215,.45)'; ctx.lineWidth = 1.5 * S;
    for (let i = 0; i < 9; i++) {
      const a = i * Math.PI * 2 / 9;
      ctx.beginPath(); ctx.moveTo(0, 0);
      ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); ctx.stroke();
    }
  } else if (h.type === F_APPLE) {
    ctx.fillStyle = 'rgba(122,73,48,.8)';
    ctx.beginPath(); ctx.ellipse(0, 0, r*.06, r*.15, 0.4, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function drawTrail() {
  if (trail.length < 2) return;
  ctx.save();
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  // A tapered blade has a soft colored bloom and a sharp white core.
  for (let i = 1; i < trail.length; i++) {
    const a = trail[i - 1], b = trail[i];
    const life = Math.max(0, 1 - b.age / 0.28);
    ctx.globalAlpha = life * 0.65;
    ctx.strokeStyle = '#74e5d6'; ctx.shadowColor = '#70f8e4';
    ctx.shadowBlur = 18; ctx.lineWidth = (3 + 11 * life) * S;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    ctx.globalAlpha = life * 0.96;
    ctx.shadowBlur = 3; ctx.strokeStyle = '#fffbed';
    ctx.lineWidth = (1 + 3.1 * life) * S;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
  ctx.restore();
}

function drawHUD() {
  if (state !== 'play' && state !== 'paused') return;
  const top = Math.max(12, 12 + (parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--safe-top')) || 0));
  ctx.save();
  ctx.textAlign = 'left';
  ctx.font = '650 11px -apple-system, "Segoe UI", system-ui, sans-serif';
  ctx.fillStyle = '#98abae';
  ctx.fillText('S C O R E', 20, top + 15);
  ctx.fillStyle = '#fff6e7';
  ctx.font = '800 42px -apple-system, "Segoe UI", system-ui, sans-serif';
  ctx.fillText(String(score), 18, top + 57);
  ctx.fillStyle = '#9daab2';
  ctx.font = '600 12px -apple-system, "Segoe UI", system-ui, sans-serif';
  ctx.fillText('BEST ' + best, 20, top + 77);

  ctx.textAlign = 'right';
  ctx.font = '650 10px -apple-system, "Segoe UI", system-ui, sans-serif';
  ctx.fillStyle = '#9daab2';
  ctx.fillText('LIVES', W - 78, top + 12);
  for (let i = 0; i < 3; i++) {
    const x = W - 134 + i * 23, y = top + 28;
    ctx.fillStyle = i < lives ? '#ee8277' : 'rgba(238,130,119,.13)';
    ctx.strokeStyle = i < lives ? '#ffaea1' : 'rgba(238,130,119,.34)';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(x, y, 6, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  }
  ctx.fillStyle = '#9daab2';
  ctx.fillText('MISSES', W - 78, top + 59);
  for (let i = 0; i < 3; i++) {
    const x = W - 134 + i * 23, y = top + 73;
    ctx.strokeStyle = i < misses ? '#ee8277' : 'rgba(157,170,178,.32)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x - 4, y - 4); ctx.lineTo(x + 4, y + 4);
    ctx.moveTo(x + 4, y - 4); ctx.lineTo(x - 4, y + 4); ctx.stroke();
  }

  const mult = Math.min(5, 1 + Math.floor(combo / 8));
  if (mult > 1) {
    ctx.textAlign = 'center';
    ctx.fillStyle = '#a9f2d7';
    ctx.font = '800 18px -apple-system, "Segoe UI", system-ui, sans-serif';
    ctx.fillText('STREAK  ×' + mult, W / 2, H - 38);
  }
  if (frenzyT > 0) {
    const barW = Math.min(W * 0.53, 230), x = (W - barW) / 2;
    ctx.fillStyle = 'rgba(169,242,215,.2)';
    ctx.fillRect(x, top + 22, barW, 2);
    ctx.fillStyle = '#a9f2d7';
    ctx.fillRect(x, top + 22, barW * (frenzyT / 3), 2);
    ctx.textAlign = 'center';
    ctx.font = '750 12px -apple-system, "Segoe UI", system-ui, sans-serif';
    ctx.fillText('F R E N Z Y    2×', W / 2, top + 15);
  }
  ctx.restore();
}

function drawMute() {
  layoutMute();
  const x = muteBox.x, y = muteBox.y;
  ctx.save();
  ctx.globalAlpha = 0.55;
  ctx.strokeStyle = '#c9d4ff'; ctx.fillStyle = '#c9d4ff'; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x + 8, y + 18); ctx.lineTo(x + 14, y + 18); ctx.lineTo(x + 20, y + 12);
  ctx.lineTo(x + 20, y + 32); ctx.lineTo(x + 14, y + 26); ctx.lineTo(x + 8, y + 26);
  ctx.closePath(); ctx.fill();
  if (muted) {
    ctx.beginPath(); ctx.moveTo(x + 24, y + 16); ctx.lineTo(x + 36, y + 28); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x + 36, y + 16); ctx.lineTo(x + 24, y + 28); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.arc(x + 22, y + 22, 6, -0.9, 0.9); ctx.stroke();
    ctx.beginPath(); ctx.arc(x + 22, y + 22, 10, -0.9, 0.9); ctx.stroke();
  }
  ctx.restore();
}

function drawBackground() {
  const bg = ctx.createLinearGradient(0, 0, W * 0.3, H);
  bg.addColorStop(0, '#08121e');
  bg.addColorStop(0.52, '#142334');
  bg.addColorStop(1, '#342632');
  ctx.fillStyle = bg; ctx.fillRect(-25, -25, W + 50, H + 50);

  // Soft stage light, restrained against the dark orchard.
  const glow = ctx.createRadialGradient(W * 0.53, H * 0.76, 0, W * 0.53, H * 0.76, Math.max(W, H) * 0.65);
  glow.addColorStop(0, 'rgba(219,139,103,.19)');
  glow.addColorStop(.5, 'rgba(133,108,135,.05)');
  glow.addColorStop(1, 'rgba(133,108,135,0)');
  ctx.fillStyle = glow; ctx.fillRect(-25, -25, W + 50, H + 50);

  // Quiet geometry creates depth without competing with targets.
  ctx.strokeStyle = 'rgba(211,228,212,.055)';
  ctx.lineWidth = 1;
  const spacing = Math.max(54, 76 * S);
  const offset = (ambientT * 7) % spacing;
  for (let y = H * .34 + offset; y < H + spacing; y += spacing) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y - W * .13); ctx.stroke();
  }
  ctx.fillStyle = '#0e1723';
  ctx.beginPath(); ctx.moveTo(-25, H);
  ctx.bezierCurveTo(W*.17,H*.88,W*.3,H*.92,W*.5,H*.94);
  ctx.bezierCurveTo(W*.7,H*.97,W*.82,H*.86,W+25,H*.90);
  ctx.lineTo(W+25,H+25);ctx.lineTo(-25,H+25);ctx.fill();
  ctx.strokeStyle = 'rgba(253,190,143,.18)';ctx.lineWidth = 1;
  ctx.beginPath();ctx.moveTo(0,H*.917);ctx.quadraticCurveTo(W*.32,H*.935,W*.51,H*.94);ctx.stroke();
  // The occasional drifting ember is deterministic and cheap to draw.
  ctx.fillStyle = 'rgba(255,212,158,.27)';
  for (let i = 0; i < 15; i++) {
    const x = (Math.sin(i*42.73)*.5+.5)*W;
    const y = (((i*103.7 - ambientT*(5+i%4)) % (H+70) + H+70) % (H+70));
    ctx.globalAlpha = .15 + .3 * (Math.sin(ambientT + i*2.2)*.5+.5);
    ctx.beginPath();ctx.arc(x,y,0.8 + i%3*.45,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
  if (frenzyT > 0) {
    ctx.fillStyle = 'rgba(104,240,199,.045)';
    ctx.fillRect(0, 0, W, H);
  }
}

function drawIdle() {
  ctx.save(); ctx.textAlign = 'center';
  ctx.font = '700 11px -apple-system, "Segoe UI", system-ui, sans-serif';
  ctx.fillStyle = '#9fd7c7';
  ctx.fillText('N I G H T   A R C A D E', W / 2, H * .145);
  fitFont('SLICE STORM', Math.min(58, W * .145), W * .92, 850);
  ctx.fillStyle = '#fff3e1';
  ctx.fillText('SLICE STORM', W / 2, H * .244);

  const mid = W/2, y = H*.49;
  const arrangement = [
    { type: F_ORANGE, dx: -108, dy: 20, r: 36 },
    { type: F_WATERMELON, dx: 0, dy: -25, r: 44 },
    { type: F_KIWI, dx: 103, dy: 14, r: 33 },
  ];
  for (const a of arrangement) {
    drawFruit({ x: mid + a.dx*S, y: y + a.dy*S + Math.sin(ambientT*1.4+a.dx)*5,
      r:a.r*S, type:a.type, rot:Math.sin(ambientT*.4+a.dx)*.3, squashT:1 });
  }
  const blade = ctx.createLinearGradient(mid-150*S,y+66*S,mid+150*S,y-75*S);
  blade.addColorStop(0,'rgba(147,245,217,0)');
  blade.addColorStop(.5,'rgba(210,255,236,.65)');
  blade.addColorStop(1,'rgba(147,245,217,0)');
  ctx.strokeStyle=blade; ctx.lineWidth=2*S;
  ctx.beginPath();ctx.moveTo(mid-154*S,y+64*S);ctx.lineTo(mid+151*S,y-68*S);ctx.stroke();

  ctx.font = '750 20px -apple-system, "Segoe UI", system-ui, sans-serif';
  ctx.fillStyle = '#fff6e6';
  ctx.fillText('SWIPE TO BEGIN', mid, H*.75);
  ctx.strokeStyle = '#80ddbf';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(mid-45,H*.75+10);ctx.lineTo(mid+45,H*.75+10);ctx.stroke();
  ctx.fillStyle='#b3b8bd';
  fitFont('Slice fruit  ·  Avoid bombs  ·  Chain 3 for Frenzy', 14, W*.89, 550);
  ctx.fillText('Slice fruit  ·  Avoid bombs  ·  Chain 3 for Frenzy',mid,H*.835);
  if (best > 0) {
    ctx.fillStyle='#c1a88c';ctx.font='650 12px -apple-system, "Segoe UI", system-ui, sans-serif';
    ctx.fillText('PERSONAL BEST    ' + best, mid, H*.91);
  }
  ctx.restore();
}

function drawEnd() {
  ctx.save();
  ctx.fillStyle = 'rgba(6,12,20,.83)';ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.fillStyle='#a9f2d7';ctx.font='700 11px -apple-system, "Segoe UI", system-ui, sans-serif';
  ctx.fillText('R U N   C O M P L E T E',W/2,H*.25);
  fitFont('GAME OVER', 50, W*.87, 850);
  ctx.fillStyle='#fff4e3';ctx.fillText('GAME OVER',W/2,H*.35);
  ctx.fillStyle='#a3adb0';ctx.font='650 12px -apple-system, "Segoe UI", system-ui, sans-serif';
  ctx.fillText('SCORE',W/2,H*.45);
  ctx.font='850 65px -apple-system, "Segoe UI", system-ui, sans-serif';
  ctx.fillStyle='#fff4e3';ctx.fillText(String(score),W/2,H*.55);
  ctx.font='650 14px -apple-system, "Segoe UI", system-ui, sans-serif';
  ctx.fillStyle='#c9b5a3';
  ctx.fillText('BEST  ' + best + '     /     LONGEST STREAK  ' + maxCombo,W/2,H*.62);
  if (deadT >= .5) {
    ctx.fillStyle='#a9f2d7';ctx.font='750 20px -apple-system, "Segoe UI", system-ui, sans-serif';
    ctx.fillText('TAP TO TRY AGAIN',W/2,H*.77);
  }
  ctx.restore();
}

function drawPause() {
  ctx.save();ctx.fillStyle='rgba(6,12,20,.83)';ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  fitFont('PAUSED',52,W*.8);
  ctx.fillStyle='#fff3e1';ctx.fillText('PAUSED',W/2,H*.45);
  ctx.font='650 18px -apple-system, "Segoe UI", system-ui, sans-serif';
  ctx.fillStyle='#a9f2d7';ctx.fillText('TAP TO RESUME',W/2,H*.55);
  ctx.restore();
}

function render() {
  ctx.save();
  drawBackground();
  if (state === 'ready') {
    drawIdle();
    drawMute();
    ctx.restore();
    return;
  }
  if (shakeT > 0 && state === 'play') {
    const m = shakeMag * (shakeT / .35);
    ctx.translate(rnd(-m,m),rnd(-m,m));
  }
  for (const f of fruits) drawFruit(f);
  for (const h of halves) drawHalf(h);
  for (const p of parts) {
    ctx.globalAlpha = clamp(p.life * 1.7, 0, 1);
    ctx.fillStyle = p.col;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size*clamp(p.life*1.7,.2,1),0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
  for (const ring of impactRings) {
    ctx.globalAlpha = clamp(ring.life*2.5,0,1)*.6;
    ctx.strokeStyle=ring.col;ctx.lineWidth=2*S;
    ctx.beginPath();ctx.arc(ring.x,ring.y,ring.r,0,Math.PI*2);ctx.stroke();
  }
  ctx.globalAlpha=1;
  drawTrail();
  ctx.textAlign='center';
  for (const t of floatingTexts) {
    ctx.globalAlpha=clamp(t.life*1.5,0,1);
    ctx.font='800 '+t.size+'px -apple-system, "Segoe UI", system-ui, sans-serif';
    ctx.fillStyle=t.col;
    ctx.fillText(t.txt,t.x,t.y);
  }
  ctx.globalAlpha=1;
  drawHUD();
  drawMute();
  if (state === 'dead') drawEnd();
  else if (state === 'paused') drawPause();
  ctx.restore();
}

// ---------- input wiring ----------
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (onDown(e.clientX, e.clientY, e.pointerId)) {
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  }
}, { passive: false });
cv.addEventListener('pointermove', e => {
  if (activePointer !== e.pointerId) return;
  e.preventDefault();
  const points = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  if (points.length) for (const p of points) onMove(p.clientX, p.clientY, e.pointerId);
  else onMove(e.clientX, e.clientY, e.pointerId);
}, { passive: false });
cv.addEventListener('pointerup', e => {
  onUp(e.pointerId, e.clientX, e.clientY);
  try { cv.releasePointerCapture(e.pointerId); } catch (err) {}
});
cv.addEventListener('pointercancel', e => onUp(e.pointerId));
window.addEventListener('keydown', e => {
  if (e.repeat) return;
  if (e.key.toLowerCase() === 'm') toggleMute();
  else if (e.key.toLowerCase() === 'p' || e.key === 'Escape') {
    if (state === 'paused') state = 'play'; else pause();
  } else if (e.key === ' ' || e.key === 'Enter') {
    if (state === 'ready') { state = 'play'; reset(); }
    else if (state === 'dead' && deadT >= 0.5) { state = 'play'; reset(); }
    else if (state === 'paused') state = 'play';
    e.preventDefault();
  }
});



// ---------- main loop ----------
let lastT = 0;
function frame(t) {
  const dt = Math.min(0.05, (t - lastT) / 1000 || 0.016);
  lastT = t;
  ambientT += dt;
  if (state === 'play' || state === 'dead') step(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---------- debug (read-only snapshots plus test helpers) ----------
window.__ss = {
  get state() { return state; },
  get score() { return score; },
  get lives() { return lives; },
  get misses() { return misses; },
  get combo() { return combo; },
  get frenzy() { return frenzyT > 0; },
  get fruitCount() { return fruits.length; },
  fruits() { return fruits.map(f => ({ x: Math.round(f.x), y: Math.round(f.y), r: f.r, type: f.type, sliced: f.sliced })); },
  spawn() { if (state === 'play') spawnFruit(); },
  swipe(x1, y1, x2, y2) { if (state === 'play') { swipeCuts = 0; processSwipe(x1, y1, x2, y2); } },
  start() { if (state === 'ready') { state = 'play'; reset(); } },
  setFruit(type, x, y) {
    if (state !== 'play') return;
    const def = FRUIT_DEF[type]; if (!def) return;
    fruits.push({ x, y, vx: 0, vy: 0, r: def.r * S, type, rot: 0, vr: 0, squashT: 1, sliced: false });
  }
};


</script>
