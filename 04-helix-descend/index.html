<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#10132b">
<title>Helix Descend</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10132b;
    overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
  canvas:active{cursor:grabbing}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* HELIX DESCEND
 * Rotate the tower to guide a bouncing ball through the openings.
 * Avoid red sectors. Chain clean drops for a short smash streak.
 * Pointer, touch, and keyboard controls. No dependencies.
 */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// ---------- utils ----------
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function angNorm(a) { while (a > Math.PI) a -= Math.PI * 2; while (a < -Math.PI) a += Math.PI * 2; return a; }
function angDist(a, b) { return Math.abs(angNorm(a - b)); }
function buzz(ms) {
  try { if (typeof navigator.vibrate === 'function') navigator.vibrate(ms); } catch (e) {}
}

// audio cleanup: suspend on tab hide / window blur / page close, resume on return
function audioSuspend() { try { if (AC && AC.state === 'running') AC.suspend(); } catch (e) {} }
function audioResume() { try { if (AC && AC.state === 'suspended' && !muted) AC.resume(); } catch (e) {} }
document.addEventListener('visibilitychange', () => { if (document.hidden) audioSuspend(); else audioResume(); });
window.addEventListener('blur', audioSuspend);
window.addEventListener('focus', audioResume);
window.addEventListener('pagehide', audioSuspend);

// ---------- sound / adaptive original score ----------
// All tones are synthesized locally; no samples, streams or external assets.
// Music scheduling uses the audio clock, not animation frame timing.
let AC=null, muted=false, masterBus=null, musicBus=null, fxBus=null;
let nextNoteTime=0, musicStep=0, musicStarted=false, padBus=null, audioPeak=0;
let noiseBuffer=null;
function initAudio(){
  if(AC)return;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    masterBus=AC.createGain();masterBus.gain.value=.76;
    const limiter=AC.createDynamicsCompressor();
    limiter.threshold.value=-17;limiter.knee.value=15;
    limiter.ratio.value=4;limiter.attack.value=.004;limiter.release.value=.19;
    masterBus.connect(limiter).connect(AC.destination);
    musicBus=AC.createGain();musicBus.gain.value=0;musicBus.connect(masterBus);
    fxBus=AC.createGain();fxBus.gain.value=.85;fxBus.connect(masterBus);
    padBus=AC.createBiquadFilter();padBus.type='lowpass';padBus.frequency.value=900;
    padBus.connect(musicBus);
    noiseBuffer=AC.createBuffer(1,Math.floor(AC.sampleRate*.45),AC.sampleRate);
    const d=noiseBuffer.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1);
  }catch(e){AC=null;}
}
function audioSuspend(){try{if(AC&&AC.state==='running')AC.suspend();}catch(e){}}
function audioResume(){
  try{if(AC&&AC.state==='suspended'&&!muted){
    AC.resume();nextNoteTime=0;
  }}catch(e){}
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){if(state==='play')pauseGame();audioSuspend();}
});
window.addEventListener('blur',()=>{if(state==='play')pauseGame();audioSuspend();});
window.addEventListener('focus',()=>{if(state==='play')audioResume();});
window.addEventListener('pagehide',audioSuspend);
function voice(freq,time,dur,vol,kind,target,filter,cutoff){
  if(!AC||muted||AC.state!=='running')return;
  try{
    const o=AC.createOscillator(),g=AC.createGain();
    o.type=kind||'sine';o.frequency.setValueAtTime(freq,time);
    if(target&&target>0)o.frequency.exponentialRampToValueAtTime(target,time+dur*.8);
    const peak=Math.max(.0002,vol);
    g.gain.setValueAtTime(.0001,time);
    g.gain.exponentialRampToValueAtTime(peak,time+.012);
    g.gain.exponentialRampToValueAtTime(.0001,time+dur);
    if(cutoff){
      const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=cutoff;
      o.connect(f).connect(g);
    }else o.connect(g);
    g.connect(filter||fxBus);
    o.start(time);o.stop(time+dur+.025);
  }catch(e){}
}
function tone(freq,dur,kind,volume,delay,target){
  if(!AC||muted)return;
  voice(freq,AC.currentTime+(delay||0),dur,volume||.13,kind||'sine',target,fxBus);
}
function noiseBurst(dur,vol,freq){
  if(!AC||muted||!noiseBuffer||AC.state!=='running')return;
  try{
    const start=AC.currentTime;
    const src=AC.createBufferSource();src.buffer=noiseBuffer;
    const band=AC.createBiquadFilter();band.type='bandpass';
    band.frequency.value=freq||1300;band.Q.value=.7;
    const env=AC.createGain();
    env.gain.setValueAtTime(Math.max(.001,vol||.08),start);
    env.gain.exponentialRampToValueAtTime(.0001,start+dur);
    src.connect(band).connect(env).connect(fxBus);
    src.start(start);src.stop(start+dur);
  }catch(e){}
}
function musicNote(f,time,dur,volume,kind){
  voice(f,time,dur,volume,kind||'sine',null,musicBus,'',0);
}
function chordPad(root,time){
  for(const [ratio,vol] of [[1,.014],[1.1892,.010],[1.4983,.009]]){
    voice(root*ratio,time,2.5,vol,'sine',null,padBus,500);
  }
}
const MUSIC_CHORDS=[
  {root:130.81,melody:[261.63,311.13,392,466.16,523.25]}, // C minor
  {root:103.83,melody:[207.65,261.63,311.13,415.30,466.16]}, // Ab
  {root:155.56,melody:[311.13,392,466.16,523.25,622.25]}, // Eb
  {root:116.54,melody:[233.08,293.66,349.23,466.16,587.33]} // Bb
];
function scheduleMusic(){
  if(!AC||muted||AC.state!=='running')return;
  const shouldPlay=state==='play' && musicEnabled;
  const now=AC.currentTime;
  if(musicBus){
    musicBus.gain.setTargetAtTime(shouldPlay?.78:0,now,.19);
    padBus.frequency.setTargetAtTime(fireball?1450:streak>=2?1120:760,now,.17);
  }
  if(!shouldPlay){nextNoteTime=0;musicStarted=false;return;}
  if(!nextNoteTime){nextNoteTime=now+.06;musicStep=0;musicStarted=true;}
  // 94 BPM, eight subdivisions. Enough room for impacts to breathe.
  const tick=60/94/2;
  let safety=0;
  while(nextNoteTime<now+.14&&safety++<4){
    const step=musicStep%64;
    const bar=Math.floor(step/16),i=step%16;
    const chord=MUSIC_CHORDS[bar];
    const active=streak>=2 || fireball;
    if(i===0)chordPad(chord.root,nextNoteTime);
    if(i===0||i===8){
      voice(chord.root/2,nextNoteTime,.33,active?.052:.037,'triangle',null,musicBus,600);
    }
    if(i===0||i===6||i===11){
      const note=chord.melody[(i+(active?2:0)+bar)%chord.melody.length];
      voice(note,nextNoteTime,.23,active?.028:.019,'sine',null,musicBus,1600);
    }
    if(active && (i===3||i===14)){
      const note=chord.melody[(bar+i)%chord.melody.length]*2;
      voice(note,nextNoteTime,.11,fireball?.023:.012,'triangle',null,musicBus,2100);
    }
    musicStep++;nextNoteTime+=tick;
  }
}
const sfx={
  tap(){tone(520,.06,'sine',.052,0,760);},
  bounce(combo){
    tone(210,.17,'sine',.14,0,118);
    tone(370+Math.min(combo,6)*17,.095,'triangle',.048,.009);
  },
  perfect(combo){
    const melody=[523.25,622.25,698.46,783.99,932.33,1046.5];
    const n=melody[(combo-1)%melody.length];
    tone(n,.25,'sine',.12);tone(n*1.5,.15,'triangle',.045,.045);
  },
  shatter(){noiseBurst(.19,.15,2600);tone(760,.16,'triangle',.05,0,420);},
  spring(){tone(180,.34,'sine',.16,0,740);tone(540,.23,'triangle',.06,.07,920);},
  fireball(){tone(170,.54,'sawtooth',.075,0,430);tone(523,.24,'sine',.11,.10);tone(783.99,.34,'sine',.1,.21);noiseBurst(.13,.08,900);},
  smash(){tone(170,.25,'sine',.16,0,65);noiseBurst(.18,.17,1100);},
  death(){tone(466.16,.27,'sine',.1,0,311.13);tone(311.13,.43,'triangle',.07,.13,155.56);noiseBurst(.13,.08,550);},
  milestone(){tone(523.25,.28,'sine',.105);tone(659.25,.30,'sine',.095,.10);tone(783.99,.38,'triangle',.09,.23);}
};

// ---------- game constants ----------
const GRAV = 2450, BOUNCE_V = -610, SPRING_V = -920, MAX_FALL = 1580;
const BALL_R = 14, PLAT_DY = 164;
const TOWER_R = 46;
const BEST_KEY = 'helix_best';
const SOUND_KEY = 'helix_sound';
const MUSIC_KEY = 'helix_music';
let musicEnabled=true;
const TAU = Math.PI * 2;
let generatedCount = 0, depth = 0, towerAngle = 0, level = 1;
let lastGap = 0, flash = 0, shake = 0, dangerPulse = 0;
let cameraKick = 0, nearCallT = 0, surgeT = 0, impactFreeze = 0;
let tilt = 0, hitPulse = 0, rotationSpeed = 0, lastPointerTime = 0;
let shards = [], trail = [], floatingScore = 0, latestScore = 0;
const REDUCED_MOTION = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const PALETTES = [
  { skyA:'#0d1528', skyB:'#213f4b', deep:'#102432', rim:'#b5eadb', gleam:'#e5ffef', accent:'#83e7c8', hot:'#ff686f', yellow:'#ffe2a4' },
  { skyA:'#21172a', skyB:'#5b384c', deep:'#30213e', rim:'#e4bde5', gleam:'#fff0f2', accent:'#e5b6ec', hot:'#ff7d78', yellow:'#ffe5a7' },
  { skyA:'#131e2a', skyB:'#274a62', deep:'#183248', rim:'#b4d9f9', gleam:'#f5faff', accent:'#95d9fc', hot:'#ff7780', yellow:'#ffd99a' }
];
function theme() { return PALETTES[(level-1) % PALETTES.length]; }
function rotateTower(rad) {
  if (!rad) return;
  towerAngle += rad;
  for (const p of platforms) p.rot += rad;
}


// platform types
const T_NORMAL = 0, T_FRAGILE = 1, T_SPRING = 2, T_RED = 3;

// ---------- state ----------
let state = 'ready'; // ready | play | dead
let rng = mulberry32(1);
let platforms = [];
let ball = { y: 0, vy: 0 };
let camY = 0; // world y at screen top-ish anchor
let score = 0, best = 0;
let streak = 0;        // consecutive gap passes without bouncing
let fireball = false, fireCharge = 0;
let perfectStreak = 0;
let deadT = 0, deathReason = '';
let floats = [];      // popup texts {x,y,txt,life,col,size}
let parts = [];       // particles {x,y,vx,vy,life,col,size}
let rings = [];       // bounce impact rings {y,r,life}
let dust = [];        // background crystal dust
let rotVel = 0;
let bounceT = 99; // time since last bounce (for impact squash)
let elapsed = 0;
let milestoneHit = 0;

try { best = parseInt(localStorage.getItem(BEST_KEY) || '0', 10) || 0; muted = localStorage.getItem(SOUND_KEY) === 'off'; musicEnabled=localStorage.getItem(MUSIC_KEY)!=='off'; } catch (e) { best = 0; }
function saveBest() { try { localStorage.setItem(BEST_KEY, String(best)); } catch (e) {} }

// screen anchor for the ball
function ballScreenY() { return H * (H < 530 ? 0.35 : 0.34); }
function ballVisualY() { return ball.y - camY; }
function worldToScreen(y) { return y - camY; }
function towerRadius() { return clamp(Math.min(W * 0.125, H * 0.065), 35, 56); }

// ---------- platform generation ----------
// Each ring has one opening, and some have a small red danger wedge.
// Ring angles follow a walk, rather than scattering at random, so chains
// are achievable through deliberate small swipes.
function genPlatform(y, index) {
  const drift = (rng() * 2 - 1) * (index < 7 ? 0.98 : 1.3);
  lastGap = angNorm(lastGap + drift);
  const gapW = index < 4 ? 1.52 : clamp(1.42 - Math.max(0, index - 6) * 0.006, 0.94, 1.42);
  const hazardous = index > 6 && rng() < clamp(0.17 + index * 0.002, 0, 0.36);
  const typeRoll = rng();
  let type = T_NORMAL;
  if (hazardous) type = T_RED;
  else if (index > 5 && typeRoll < 0.12) type = T_FRAGILE;
  else if (index > 8 && typeRoll < 0.19) type = T_SPRING;
  return { y, rot: 0, gapA: lastGap, gapW, type, gone: false,
    dangerA: angNorm(lastGap + Math.PI + (rng() - 0.5) * 0.55),
    dangerW: clamp(0.72 + index * 0.002, 0.72, 1.02), index };
}
function reset(seed) {
  rng = mulberry32(seed || 1);
  platforms = [];
  generatedCount = 0; depth = 0; level = 1; towerAngle = 0; lastGap = 0;
  const startY = 124;
  // Always give the player one easy opening to establish the mechanic.
  platforms.push({ y:startY, rot:0, gapA:0.17, gapW:1.66, type:T_NORMAL,
    gone:false, dangerA:Math.PI, dangerW:0, index:0 });
  lastGap = 0.17;
  generatedCount = 1;
  for (let i=1;i<35;i++) platforms.push(genPlatform(startY+i*PLAT_DY,generatedCount++));
  ball.y = -40; ball.vy = 0; camY = ball.y - ballScreenY();
  score = 0; streak = 0; perfectStreak = 0; fireball = false; fireCharge = 0;
  floats = []; parts = []; rings = []; bounceT = 99; deadT = 0; deathReason = '';
  flash = 0; shake = 0; milestoneHit = 0; dragging = false; rotVel = 0;
  cameraKick=0; nearCallT=0; surgeT=0; impactFreeze=0; tilt=0; hitPulse=0;
  rotationSpeed=0; shards=[]; trail=[]; floatingScore=0; latestScore=0;

  dust = Array.from({length:46},()=>({x:Math.random()*W,y:Math.random()*H,
    s:0.6+Math.random()*1.6,v:4+Math.random()*12,tw:Math.random()*TAU}));
}
function ensurePlatforms() {
  let maxY = platforms.length ? platforms[platforms.length-1].y : ball.y;
  while (maxY < camY + H + 500) {
    maxY += PLAT_DY;
    platforms.push(genPlatform(maxY,generatedCount++));
  }
  const cutoff = camY - 440;
  while (platforms.length && platforms[0].y < cutoff) platforms.shift();
}


// ---------- effects ----------
function addFloat(txt, col, size) {
  // A single changing callout stays legible during very fast combos.
  const previous=floats[0];
  const entry={x:W/2,y:clamp(ballVisualY()-62,140,H-130),txt,
    life:.78,col:col||'#fff',size:Math.min(25,size||21)};
  if(previous&&previous.life>.35){
    previous.txt=entry.txt;previous.col=entry.col;previous.size=entry.size;
    previous.y=entry.y;previous.life=entry.life;
  }else floats=[entry];
}
function sprayShards(y, color, count) {
  if (REDUCED_MOTION) return;
  for (let i=0;i<count;i++) {
    const a=(i/count)*TAU+(Math.random()-.5)*.7;
    const sp=105+Math.random()*270;
    shards.push({x:W/2,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-100,
      rot:Math.random()*TAU,spin:(Math.random()-.5)*13,
      life:.62+Math.random()*.46,size:4+Math.random()*8,color});
  }
}

function burst(x, y, n, col, spd) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = (0.3 + Math.random() * 0.7) * (spd || 260);
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 120, life: 0.7 + Math.random() * 0.5, col, size: 2 + Math.random() * 4 });
  }
}
function platColor(t) {
  if (t === T_RED) return { top: '#ff2e5e', edge: '#a3123a', glow: 'rgba(255,46,94,0.35)' };
  if (t === T_FRAGILE) return { top: '#cfe8ff', edge: '#7fa8cc', glow: 'rgba(207,232,255,0.25)' };
  if (t === T_SPRING) return { top: '#ffb52e', edge: '#c07a10', glow: 'rgba(255,181,46,0.45)' };
  return { top: '#35e0e6', edge: '#17888e', glow: 'rgba(53,224,230,0.3)' };
}

// ---------- scoring / events ----------
function award(n) {
  score += n;
  if (score > best) { best = score; saveBest(); }
}
function award(n) {
  score += n;
  floatingScore += n;
  if (score > best) {best=score;saveBest();}
}
function onPass(plat, centered, near) {
  plat.gone=true;depth++;level=Math.floor(depth/12)+1;streak++;
  let gain=centered?2:1;
  // Successive clean drops build score without having to hit a tiny sweet spot.
  if (streak>=4 && streak%2===0)gain++;
  award(gain);
  cameraKick=Math.min(24,cameraKick+6.5);
  hitPulse=Math.min(1,hitPulse+.45);
  if(centered){
    perfectStreak++;
    addFloat(perfectStreak>1?'PERFECT  ×'+perfectStreak:'PERFECT',
      '#fff2bc',perfectStreak>2?24:21);
    sfx.perfect(perfectStreak);
    burst(W/2,ballVisualY(),16,'#ffedbb',310);
    buzz(11);
    surgeT=Math.max(surgeT,.11);
  } else if(near){
    perfectStreak=0;nearCallT=.56;
    addFloat('CLOSE CALL','#ffcfb4',19);
    tone(690,.1,'triangle',.075,0,930);
    burst(W/2,ballVisualY(),8,'#ffc6b1',165);
    buzz(6);
  }else{
    perfectStreak=0;
    if(streak>1)addFloat(streak+' IN A ROW','#baf4e0',18);
    tone(440+Math.min(streak,8)*58,.13,'sine',.13);
  }
  flash=Math.max(flash,.16);
  // Power lasts for three subsequent platforms, rather than unlimited gaps.
  if(fireball){
    fireCharge=Math.max(0,fireCharge-1);
    if(fireCharge===0)fireball=false;
  }
  // Re-earn the burst every six uninterrupted passes.
  if(!fireball && streak%6===3){
    fireball=true;fireCharge=3;
    addFloat('SUPER DROP','#ffe0a0',29);
    sfx.fireball();buzz([17,18,36]);cameraKick+=11;shake=5;
    surgeT=.17;
  }
  if(depth%12===0){
    addFloat('LEVEL '+level,'#ffffff',28);
    sfx.milestone();cameraKick=20;
    flash=.34;
  }
}
function onSmash(plat){
  plat.gone=true;depth++;level=Math.floor(depth/12)+1;
  award(3);fireCharge--;
  sprayShards(plat.y,plat.type===T_RED?'#ff667d':'#c2ffe9',20);
  burst(W/2,ballVisualY(),22,plat.type===T_RED?'#ff6977':'#ffdb99',300);
  addFloat('CRUSH  +3','#ffe1a7',23);
  sfx.smash();buzz([18,12,20]);
  shake=9;flash=.28;cameraKick+=15;
  impactFreeze=.035;hitPulse=1;
  if(fireCharge<=0){fireball=false;streak=0;perfectStreak=0;}
  if(depth%12===0){addFloat('LEVEL '+level,'#ffffff',26);sfx.milestone();}
}
function onBounce(plat){
  bounceT=0;
  rings.push({y:plat.y,r:BALL_R,life:1, color:plat.type===T_SPRING?'#ffdfaa':'#d9fdf1'});
  hitPulse=.75;cameraKick=-11;
  if(plat.type===T_SPRING){
    ball.vy=SPRING_V;sfx.spring();
    addFloat('SPRING','#ffe8b9',21);
    burst(W/2,ballVisualY(),15,'#ffe1ad',220);
    shake=3.5;buzz(12);
  }else{
    ball.vy=BOUNCE_V;
    sfx.bounce(streak);
    shake=1.8;buzz(5);
  }
  if(plat.type===T_FRAGILE){
    plat.gone=true;
    sprayShards(plat.y,'#d7f3ff',16);
    burst(W/2,ballVisualY(),10,'#ddf4ff',195);
    sfx.shatter();shake=5;
  }
  streak=0;perfectStreak=0;fireball=false;fireCharge=0;
}
function onDeath(reason){
  if(state!=='play')return;
  state='dead';deadT=0;deathReason=reason;
  dragging=false;rotationSpeed=0;pointerId=null;
  sfx.death();buzz([35,30,60]);
  shake=11;flash=.35;impactFreeze=0;
  sprayShards(ball.y,'#ffa0b2',26);
  burst(W/2,ballVisualY(),22,'#ff8a9c',290);
}


// ---------- physics ----------
function step(dt) {
  ensurePlatforms();
  const previous=ball.y+BALL_R;
  ball.vy=Math.min(MAX_FALL,ball.vy+GRAV*dt);
  ball.y+=ball.vy*dt;
  // A responsive, direction-aware camera reveals more of the next landing.
  const lead=Math.max(0,ball.vy)*.037;
  const cameraTarget=ball.y-ballScreenY()+lead+cameraKick;
  const tracking=ball.vy>=0?8.8:6.3;
  camY+=(cameraTarget-camY)*(1-Math.exp(-tracking*dt));
  if(ball.vy>0){
    const foot=ball.y+BALL_R;
    for(const p of platforms){
      if(p.gone||p.y<previous-.05||p.y>foot+.05)continue;
      const offset=angDist(0,p.gapA+p.rot);
      const clearance=Math.max(.19,p.gapW/2-.09);
      if(offset<clearance){
        onPass(p,offset<Math.min(.25,p.gapW*.16),offset>clearance*.73);
        ball.y=p.y+BALL_R+1;
        ball.vy=Math.min(MAX_FALL,ball.vy+Math.min(110,streak*24));
      }else if(fireball){
        onSmash(p);ball.y=p.y+BALL_R+1;
        ball.vy=Math.max(ball.vy,780);
      }else if(p.type===T_RED && angDist(0,p.dangerA+p.rot)<p.dangerW/2-.035){
        ball.y=p.y-BALL_R;onDeath('RED ZONE');
      }else{
        ball.y=p.y-BALL_R;onBounce(p);
      }
      break;
    }
  }
  if(fireball&&Math.random()<dt*50) {
    parts.push({x:W/2+(Math.random()-.5)*24,y:ballVisualY()+12,
      vx:(Math.random()-.5)*95,vy:80+Math.random()*105,life:.48,
      col:Math.random()<.5?'#ffcf82':'#ff8167',size:2+Math.random()*5});
  }
  if(!REDUCED_MOTION){
    // World-space samples keep the speed ribbon tethered to the moving ball.
    trail.unshift({worldY:ball.y,x:(Math.random()-.5)*3,life:1,
      hot:fireball});
    if(trail.length>19)trail.length=19;
  }
}
function animateEffects(dt){
  bounceT+=dt;elapsed+=dt;
  flash=Math.max(0,flash-dt*1.8);
  shake=Math.max(0,shake-dt*27);
  hitPulse=Math.max(0,hitPulse-dt*4.5);
  nearCallT=Math.max(0,nearCallT-dt);
  surgeT=Math.max(0,surgeT-dt);
  cameraKick*=Math.exp(-9*dt);
  dangerPulse+=dt*3.6;
  floatingScore+=(score-floatingScore)*Math.min(1,dt*17);
  tilt*=Math.exp(-10*dt);
  for(const p of trail)p.life=Math.max(0,p.life-dt*4.8);
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];p.life-=dt;
    if(p.life<=0){parts.splice(i,1);continue;}
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=520*dt;
  }
  for(let i=shards.length-1;i>=0;i--){
    const p=shards[i];p.life-=dt;
    if(p.life<=0){shards.splice(i,1);continue;}
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=640*dt;p.rot+=p.spin*dt;
  }
  for(let i=floats.length-1;i>=0;i--){
    const f=floats[i];f.life-=dt*.92;f.y-=45*dt;
    if(f.life<=0)floats.splice(i,1);
  }
  for(let i=rings.length-1;i>=0;i--){
    const r=rings[i];r.life-=dt*2.35;r.r+=155*dt;
    if(r.life<=0)rings.splice(i,1);
  }
  for(const d of dust){
    d.y+=d.v*dt*(fireball?2:1);d.tw+=dt*1.4;
    if(d.y>H+5){d.y=-5;d.x=Math.random()*W;}
  }
  if(state==='dead')deadT+=dt;
}


// ---------- input ----------
let dragging=false,lastX=0,pointerId=null;
const keys={left:false,right:false};
const muteBox={x:0,y:0,w:48,h:48};
const pauseBox={x:0,y:0,w:44,h:48};
function layoutMute(){muteBox.x=W-58;muteBox.y=10;pauseBox.x=W-108;pauseBox.y=10;}
function toggleSound(){
  muted=!muted;
  try{localStorage.setItem(SOUND_KEY,muted?'off':'on');}catch(e){}
  if(muted)audioSuspend();else audioResume();
  nextNoteTime=0;
}
function begin(){
  if(state==='ready'){state='play';sfx.tap();return true;}
  if(state==='paused'){state='play';nextNoteTime=0;audioResume();sfx.tap();return false;}
  if(state==='dead'&&deadT>.28){
    reset((Math.random()*0x7fffffff)|0);state='play';sfx.tap();return true;
  }
  return state==='play';
}
function pauseGame(){
  if(state!=='play')return;
  state='paused';rotationSpeed=0;dragging=false;pointerId=null;
  nextNoteTime=0;
}
function togglePause(){
  if(state==='play'){pauseGame();sfx.tap();}
  else if(state==='paused')begin();
}
function onDown(x,y,id){
  layoutMute();
  if(x>=muteBox.x&&x<=muteBox.x+muteBox.w&&y>=muteBox.y&&y<=muteBox.y+muteBox.h){
    toggleSound();return false;
  }
  if(x>=pauseBox.x&&x<=pauseBox.x+pauseBox.w&&y>=pauseBox.y&&y<=pauseBox.y+pauseBox.h){
    togglePause();return false;
  }
  initAudio();
  if(AC&&AC.state==='suspended'&&!muted)try{AC.resume();}catch(e){}
  if(!begin())return false;
  dragging=true;pointerId=id;lastX=x;lastPointerTime=performance.now();
  rotationSpeed=0;
  return true;
}
function onMove(x,id){
  if(!dragging||state!=='play'||pointerId!==id)return;
  const now=performance.now();
  const dx=clamp(x-lastX,-100,100);
  const dt=clamp((now-lastPointerTime)/1000,.008,.08);
  lastX=x;lastPointerTime=now;
  // One screen width is about 1.8 revolutions. Slower and steadier on tablets.
  const sensitivity=clamp(4.7/Math.max(W,330),.006,.0142);
  const rad=dx*sensitivity;
  rotateTower(rad);
  rotationSpeed=clamp(rad/dt,-7,7);
  tilt=clamp(tilt+rad*.38,-.13,.13);
}
function onUp(id){
  if(pointerId!==id)return;
  dragging=false;pointerId=null;
  if(performance.now()-lastPointerTime>45)rotationSpeed=0;
  else rotationSpeed*=.075; // Short tactile follow-through, not runaway inertia.
}
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();
  if(onDown(e.clientX,e.clientY,e.pointerId))
    try{cv.setPointerCapture(e.pointerId);}catch(err){}
});
cv.addEventListener('pointermove',e=>onMove(e.clientX,e.pointerId));
cv.addEventListener('pointerup',e=>onUp(e.pointerId));
cv.addEventListener('pointercancel',e=>{onUp(e.pointerId);rotationSpeed=0;});
window.addEventListener('blur',()=>{
  keys.left=false;keys.right=false;dragging=false;
  pointerId=null;rotationSpeed=0;
});
window.addEventListener('keydown',e=>{
  if(['ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();
  if(e.code==='ArrowLeft'||e.code==='KeyA')keys.left=true;
  if(e.code==='ArrowRight'||e.code==='KeyD')keys.right=true;
  if(e.code==='Space'||e.code==='Enter')begin();
  if((e.code==='KeyP'||e.code==='Escape')&&!e.repeat)togglePause();
  if(e.code==='KeyM'&&!e.repeat)toggleSound();
});
window.addEventListener('keyup',e=>{
  if(e.code==='ArrowLeft'||e.code==='KeyA')keys.left=false;
  if(e.code==='ArrowRight'||e.code==='KeyD')keys.right=false;
});
function updateKeyboard(dt){
  if(state!=='play')return;
  const direction=(keys.right?1:0)-(keys.left?1:0);
  if(direction){
    rotateTower(direction*dt*3.7);
    tilt=clamp(tilt+direction*dt*.12,-.13,.13);
    rotationSpeed=0;
  }else if(!dragging && Math.abs(rotationSpeed)>.005){
    rotateTower(rotationSpeed*dt);
    rotationSpeed*=Math.exp(-22*dt);
  }
}


// ---------- render ----------
function drawTower(){
  const cx=W/2, r=towerRadius(), p=theme();
  const grad=ctx.createLinearGradient(cx-r,0,cx+r,0);
  grad.addColorStop(0,'#0c1724');grad.addColorStop(.12,p.deep);
  grad.addColorStop(.25,'#3b5265');grad.addColorStop(.44,'#70869c');
  grad.addColorStop(.52,'#6f8aa0');grad.addColorStop(.67,'#3a5068');
  grad.addColorStop(.85,p.deep);grad.addColorStop(1,'#101d2a');
  ctx.fillStyle=grad;ctx.fillRect(cx-r,-24,r*2,H+48);
  ctx.fillStyle='rgba(255,255,255,.055)';
  ctx.fillRect(cx-r*.28,0,r*.10,H);
  ctx.strokeStyle='rgba(255,255,255,.13)';ctx.lineWidth=1;
  for(const v of [-.79,-.45,.37,.74]){
    ctx.beginPath();ctx.moveTo(cx+v*r,-15);ctx.lineTo(cx+v*r,H+15);ctx.stroke();
  }
  ctx.strokeStyle='rgba(7,15,26,.40)';ctx.lineWidth=5;
  ctx.beginPath();ctx.moveTo(cx-r-2,0);ctx.lineTo(cx-r-2,H);ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx+r+2,0);ctx.lineTo(cx+r+2,H);ctx.stroke();
  // Moving tower etchings are a subtle sense of progression.
  for(let i=-2;i<10;i++){
    const sy=(i*152-camY*.29)% (H+300);
    ctx.fillStyle='rgba(220,240,247,.08)';
    ctx.fillRect(cx-r*.27,sy,r*.54,2);
  }
}

function annulus(cx,cy,outer,inner,start,end,color){
  ctx.beginPath();
  ctx.ellipse(cx,cy,outer,outer*.30,0,start,end,false);
  ctx.ellipse(cx,cy,inner,inner*.30,0,end,start,true);
  ctx.closePath();ctx.fillStyle=color;ctx.fill();
}

function drawPlatform(p){
  const sy=worldToScreen(p.y),cx=W/2,outer=towerRadius()*2.65,inner=towerRadius()*1.005;
  if(sy<-100||sy>H+115)return;
  const cy=sy-outer*.3, themeColor=theme();
  const front=p.gapA+p.rot+Math.PI/2,first=front+p.gapW/2,last=front+TAU-p.gapW/2;
  const main=p.type===T_SPRING?'#ffc57f':p.type===T_FRAGILE?'#d5eaf4':themeColor.rim;
  const upper=p.type===T_SPRING?'#fff0c7':p.type===T_FRAGILE?'#ffffff':themeColor.gleam;
  ctx.save();
  ctx.shadowColor='rgba(7,12,22,.20)';ctx.shadowBlur=12;ctx.shadowOffsetY=7;
  annulus(cx,cy+11,outer,inner,first,last,'#193040');
  ctx.shadowBlur=0;ctx.shadowOffsetY=0;
  // Offset inner slice makes the decks read as solid, stacked porcelain.
  annulus(cx,cy+5,outer,inner,first,last,'#416578');
  const ringG=ctx.createLinearGradient(0,cy-outer*.32,0,cy+outer*.32);
  ringG.addColorStop(0,upper);
  ringG.addColorStop(.50,main);
  ringG.addColorStop(1,p.type===T_SPRING?'#dc8f64':p.type===T_FRAGILE?'#8dacc4':'#72bda9');
  annulus(cx,cy,outer,inner,first,last,ringG);
  ctx.strokeStyle='rgba(255,255,255,.78)';ctx.lineWidth=1.6;
  ctx.beginPath();ctx.ellipse(cx,cy-1,outer-1,(outer-1)*.30,0,first,last);ctx.stroke();
  ctx.strokeStyle='rgba(18,59,63,.10)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.ellipse(cx,cy,inner+3,(inner+3)*.3,0,first,last);ctx.stroke();
  // Thin geometry following the ring curve makes rotation legible.
  ctx.strokeStyle='rgba(16,76,76,.16)';ctx.lineWidth=1.5;
  const span=last-first;
  for(let n=1;n<8;n++){
    const a=first+span*n/8;
    const mid=(inner+outer)*.5;
    ctx.beginPath();
    ctx.moveTo(cx+Math.cos(a)*(mid-7),cy+Math.sin(a)*(mid-7)*.3);
    ctx.lineTo(cx+Math.cos(a)*(mid+7),cy+Math.sin(a)*(mid+7)*.3);
    ctx.stroke();
  }
  if(p.type===T_RED){
    const hazard=p.dangerA+p.rot+Math.PI/2;
    // A painted enamel warning surface that remains legible in motion.
    annulus(cx,cy-1,outer+1,inner-1,hazard-p.dangerW/2,hazard+p.dangerW/2,themeColor.hot);
    ctx.strokeStyle='rgba(255,229,230,.80)';ctx.lineWidth=1.7;
    ctx.beginPath();ctx.ellipse(cx,cy,outer+1,(outer+1)*.3,0,hazard-p.dangerW/2,hazard+p.dangerW/2);ctx.stroke();
    ctx.fillStyle='rgba(92,23,39,.50)';
    for(let j=0;j<3;j++){
      const a=hazard+(j-1)*p.dangerW*.26;
      const mid=(inner+outer)*.54;
      const x=cx+Math.cos(a)*mid,y=cy+Math.sin(a)*mid*.30;
      ctx.save();ctx.translate(x,y);ctx.rotate(a);
      ctx.beginPath();ctx.moveTo(-4,4);ctx.lineTo(0,-4);ctx.lineTo(4,4);ctx.closePath();ctx.fill();
      ctx.restore();
    }
  }
  if(p.type===T_FRAGILE){
    ctx.strokeStyle='#6c92b0';ctx.lineWidth=1.3;
    for(let i=1;i<=5;i++){
      const a=first+(last-first)*i/6;
      const x1=cx+Math.cos(a)*inner,y1=cy+Math.sin(a)*inner*.3;
      const x2=cx+Math.cos(a+.07)*outer,y2=cy+Math.sin(a+.07)*outer*.3;
      ctx.beginPath();ctx.moveTo(x1,y1);
      ctx.lineTo((x1+x2)*.5+3,(y1+y2)*.5-3);ctx.lineTo(x2,y2);ctx.stroke();
    }
  }
  if(p.type===T_SPRING){
    ctx.strokeStyle='#ac6640';ctx.lineWidth=3;
    for(let i=1;i<6;i++){
      const a=first+(last-first)*i/6,r=(outer+inner)*.5;
      const x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r*.3;
      ctx.beginPath();ctx.arc(x,y,3,0,TAU);ctx.stroke();
    }
  }
  // Bright end-caps let players track the exact opening at speed.
  for(const a of [first,last]){
    const x=cx+Math.cos(a)*outer,y=cy+Math.sin(a)*outer*.3;
    ctx.shadowColor=p.type===T_RED?'#ffc4c7':'#d4fff0';ctx.shadowBlur=6;
    ctx.fillStyle=upper;ctx.beginPath();ctx.arc(x,y,3.4,0,TAU);ctx.fill();
  }
  ctx.shadowBlur=0;
  ctx.restore();
}

function drawTarget(){
  if(state!=='play'&&state!=='ready')return;
  const foot=ball.y+BALL_R;
  const next=platforms.find(p=>!p.gone&&p.y>=foot-1);
  if(!next)return;
  const y=worldToScreen(next.y);
  if(y<75||y>H-24||y-ballVisualY()>310)return;
  const offset=angDist(0,next.gapA+next.rot);
  const safe=offset<Math.max(.19,next.gapW/2-.09);
  const hazard=next.type===T_RED&&angDist(0,next.dangerA+next.rot)<next.dangerW/2-.035;
  const c=hazard?'#ff6977':safe?'#f2ffdd':'rgba(242,255,248,.48)';
  const pulse=safe?.70+.3*Math.sin(dangerPulse*1.4):.7;
  ctx.save();
  ctx.globalAlpha=pulse;
  ctx.strokeStyle=c;ctx.lineWidth=2.4;ctx.lineCap='round';
  const r=towerRadius()*1.7;
  // Contact-plane pointers: a tiny visual language, not a HUD tutorial.
  ctx.beginPath();ctx.moveTo(W/2-17,y+5);ctx.lineTo(W/2-8,y+9);
  ctx.moveTo(W/2+17,y+5);ctx.lineTo(W/2+8,y+9);ctx.stroke();
  if(safe){
    ctx.strokeStyle='rgba(255,255,234,.5)';ctx.lineWidth=1;
    ctx.beginPath();ctx.arc(W/2,y,8,Math.PI*.2,Math.PI*.8);ctx.stroke();
  }
  ctx.restore();
}

function drawTrail(){
  if(state==='dead'||trail.length<2||REDUCED_MOTION)return;
  const speed=clamp(Math.abs(ball.vy)/MAX_FALL,.22,1);
  for(let i=trail.length-1;i>=0;i--){
    const t=trail[i],y=t.worldY-camY;
    if(y<-30||y>H+30)continue;
    const alpha=(1-i/trail.length)*t.life*.26*speed;
    ctx.globalAlpha=alpha;
    ctx.fillStyle=t.hot?'#ffc178':theme().accent;
    ctx.beginPath();ctx.ellipse(W/2+t.x,y,Math.max(2,BALL_R*(1-i/trail.length)*.72),
      3+(i/trail.length)*8,0,0,TAU);ctx.fill();
  }
  ctx.globalAlpha=1;
}

function drawBall(){
  const x=W/2,y=ballVisualY();
  const squashWave=Math.sin(clamp(1-bounceT/.25,0,1)*Math.PI);
  const sy=clamp(1+ball.vy/3600,.82,1.23)*(1-.24*squashWave);
  const sx=1/Math.sqrt(sy);
  const p=theme();
  // Back halo subtly expands with velocity or a hot streak.
  if(!REDUCED_MOTION){
    const aura=ctx.createRadialGradient(x,y,3,x,y,fireball?49:35);
    aura.addColorStop(0,fireball?'rgba(255,178,80,.28)':'rgba(171,254,225,.20)');
    aura.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=aura;ctx.beginPath();ctx.arc(x,y,fireball?49:35,0,TAU);ctx.fill();
  }
  ctx.save();ctx.translate(x,y);ctx.rotate(tilt);ctx.scale(sx,sy);
  const g=ctx.createRadialGradient(-5,-6,1,0,0,BALL_R+3);
  if(fireball){
    g.addColorStop(0,'#fffaf1');g.addColorStop(.28,'#ffe8ad');
    g.addColorStop(.65,'#ffb95a');g.addColorStop(1,'#f36d45');
  }else{
    g.addColorStop(0,'#ffffff');g.addColorStop(.28,'#fffbea');
    g.addColorStop(.7,'#f4dd9b');g.addColorStop(1,'#cf9e61');
  }
  ctx.fillStyle=g;ctx.shadowColor=fireball?'#ffb35b':'#fff6d7';
  ctx.shadowBlur=fireball?18:10;
  ctx.beginPath();ctx.arc(0,0,BALL_R,0,TAU);ctx.fill();
  ctx.shadowBlur=0;
  ctx.strokeStyle='rgba(255,255,255,.58)';ctx.lineWidth=1.2;
  ctx.beginPath();ctx.arc(-3,-3,BALL_R-4,3.75,5.26);ctx.stroke();
  ctx.restore();
  if(fireball){
    ctx.strokeStyle='rgba(255,207,135,'+(.3+.15*Math.sin(elapsed*23))+')';
    ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,20+Math.sin(elapsed*17)*2,0,TAU);ctx.stroke();
  }
}

function drawMute(){
  layoutMute();const x=muteBox.x+24,y=muteBox.y+23;
  ctx.save();ctx.globalAlpha=.85;ctx.translate(x,y);
  ctx.strokeStyle='#ecf4ef';ctx.fillStyle='#ecf4ef';ctx.lineWidth=1.8;
  ctx.beginPath();ctx.moveTo(-11,-4);ctx.lineTo(-6,-4);ctx.lineTo(0,-10);
  ctx.lineTo(0,10);ctx.lineTo(-6,4);ctx.lineTo(-11,4);ctx.closePath();ctx.fill();
  ctx.beginPath();
  if(muted){
    ctx.moveTo(5,-5);ctx.lineTo(14,5);ctx.moveTo(14,-5);ctx.lineTo(5,5);
  }else{
    ctx.arc(1,0,8,-.8,.8);ctx.moveTo(1+Math.cos(-.8)*13,Math.sin(-.8)*13);
    ctx.arc(1,0,13,-.8,.8);
  }
  ctx.stroke();ctx.restore();
}

function drawPause(){
  if(state==='dead'||state==='ready')return;
  const x=pauseBox.x+21,y=pauseBox.y+23;
  ctx.save();ctx.globalAlpha=.84;ctx.translate(x,y);
  ctx.strokeStyle='#f0f7ef';ctx.fillStyle='#f0f7ef';ctx.lineWidth=2;
  if(state==='paused'){
    ctx.beginPath();ctx.moveTo(-5,-10);ctx.lineTo(8,0);ctx.lineTo(-5,10);ctx.closePath();ctx.fill();
  }else{
    ctx.fillRect(-7,-9,5,18);ctx.fillRect(3,-9,5,18);
  }
  ctx.restore();
}

function label(t,x,y,px,color,weight){
  ctx.font=(weight||700)+' '+px+'px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif';
  ctx.fillStyle=color;ctx.fillText(t,x,y);
}

function drawBackdrop(){
  const p=theme();
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,p.skyA);bg.addColorStop(1,p.skyB);
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  const bloom=ctx.createRadialGradient(W*.52,H*.45,10,W*.52,H*.45,Math.max(W,H)*.73);
  bloom.addColorStop(0,'rgba(194,237,233,.12)');
  bloom.addColorStop(.5,'rgba(145,211,221,.035)');
  bloom.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=bloom;ctx.fillRect(0,0,W,H);
  // Sparse pillars and moving horizontal rulings create a sense of height.
  ctx.strokeStyle='rgba(238,249,240,.065)';ctx.lineWidth=1;
  for(const x of [W*.1,W*.25,W*.75,W*.90]){
    ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();
  }
  for(let i=-1;i<9;i++){
    const y=((i*178-camY*.12)%(H+180)+H+180)%(H+180);
    ctx.strokeStyle='rgba(234,247,250,.045)';
    ctx.beginPath();ctx.moveTo(W*.06,y);ctx.lineTo(W*.94,y);ctx.stroke();
  }
  for(const d of dust){
    ctx.globalAlpha=.10+.13*Math.sin(d.tw);
    ctx.fillStyle='#f8fff7';ctx.fillRect(d.x,d.y,d.s,d.s);
  }
  ctx.globalAlpha=1;
  if(ball.vy>850&&state==='play'&&!REDUCED_MOTION){
    ctx.strokeStyle='rgba(240,255,240,.11)';
    const speed=(ball.vy-850)/700;
    for(let i=0;i<13;i++){
      const x=(i%2?W*.17:W*.83)+(Math.sin(i*36.7)*W*.12);
      const y=((elapsed*(110+speed*320)+i*89)%(H+100));
      ctx.lineWidth=(i%3===0?2:1);
      ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y+18+speed*48);ctx.stroke();
    }
  }
}

function drawHUD(){
  const p=theme(),safe=H<520?18:23;
  const top=ctx.createLinearGradient(0,0,0,145);
  top.addColorStop(0,'rgba(9,17,27,.82)');
  top.addColorStop(1,'rgba(9,17,27,0)');
  ctx.fillStyle=top;ctx.fillRect(0,0,W,145);
  ctx.textAlign='left';label('LEVEL '+level,18,safe+5,11,'rgba(255,255,255,.72)',750);
  ctx.textAlign='center';
  label(String(Math.round(floatingScore)),W/2,65,51,'#fffdf1',800);
  label('BEST  '+best,W/2,84,11,'rgba(255,255,255,.55)',700);
  const barW=Math.min(170,W*.42),bx=(W-barW)/2;
  ctx.fillStyle='rgba(255,255,255,.16)';ctx.fillRect(bx,97,barW,3);
  ctx.fillStyle=fireball?'#ffc57a':p.accent;
  ctx.fillRect(bx,97,barW*(depth%12)/12,3);
  if(state==='play'&&streak>0){
    ctx.textAlign='left';
    label(fireball?'SUPER  '+fireCharge:streak+' CHAIN',18,safe+27,11,
      fireball?'#ffcf83':'#b5f7e5',800);
    if(!fireball){
      for(let i=0;i<3;i++){
        ctx.fillStyle=i<streak?'#b5f7e5':'rgba(255,255,255,.25)';
        ctx.fillRect(18+i*14,safe+34,10,3);
      }
    }
  }
  if(fireball&&state==='play'){
    const wx=Math.max(12,W/2-94),wy=H-35;
    const meterW=188;
    ctx.globalAlpha=.85;
    ctx.fillStyle='rgba(14,23,34,.55)';ctx.fillRect(wx,wy,meterW,3);
    ctx.fillStyle='#ffcb82';ctx.fillRect(wx,wy,meterW*(fireCharge/3),3);
    ctx.textAlign='center';label('SUPER DROP',W/2,wy-10,10,'#ffe6b7',800);
    ctx.globalAlpha=1;
  }
  if(nearCallT>.0){
    ctx.textAlign='center';ctx.globalAlpha=Math.min(1,nearCallT*3);
    label('CLOSE!',W/2,127,12,'#ffdbba',800);ctx.globalAlpha=1;
  }
  drawMute();drawPause();
}

function drawOverlay(){
  if(state!=='ready'&&state!=='dead'&&state!=='paused')return;
  const t=theme(),cy=H*.46;
  ctx.fillStyle='rgba(10,18,31,.67)';ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  if(state==='ready'){
    const headerY=clamp(H*.32,130,H*.40);
    label('HELIX',W/2,headerY,clamp(W*.15,42,64),'#fff9e9',850);
    label('DESCEND',W/2,headerY+43,clamp(W*.105,29,43),t.accent,850);
    ctx.strokeStyle='rgba(255,255,255,.35)';
    ctx.beginPath();ctx.moveTo(W/2-35,headerY+63);ctx.lineTo(W/2+35,headerY+63);ctx.stroke();
    label('DRAG TO ROTATE',W/2,headerY+102,14,'#f6fff5',800);
    label('FIND THE OPENINGS',W/2,headerY+127,13,'rgba(239,255,244,.74)',500);
    label('AVOID THE RED',W/2,headerY+149,13,'rgba(255,217,214,.75)',600);
    const promptY=Math.min(H-73,headerY+214);
    const pulse=.65+.35*Math.sin(elapsed*3);
    ctx.globalAlpha=pulse;
    label('TAP ANYWHERE TO PLAY',W/2,promptY,14,'#fff7ce',800);
    ctx.globalAlpha=1;
    ctx.strokeStyle=t.accent;ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(W/2-95,promptY+12);ctx.lineTo(W/2+95,promptY+12);ctx.stroke();
  }else if(state==='paused'){
    const headerY=H*.43;
    label('PAUSED',W/2,headerY,35,'#fff8e7',800);
    label('TAP TO CONTINUE',W/2,headerY+45,14,'#bfeadb',750);
    label('P  ·  RESUME',W/2,headerY+75,11,'rgba(255,255,255,.6)',600);
  }else if(deadT>.22){
    const headerY=clamp(H*.33,135,H*.40);
    label('RUN OVER',W/2,headerY-50,12,'#ffb5b8',800);
    label(String(score),W/2,headerY+33,84,'#fffaf1',800);
    label('BEST  '+best,W/2,headerY+65,14,'rgba(239,255,242,.76)',750);
    label(depth+' RINGS  ·  LEVEL '+level,W/2,headerY+90,12,'rgba(239,255,242,.58)',600);
    if(deadT>.28){
      const promptY=Math.min(H-69,headerY+158);
      label('TAP TO TRY AGAIN',W/2,promptY,15,'#fff7ce',800);
      ctx.strokeStyle=t.accent;ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(W/2-87,promptY+12);ctx.lineTo(W/2+87,promptY+12);ctx.stroke();
    }
  }
}

function render(){
  drawBackdrop();
  ctx.save();
  if(shake>.1&&!REDUCED_MOTION)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  drawTower();
  const visible=platforms.filter(p=>!p.gone&&worldToScreen(p.y)>-110&&worldToScreen(p.y)<H+115);
  visible.sort((a,b)=>a.y-b.y);
  for(const p of visible)drawPlatform(p);
  drawTarget();
  drawTrail();
  for(const p of shards){
    const y=worldToScreen(p.y);
    if(y<-25||y>H+25)continue;
    ctx.save();ctx.translate(p.x,y);ctx.rotate(p.rot);
    ctx.globalAlpha=clamp(p.life*1.7,0,1);ctx.fillStyle=p.color;
    ctx.beginPath();ctx.moveTo(-p.size/2,-p.size/2);
    ctx.lineTo(p.size/2,-p.size/3);ctx.lineTo(p.size/3,p.size/2);
    ctx.closePath();ctx.fill();ctx.restore();
  }
  for(const p of parts){
    ctx.globalAlpha=clamp(p.life*1.8,0,1);
    ctx.fillStyle=p.col;ctx.beginPath();
    ctx.arc(p.x,p.y,p.size/2,0,TAU);ctx.fill();
  }
  ctx.globalAlpha=1;
  if(state!=='dead')drawBall();
  for(const r of rings){
    ctx.globalAlpha=clamp(r.life*.55,0,1);
    ctx.strokeStyle=r.color;ctx.lineWidth=2.4;
    ctx.beginPath();ctx.ellipse(W/2,worldToScreen(r.y),r.r,r.r*.3,0,0,TAU);ctx.stroke();
  }
  ctx.globalAlpha=1;ctx.restore();
  ctx.textAlign='center';
  for(const f of floats){
    ctx.globalAlpha=clamp(f.life*1.65,0,1);
    label(f.txt,f.x,f.y,f.size,f.col,850);
  }
  ctx.globalAlpha=1;
  if(flash>0){
    ctx.fillStyle='rgba(255,247,212,'+Math.min(.23,flash*.38)+')';
    ctx.fillRect(0,0,W,H);
  }
  drawHUD();
  drawOverlay();
}

// ---------- main loop ----------
let last=performance.now();
function loop(now){
  let dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;
  if(document.hidden)dt=0;
  if(dt>0){
    updateKeyboard(dt);
    let physicsDt=dt;
    if(impactFreeze>0){physicsDt=0;impactFreeze=Math.max(0,impactFreeze-dt);}
    else if(surgeT>0){physicsDt=dt*.72;}
    if(state==='play' && physicsDt>0){
      // Bounded substeps preserve fair gaps even on busy mobile frames.
      let remain=physicsDt;
      while(remain>0&&state==='play'){
        const h=Math.min(1/120,remain);step(h);remain-=h;
      }
    }
    animateEffects(dt);
    scheduleMusic();
  }
  render();
  requestAnimationFrame(loop);
}
reset(12345);
requestAnimationFrame(loop);


// Lightweight deterministic hooks for gameplay smoke tests.
window.__hx={
  get state(){return state;},
  get score(){return score;},
  get best(){return best;},
  get depth(){return depth;},
  get level(){return level;},
  get ball(){return {y:ball.y,vy:ball.vy,screenY:ballVisualY()};},
  get fireball(){return fireball;},
  get streak(){return streak;},
  get platCount(){return platforms.length;},
  get towerAngle(){return towerAngle;},
  get audio(){return {initialized:!!AC,muted,musicEnabled,step:musicStep,bus:!!musicBus};},
  pause(){pauseGame();},
  resume(){begin();},
  platforms(){return platforms.slice(0,8).map(p=>({
    y:p.y,type:p.type,gapA:p.gapA,rot:p.rot,gapW:p.gapW,
    dangerA:p.dangerA,dangerW:p.dangerW,gone:p.gone
  }));},
  rotate(dx){towerAngle+=dx;for(const p of platforms)p.rot+=dx;},
  alignGap(){
    const by=ball.y+BALL_R;
    const p=platforms.find(p=>!p.gone&&p.y>=by);
    if(!p)return -1;
    const d=angNorm(-p.gapA-p.rot);
    towerAngle+=d;for(const q of platforms)q.rot+=d;
    return p.type;
  },
  drop(){ball.vy=MAX_FALL;},
  kill(){onDeath('debug');},
  restart(){reset(12345);state='play';},
  start(){if(state==='ready')state='play';},
  toggleMute(){toggleSound();}
};

</script>
