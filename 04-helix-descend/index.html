<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a18">
<title>Helix Descend</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0a0a18;
    overscroll-behavior:none; -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color: transparent; }
  canvas { display:block; width:100vw; height:100vh; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* HELIX DESCEND — hyper-casual #04.
 * MODEL: Helix Jump. Drag to rotate the tower, guide the bouncing ball
 * down through platform gaps. Red crystal kills. Three clean gap passes
 * in a row ignites a fireball that smashes everything it touches.
 * IMPROVE: crystal spire theme; fragile platforms that shatter after one
 * bounce; spring platforms that launch the ball; perfect center-gap
 * landings pay double and build a rising chime streak.
 * One touch (drag to rotate). Portrait. Tap to start, tap to retry.
 */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// ---------- utils ----------
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function angNorm(a) { while (a > Math.PI) a -= Math.PI * 2; while (a < -Math.PI) a += Math.PI * 2; return a; }
function angDist(a, b) { return Math.abs(angNorm(a - b)); }
function buzz(ms) {
  try { if (typeof navigator.vibrate === 'function') navigator.vibrate(ms); } catch (e) {}
}

// audio cleanup: suspend on tab hide / window blur / page close, resume on return
function audioSuspend() { try { if (AC && AC.state === 'running') AC.suspend(); } catch (e) {} }
function audioResume() { try { if (AC && AC.state === 'suspended' && !muted) AC.resume(); } catch (e) {} }
document.addEventListener('visibilitychange', () => { if (document.hidden) audioSuspend(); else audioResume(); });
window.addEventListener('blur', audioSuspend);
window.addEventListener('focus', audioResume);
window.addEventListener('pagehide', audioSuspend);

// ---------- audio ----------
let AC = null, muted = false;
function initAudio() {
  if (AC) return;
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); }
  catch (e) { AC = null; }
}
function tone(freq, dur, type, vol, when, slideTo) {
  if (!AC || muted) return;
  try {
    const t0 = AC.currentTime + (when || 0);
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.2, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(AC.destination);
    o.start(t0); o.stop(t0 + dur + 0.05);
  } catch (e) {}
}
function noiseBurst(dur, vol, freq) {
  if (!AC || muted) return;
  try {
    const t0 = AC.currentTime, len = Math.floor(AC.sampleRate * dur);
    const buf = AC.createBuffer(1, len, AC.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = AC.createBufferSource(); src.buffer = buf;
    const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq || 2000;
    const g = AC.createGain(); g.gain.value = vol || 0.25;
    src.connect(f).connect(g).connect(AC.destination);
    src.start(t0);
  } catch (e) {}
}
const sfx = {
  bounce(combo) { tone(300 + Math.min(combo, 10) * 24, 0.09, 'sine', 0.18); },
  perfect(streak) { const p = Math.pow(1.059, Math.min(streak, 12)); tone(660 * p, 0.22, 'sine', 0.2); tone(990 * p, 0.3, 'sine', 0.12, 0.06); },
  shatter() { noiseBurst(0.18, 0.3, 3200); },
  spring() { tone(180, 0.22, 'sine', 0.22, 0, 620); },
  fireball() { noiseBurst(0.4, 0.2, 700); tone(120, 0.4, 'sawtooth', 0.1, 0, 420); },
  smash() { noiseBurst(0.12, 0.32, 1500); tone(220, 0.12, 'square', 0.12, 0, 90); },
  death() { tone(320, 0.5, 'sawtooth', 0.22, 0, 70); noiseBurst(0.3, 0.2, 500); },
  milestone() { tone(523, 0.4, 'triangle', 0.12); tone(784, 0.5, 'triangle', 0.1, 0.12); }
};

// ---------- game constants ----------
const GRAV = 2200, BOUNCE_V = -750, SPRING_V = -1300, MAX_FALL = 1400;
const BALL_R = 14, PLAT_DY = 150;
const TOWER_R = 46;
const BEST_KEY = 'helix_best';

// platform types
const T_NORMAL = 0, T_FRAGILE = 1, T_SPRING = 2, T_RED = 3;

// ---------- state ----------
let state = 'ready'; // ready | play | dead
let rng = mulberry32(1);
let platforms = [];
let ball = { y: 0, vy: 0 };
let camY = 0; // world y at screen top-ish anchor
let score = 0, best = 0;
let streak = 0;        // consecutive gap passes without bouncing
let fireball = false, fireCharge = 0;
let perfectStreak = 0;
let deadT = 0, deathReason = '';
let floats = [];      // popup texts {x,y,txt,life,col,size}
let parts = [];       // particles {x,y,vx,vy,life,col,size}
let rings = [];       // bounce impact rings {y,r,life}
let dust = [];        // background crystal dust
let rotVel = 0;
let bounceT = 99; // time since last bounce (for impact squash)
let elapsed = 0;
let milestoneHit = 0;

try { best = parseInt(localStorage.getItem(BEST_KEY) || '0', 10) || 0; } catch (e) { best = 0; }
function saveBest() { try { localStorage.setItem(BEST_KEY, String(best)); } catch (e) {} }

// screen anchor for the ball
function ballScreenY() { return H * 0.34; }
// world y of ball from camera: ballWorldY = camY + ballScreenY()
// we store ball.y as world y directly.

// ---------- platform generation ----------
function genPlatform(y, depth) {
  const r = rng();
  // gap width shrinks with depth
  const gapW = clamp(1.15 - depth * 0.0035, 0.68, 1.15);
  const gapA = rng() * Math.PI * 2;
  let type = T_NORMAL;
  if (depth > 4) {
    const redP = clamp(0.02 + depth * 0.004, 0, 0.26);
    const fragP = 0.14, springP = 0.10;
    const t = rng();
    if (t < redP) type = T_RED;
    else if (t < redP + fragP) type = T_FRAGILE;
    else if (t < redP + fragP + springP) type = T_SPRING;
  }
  return { y, rot: rng() * Math.PI * 2, gapA, gapW, type, gone: false };
}
function reset(seed) {
  rng = mulberry32(seed || 1);
  platforms = [];
  // first platform right under the ball, generous gap, always normal
  const startY = 120;
  platforms.push({ y: startY, rot: 0, gapA: Math.PI, gapW: 1.4, type: T_NORMAL, gone: false });
  for (let i = 1; i < 40; i++) platforms.push(genPlatform(startY + i * PLAT_DY, i));
  ball.y = -40; ball.vy = 0;
  camY = ball.y - ballScreenY();
  score = 0; streak = 0; fireball = false; fireCharge = 0;
  perfectStreak = 0; floats = []; parts = []; rings = []; deadT = 0; milestoneHit = 0;
  bounceT = 99;
  deathReason = '';
  // background dust
  dust = [];
  for (let i = 0; i < 70; i++) dust.push({ x: Math.random() * W, y: Math.random() * H, s: 1 + Math.random() * 2.2, v: 6 + Math.random() * 18, tw: Math.random() * 6.28 });
}
function ensurePlatforms() {
  const bottomWorld = camY + H + 300;
  let maxY = -1e9;
  for (const p of platforms) if (p.y > maxY) maxY = p.y;
  let depth = platforms.length;
  while (maxY < bottomWorld) { maxY += PLAT_DY; platforms.push(genPlatform(maxY, depth++)); }
  const topWorld = camY - 400;
  platforms = platforms.filter(p => p.y > topWorld - PLAT_DY);
}

// ---------- effects ----------
function addFloat(txt, col, size) {
  floats.push({ x: W / 2, y: ballScreenY() - 70, txt, life: 1, col: col || '#fff', size: size || 26 });
}
function burst(x, y, n, col, spd) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = (0.3 + Math.random() * 0.7) * (spd || 260);
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 120, life: 0.7 + Math.random() * 0.5, col, size: 2 + Math.random() * 4 });
  }
}
function platColor(t) {
  if (t === T_RED) return { top: '#ff2e5e', edge: '#a3123a', glow: 'rgba(255,46,94,0.35)' };
  if (t === T_FRAGILE) return { top: '#cfe8ff', edge: '#7fa8cc', glow: 'rgba(207,232,255,0.25)' };
  if (t === T_SPRING) return { top: '#ffb52e', edge: '#c07a10', glow: 'rgba(255,181,46,0.45)' };
  return { top: '#35e0e6', edge: '#17888e', glow: 'rgba(53,224,230,0.3)' };
}

// ---------- scoring / events ----------
function onPass(plat, centered) {
  score++;
  if (score > best) { best = score; saveBest(); }
  if (centered) {
    score++; // perfect pays double
    if (score > best) { best = score; saveBest(); }
    perfectStreak++;
    addFloat(perfectStreak > 1 ? 'PERFECT x' + perfectStreak : 'PERFECT', '#8ef7ff', 26);
    sfx.perfect(perfectStreak);
    burst(W / 2, ballScreenY(), 14, '#8ef7ff', 300);
  } else {
    perfectStreak = 0;
  }
  streak++;
  if (!fireball && streak >= 3) {
    fireball = true; fireCharge = 3;
    addFloat('FIREBALL', '#ffb52e', 30);
    sfx.fireball();
    buzz(30);
  }
  if (score % 50 === 0 && score !== milestoneHit) {
    milestoneHit = score;
    addFloat(score + ' DOWN', '#c9b8ff', 30);
    sfx.milestone();
  }
}
function onSmash(plat) {
  plat.gone = true;
  score++;
  if (score > best) { best = score; saveBest(); }
  fireCharge--;
  const sy = plat.y - camY;
  burst(W / 2, sy, 22, plat.type === T_RED ? '#ff2e5e' : '#ffb52e', 380);
  sfx.smash();
  buzz(20);
  if (fireCharge <= 0) { fireball = false; streak = 0; }
}
function onBounce(plat) {
  bounceT = 0; // reset impact squash timer
  // bounce ring effect
  rings.push({ y: plat.y - camY, r: BALL_R, life: 1 });
  if (plat.type === T_SPRING) {
    ball.vy = SPRING_V;
    sfx.spring();
    burst(W / 2, plat.y - camY, 10, '#ffb52e', 220);
  } else {
    ball.vy = BOUNCE_V;
    sfx.bounce(streak);
  }
  if (plat.type === T_FRAGILE && !plat.gone) {
    plat.gone = true;
    burst(W / 2, plat.y - camY, 18, '#cfe8ff', 300);
    sfx.shatter();
  }
  streak = 0; fireball = false; fireCharge = 0; perfectStreak = 0;
  buzz(8);
}
function onDeath(reason) {
  state = 'dead'; deadT = 0; deathReason = reason;
  sfx.death();
  buzz(80);
  burst(W / 2, ballScreenY(), 30, '#ff2e5e', 420);
}

// ---------- physics ----------
function step(dt) {
  ensurePlatforms();
  ball.vy += GRAV * dt;
  if (ball.vy > MAX_FALL) ball.vy = MAX_FALL;
  const prevY = ball.y;
  ball.y += ball.vy * dt;

  // camera follows downward only
  const targetCam = ball.y - ballScreenY();
  if (targetCam > camY) camY += (targetCam - camY) * Math.min(1, dt * 10);

  if (ball.vy > 0) {
    // swept collision: check the full path from prev to current (prevents tunneling at high speed)
    const prevBy = prevY + BALL_R;
    const by = ball.y + BALL_R;
    let hit = null;
    for (const p of platforms) {
      if (p.gone) continue;
      if (p.y >= prevY - BALL_R && p.y <= by + 4 && p.y >= prevBy - 2) { hit = p; break; }
    }
    if (hit) {
      const gapCenter = hit.gapA + hit.rot;
      const off = angDist(0, gapCenter);
      if (off < hit.gapW / 2) {
        // fell through the gap
        const centered = off < hit.gapW * 0.16;
        onPass(hit, centered);
        // nudge ball past so we don't double-trigger
        ball.y = hit.y + BALL_R + 2;
      } else if (fireball) {
        onSmash(hit);
        ball.y = hit.y + BALL_R + 2;
      } else if (hit.type === T_RED) {
        onDeath('red crystal');
      } else {
        ball.y = hit.y - BALL_R;
        onBounce(hit);
      }
    }
  }

  // fireball trail
  if (fireball && Math.random() < 0.6) {
    parts.push({ x: W / 2 + (Math.random() - 0.5) * 20, y: ballScreenY() - 10,
      vx: (Math.random() - 0.5) * 80, vy: -60 - Math.random() * 120,
      life: 0.5, col: Math.random() < 0.5 ? '#ffb52e' : '#ff6a2e', size: 3 + Math.random() * 5 });
  }

  // particles
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.life -= dt;
    if (p.life <= 0) { parts.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 500 * dt;
  }
  for (let i = floats.length - 1; i >= 0; i--) {
    const f = floats[i];
    f.life -= dt * 0.9; f.y -= 34 * dt;
    if (f.life <= 0) floats.splice(i, 1);
  }
  // dust drift
  for (const d of dust) {
    d.y += d.v * dt; d.tw += dt * 2;
    if (d.y > H + 10) { d.y = -10; d.x = Math.random() * W; }
  }
  // rotation inertia decay
  for (const p of platforms) p.rot += rotVel * dt;
  rotVel *= Math.pow(0.02, dt);

  bounceT += dt;
  // bounce rings expand and fade
  for (let i = rings.length - 1; i >= 0; i--) {
    const r = rings[i];
    r.life -= dt * 2.2; r.r += 160 * dt;
    if (r.life <= 0) rings.splice(i, 1);
  }

  if (state === 'dead') deadT += dt;
}

// ---------- input ----------
let dragging = false, lastX = 0;
const muteBox = { x: 0, y: 0, w: 44, h: 44 };
function layoutMute() { muteBox.x = W - 52; muteBox.y = 14; }
function onDown(x, y) {
  initAudio();
  if (AC && AC.state === 'suspended' && !muted) { try { AC.resume(); } catch (e) {} }
  layoutMute();
  if (x >= muteBox.x && x <= muteBox.x + muteBox.w && y >= muteBox.y && y <= muteBox.y + muteBox.h) {
    muted = !muted;
    if (muted) audioSuspend(); else audioResume();
    return;
  }
  if (state === 'ready') { state = 'play'; }
  else if (state === 'dead' && deadT > 0.6) { reset((Math.random() * 1e9) | 0); state = 'play'; return; }
  if (state !== 'play') return;
  dragging = true; lastX = x; rotVel = 0;
}
function onMove(x) {
  if (!dragging || state !== 'play') return;
  const dx = x - lastX; lastX = x;
  const dRot = dx * 0.016;
  for (const p of platforms) p.rot += dRot;
  rotVel = dRot * 60; // carry a little inertia
}
function onUp() { dragging = false; }
cv.addEventListener('pointerdown', e => { e.preventDefault(); onDown(e.clientX, e.clientY); });
window.addEventListener('pointermove', e => onMove(e.clientX, e.clientY));
window.addEventListener('pointerup', onUp);
window.addEventListener('pointercancel', onUp);

// ---------- render ----------
function drawTower() {
  const cx = W / 2;
  const g = ctx.createLinearGradient(cx - TOWER_R, 0, cx + TOWER_R, 0);
  g.addColorStop(0, '#17173a'); g.addColorStop(0.5, '#2c2c66'); g.addColorStop(1, '#141432');
  ctx.fillStyle = g;
  ctx.fillRect(cx - TOWER_R, -20, TOWER_R * 2, H + 40);
  // facet lines
  ctx.strokeStyle = 'rgba(150,140,255,0.16)'; ctx.lineWidth = 1.5;
  for (const fx of [-0.55, 0, 0.55]) {
    ctx.beginPath(); ctx.moveTo(cx + fx * TOWER_R, -20); ctx.lineTo(cx + fx * TOWER_R, H + 40); ctx.stroke();
  }
  // edge glow
  ctx.strokeStyle = 'rgba(120,200,255,0.25)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(cx - TOWER_R, -20); ctx.lineTo(cx - TOWER_R, H + 40); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx + TOWER_R, -20); ctx.lineTo(cx + TOWER_R, H + 40); ctx.stroke();
}
function drawPlatform(p) {
  const sy = p.y - camY;
  if (sy < -60 || sy > H + 60) return;
  const cx = W / 2;
  const outer = TOWER_R * 2.35, inner = TOWER_R * 0.92;
  const ryO = outer * 0.30, ryI = inner * 0.30;
  const c = platColor(p.type);
  // gap in canvas-angle space: ball at front = canvas angle PI/2
  const gapC = p.gapA + p.rot + Math.PI / 2;
  const a1 = gapC + p.gapW / 2, a2 = gapC - p.gapW / 2 + Math.PI * 2;
  ctx.save();
  // glow underlay
  ctx.shadowColor = c.glow; ctx.shadowBlur = 18;
  ctx.beginPath();
  ctx.ellipse(cx, sy, outer, ryO, 0, a1, a2, false);
  ctx.ellipse(cx, sy, inner, ryI, 0, a2, a1, true);
  ctx.closePath();
  const g = ctx.createLinearGradient(0, sy - ryO, 0, sy + ryO);
  g.addColorStop(0, c.top); g.addColorStop(1, c.edge);
  ctx.fillStyle = g;
  ctx.fill();
  ctx.shadowBlur = 0;
  // top facet line
  ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.ellipse(cx, sy - 1, outer, ryO, 0, a1, a2, false);
  ctx.stroke();
  // fragile cracks
  if (p.type === T_FRAGILE) {
    ctx.strokeStyle = 'rgba(90,130,170,0.7)'; ctx.lineWidth = 1;
    const mid = (a1 + a2) / 2;
    for (let k = -1; k <= 1; k++) {
      const a = mid + k * 0.5;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * inner, sy + Math.sin(a) * ryI);
      ctx.lineTo(cx + Math.cos(a + 0.12) * outer, sy + Math.sin(a + 0.12) * ryO);
      ctx.stroke();
    }
  }
  // spring coils hint
  if (p.type === T_SPRING) {
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    const mid = (a1 + a2) / 2;
    for (let k = -2; k <= 2; k++) {
      const a = mid + k * 0.35;
      ctx.beginPath();
      ctx.arc(cx + Math.cos(a) * (inner + outer) / 2, sy + Math.sin(a) * (ryI + ryO) / 2, 2.5, 0, 6.29);
      ctx.fill();
    }
  }
  ctx.restore();
}
function drawBall() {
  const x = W / 2, y = ballScreenY();
  // impact squash: strong squash on bounce, springs back over ~0.25s
  // combined with velocity stretch for a lively feel
  const impact = Math.max(0, 1 - bounceT / 0.25);
  const impactSquash = 1 - 0.35 * Math.sin(impact * Math.PI); // 1 -> 0.65 -> 1
  const velStretch = clamp(1 + ball.vy / 4000, 0.85, 1.2);
  const squash = impactSquash * velStretch;
  ctx.save();
  ctx.translate(x, y); ctx.scale(1 / Math.sqrt(squash), squash);
  if (fireball) {
    ctx.shadowColor = '#ff7a2e'; ctx.shadowBlur = 34;
    const g = ctx.createRadialGradient(0, 0, 2, 0, 0, BALL_R + 4);
    g.addColorStop(0, '#fff3d6'); g.addColorStop(0.5, '#ffb52e'); g.addColorStop(1, '#ff4a1e');
    ctx.fillStyle = g;
  } else {
    ctx.shadowColor = '#35e0e6'; ctx.shadowBlur = 26;
    const g = ctx.createRadialGradient(-4, -5, 2, 0, 0, BALL_R + 2);
    g.addColorStop(0, '#ffffff'); g.addColorStop(0.55, '#bdf6ff'); g.addColorStop(1, '#35b8c6');
    ctx.fillStyle = g;
  }
  ctx.beginPath(); ctx.arc(0, 0, BALL_R, 0, 6.29); ctx.fill();
  ctx.restore();
}
function drawMute() {
  layoutMute();
  const x = muteBox.x, y = muteBox.y;
  ctx.save();
  ctx.globalAlpha = 0.55;
  ctx.strokeStyle = '#c9d4ff'; ctx.fillStyle = '#c9d4ff'; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x + 8, y + 18); ctx.lineTo(x + 14, y + 18); ctx.lineTo(x + 20, y + 12);
  ctx.lineTo(x + 20, y + 32); ctx.lineTo(x + 14, y + 26); ctx.lineTo(x + 8, y + 26);
  ctx.closePath(); ctx.fill();
  if (muted) {
    ctx.beginPath(); ctx.moveTo(x + 24, y + 16); ctx.lineTo(x + 36, y + 28); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x + 36, y + 16); ctx.lineTo(x + 24, y + 28); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.arc(x + 22, y + 22, 6, -0.9, 0.9); ctx.stroke();
    ctx.beginPath(); ctx.arc(x + 22, y + 22, 10, -0.9, 0.9); ctx.stroke();
  }
  ctx.restore();
}
function render() {
  // bg
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#0a0a18'); bg.addColorStop(0.6, '#10102a'); bg.addColorStop(1, '#181838');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  // dust
  for (const d of dust) {
    ctx.globalAlpha = 0.25 + 0.2 * Math.sin(d.tw);
    ctx.fillStyle = '#9fd8ff';
    ctx.fillRect(d.x, d.y, d.s, d.s);
  }
  ctx.globalAlpha = 1;

  drawTower();
  // platforms sorted far-to-near (higher y first so lower ones draw over)
  const vis = platforms.filter(p => !p.gone && p.y - camY > -60 && p.y - camY < H + 60);
  vis.sort((a, b) => b.y - a.y);
  for (const p of vis) drawPlatform(p);

  // particles behind ball
  for (const p of parts) {
    ctx.globalAlpha = clamp(p.life * 1.6, 0, 1);
    ctx.fillStyle = p.col;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;

  if (state !== 'dead') drawBall();

  // bounce impact rings
  for (const r of rings) {
    ctx.globalAlpha = clamp(r.life * 0.7, 0, 1);
    ctx.strokeStyle = '#8ef7ff'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.ellipse(W / 2, r.y, r.r, r.r * 0.35, 0, 0, 6.29); ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // floats
  ctx.textAlign = 'center';
  for (const f of floats) {
    ctx.globalAlpha = clamp(f.life * 1.4, 0, 1);
    ctx.font = '700 ' + f.size + 'px -apple-system, "Segoe UI", system-ui, sans-serif';
    ctx.fillStyle = f.col;
    ctx.fillText(f.txt, f.x, f.y);
  }
  ctx.globalAlpha = 1;

  // HUD
  const scrim = ctx.createLinearGradient(0, 0, 0, 130);
  scrim.addColorStop(0, 'rgba(6,6,18,0.72)'); scrim.addColorStop(1, 'rgba(6,6,18,0)');
  ctx.fillStyle = scrim; ctx.fillRect(0, 0, W, 130);
  ctx.textAlign = 'center';
  ctx.font = '800 52px -apple-system, "Segoe UI", system-ui, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.92)';
  ctx.fillText(String(score), W / 2, 64);
  ctx.font = '600 15px -apple-system, "Segoe UI", system-ui, sans-serif';
  ctx.fillStyle = 'rgba(180,190,230,0.7)';
  ctx.fillText('BEST ' + best, W / 2, 88);
  if (fireball) {
    ctx.font = '700 15px -apple-system, "Segoe UI", system-ui, sans-serif';
    ctx.fillStyle = '#ffb52e';
    ctx.fillText('FIREBALL x' + fireCharge, W / 2, 110);
  }

  drawMute();

  // overlays
  if (state === 'ready') {
    ctx.fillStyle = 'rgba(6,6,16,0.55)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff';
    ctx.font = '800 34px -apple-system, "Segoe UI", system-ui, sans-serif';
    ctx.fillText('HELIX DESCEND', W / 2, H * 0.36);
    ctx.font = '500 17px -apple-system, "Segoe UI", system-ui, sans-serif';
    ctx.fillStyle = 'rgba(220,228,255,0.85)';
    ctx.fillText('Drag to spin the spire.', W / 2, H * 0.36 + 40);
    ctx.fillText('Thread the gaps. Dodge the red.', W / 2, H * 0.36 + 64);
    ctx.fillText('Three clean drops lights the fireball.', W / 2, H * 0.36 + 88);
    ctx.fillStyle = '#8ef7ff';
    ctx.font = '700 19px -apple-system, "Segoe UI", system-ui, sans-serif';
    ctx.fillText('TAP TO DESCEND', W / 2, H * 0.36 + 132);
  } else if (state === 'dead' && deadT > 0.35) {
    ctx.fillStyle = 'rgba(20,4,10,0.6)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ff5e7e';
    ctx.font = '800 34px -apple-system, "Segoe UI", system-ui, sans-serif';
    ctx.fillText('SHATTERED', W / 2, H * 0.38);
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.font = '800 52px -apple-system, "Segoe UI", system-ui, sans-serif';
    ctx.fillText(String(score), W / 2, H * 0.38 + 62);
    ctx.fillStyle = 'rgba(180,190,230,0.75)';
    ctx.font = '600 15px -apple-system, "Segoe UI", system-ui, sans-serif';
    ctx.fillText('BEST ' + best, W / 2, H * 0.38 + 88);
    if (deadT > 0.6) {
      ctx.fillStyle = '#8ef7ff';
      ctx.font = '700 19px -apple-system, "Segoe UI", system-ui, sans-serif';
      ctx.fillText('TAP TO RETRY', W / 2, H * 0.38 + 126);
    }
  }
}

// ---------- main loop ----------
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (state === 'play') step(dt);
  else { elapsed += dt; if (state === 'dead') deadT += dt; }
  render();
  requestAnimationFrame(loop);
}
reset(12345);
requestAnimationFrame(loop);

// debug hook for automated play-testing
window.__hx = {
  get state() { return state; },
  get score() { return score; },
  get best() { return best; },
  get ball() { return { y: ball.y, vy: ball.vy }; },
  get fireball() { return fireball; },
  get fireCharge() { return fireCharge; },
  get streak() { return streak; },
  get platCount() { return platforms.length; },
  platforms() { return platforms.slice(0, 6).map(p => ({ y: Math.round(p.y), type: p.type, gapA: +p.gapA.toFixed(2), rot: +p.rot.toFixed(2), gone: p.gone })); },
  rotate(dx) { for (const p of platforms) p.rot += dx; },
  alignGap() { // rotate so the next platform's gap faces the ball (front = angle 0)
    const by = ball.y + BALL_R;
    for (const p of platforms) {
      if (p.gone || p.y < by) continue;
      const want = angNorm(0 - p.gapA);
      const d = angNorm(want - p.rot);
      for (const q of platforms) q.rot += d;
      return p.type;
    }
    return -1;
  },
  drop() { ball.vy = 1400; },
  kill() { onDeath('debug'); },
  restart() { reset((Math.random() * 1e9) | 0); state = 'play'; },
  start() { if (state === 'ready') state = 'play'; },
  toggleMute() { muted = !muted; }
};
</script>
