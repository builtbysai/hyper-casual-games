<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#10132b">
<title>Helix Descend</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10132b;
    overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
  canvas:active{cursor:grabbing}
</style>
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* HELIX DESCEND — hyper-casual #04.
 * MODEL: Helix Jump. Drag to rotate the tower, guide the bouncing ball
 * down through platform gaps. Red crystal kills. Three clean gap passes
 * in a row ignites a fireball that smashes everything it touches.
 * IMPROVE: crystal spire theme; fragile platforms that shatter after one
 * bounce; spring platforms that launch the ball; perfect center-gap
 * landings pay double and build a rising chime streak.
 * One touch (drag to rotate). Portrait. Tap to start, tap to retry.
 */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// ---------- utils ----------
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function angNorm(a) { while (a > Math.PI) a -= Math.PI * 2; while (a < -Math.PI) a += Math.PI * 2; return a; }
function angDist(a, b) { return Math.abs(angNorm(a - b)); }
function buzz(ms) {
  try { if (typeof navigator.vibrate === 'function') navigator.vibrate(ms); } catch (e) {}
}

// audio cleanup: suspend on tab hide / window blur / page close, resume on return
function audioSuspend() { try { if (AC && AC.state === 'running') AC.suspend(); } catch (e) {} }
function audioResume() { try { if (AC && AC.state === 'suspended' && !muted) AC.resume(); } catch (e) {} }
document.addEventListener('visibilitychange', () => { if (document.hidden) audioSuspend(); else audioResume(); });
window.addEventListener('blur', audioSuspend);
window.addEventListener('focus', audioResume);
window.addEventListener('pagehide', audioSuspend);

// ---------- audio ----------
let AC = null, muted = false;
function initAudio() {
  if (AC) return;
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); }
  catch (e) { AC = null; }
}
function tone(freq, dur, type, vol, when, slideTo) {
  if (!AC || muted) return;
  try {
    const t0 = AC.currentTime + (when || 0);
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.2, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(AC.destination);
    o.start(t0); o.stop(t0 + dur + 0.05);
  } catch (e) {}
}
function noiseBurst(dur, vol, freq) {
  if (!AC || muted) return;
  try {
    const t0 = AC.currentTime, len = Math.floor(AC.sampleRate * dur);
    const buf = AC.createBuffer(1, len, AC.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = AC.createBufferSource(); src.buffer = buf;
    const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq || 2000;
    const g = AC.createGain(); g.gain.value = vol || 0.25;
    src.connect(f).connect(g).connect(AC.destination);
    src.start(t0);
  } catch (e) {}
}
const sfx = {
  bounce(combo) { tone(300 + Math.min(combo, 10) * 24, 0.09, 'sine', 0.18); },
  perfect(streak) { const p = Math.pow(1.059, Math.min(streak, 12)); tone(660 * p, 0.22, 'sine', 0.2); tone(990 * p, 0.3, 'sine', 0.12, 0.06); },
  shatter() { noiseBurst(0.18, 0.3, 3200); },
  spring() { tone(180, 0.22, 'sine', 0.22, 0, 620); },
  fireball() { noiseBurst(0.4, 0.2, 700); tone(120, 0.4, 'sawtooth', 0.1, 0, 420); },
  smash() { noiseBurst(0.12, 0.32, 1500); tone(220, 0.12, 'square', 0.12, 0, 90); },
  death() { tone(320, 0.5, 'sawtooth', 0.22, 0, 70); noiseBurst(0.3, 0.2, 500); },
  milestone() { tone(523, 0.4, 'triangle', 0.12); tone(784, 0.5, 'triangle', 0.1, 0.12); }
};

// ---------- game constants ----------
const GRAV = 2450, BOUNCE_V = -610, SPRING_V = -920, MAX_FALL = 1580;
const BALL_R = 14, PLAT_DY = 164;
const TOWER_R = 46;
const BEST_KEY = 'helix_best';
const SOUND_KEY = 'helix_sound';
const TAU = Math.PI * 2;
let generatedCount = 0, depth = 0, towerAngle = 0, level = 1;
let lastGap = 0, flash = 0, shake = 0, dangerPulse = 0;

// platform types
const T_NORMAL = 0, T_FRAGILE = 1, T_SPRING = 2, T_RED = 3;

// ---------- state ----------
let state = 'ready'; // ready | play | dead
let rng = mulberry32(1);
let platforms = [];
let ball = { y: 0, vy: 0 };
let camY = 0; // world y at screen top-ish anchor
let score = 0, best = 0;
let streak = 0;        // consecutive gap passes without bouncing
let fireball = false, fireCharge = 0;
let perfectStreak = 0;
let deadT = 0, deathReason = '';
let floats = [];      // popup texts {x,y,txt,life,col,size}
let parts = [];       // particles {x,y,vx,vy,life,col,size}
let rings = [];       // bounce impact rings {y,r,life}
let dust = [];        // background crystal dust
let rotVel = 0;
let bounceT = 99; // time since last bounce (for impact squash)
let elapsed = 0;
let milestoneHit = 0;

try { best = parseInt(localStorage.getItem(BEST_KEY) || '0', 10) || 0; muted = localStorage.getItem(SOUND_KEY) === 'off'; } catch (e) { best = 0; }
function saveBest() { try { localStorage.setItem(BEST_KEY, String(best)); } catch (e) {} }

// screen anchor for the ball
function ballScreenY() { return H * (H < 530 ? 0.35 : 0.34); }
function ballVisualY() { return ball.y - camY; }
function worldToScreen(y) { return y - camY; }
function towerRadius() { return clamp(Math.min(W * 0.125, H * 0.065), 35, 56); }

// ---------- platform generation ----------
// Each ring has one opening, and some have a small red danger wedge.
// Ring angles follow a walk, rather than scattering at random, so chains
// are achievable through deliberate small swipes.
function genPlatform(y, index) {
  const drift = (rng() * 2 - 1) * (index < 7 ? 0.98 : 1.3);
  lastGap = angNorm(lastGap + drift);
  const gapW = index < 4 ? 1.52 : clamp(1.42 - Math.max(0, index - 6) * 0.006, 0.94, 1.42);
  const hazardous = index > 6 && rng() < clamp(0.17 + index * 0.002, 0, 0.36);
  const typeRoll = rng();
  let type = T_NORMAL;
  if (hazardous) type = T_RED;
  else if (index > 5 && typeRoll < 0.12) type = T_FRAGILE;
  else if (index > 8 && typeRoll < 0.19) type = T_SPRING;
  return { y, rot: 0, gapA: lastGap, gapW, type, gone: false,
    dangerA: angNorm(lastGap + Math.PI + (rng() - 0.5) * 0.55),
    dangerW: clamp(0.72 + index * 0.002, 0.72, 1.02), index };
}
function reset(seed) {
  rng = mulberry32(seed || 1);
  platforms = [];
  generatedCount = 0; depth = 0; level = 1; towerAngle = 0; lastGap = 0;
  const startY = 124;
  // Always give the player one easy opening to establish the mechanic.
  platforms.push({ y:startY, rot:0, gapA:0.17, gapW:1.66, type:T_NORMAL,
    gone:false, dangerA:Math.PI, dangerW:0, index:0 });
  lastGap = 0.17;
  generatedCount = 1;
  for (let i=1;i<35;i++) platforms.push(genPlatform(startY+i*PLAT_DY,generatedCount++));
  ball.y = -40; ball.vy = 0; camY = ball.y - ballScreenY();
  score = 0; streak = 0; perfectStreak = 0; fireball = false; fireCharge = 0;
  floats = []; parts = []; rings = []; bounceT = 99; deadT = 0; deathReason = '';
  flash = 0; shake = 0; milestoneHit = 0; dragging = false; rotVel = 0;
  dust = Array.from({length:46},()=>({x:Math.random()*W,y:Math.random()*H,
    s:0.6+Math.random()*1.6,v:4+Math.random()*12,tw:Math.random()*TAU}));
}
function ensurePlatforms() {
  let maxY = platforms.length ? platforms[platforms.length-1].y : ball.y;
  while (maxY < camY + H + 500) {
    maxY += PLAT_DY;
    platforms.push(genPlatform(maxY,generatedCount++));
  }
  const cutoff = camY - 440;
  while (platforms.length && platforms[0].y < cutoff) platforms.shift();
}


// ---------- effects ----------
function addFloat(txt, col, size) {
  floats.push({ x: W / 2, y: ballScreenY() - 70, txt, life: 1, col: col || '#fff', size: size || 26 });
}
function burst(x, y, n, col, spd) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = (0.3 + Math.random() * 0.7) * (spd || 260);
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 120, life: 0.7 + Math.random() * 0.5, col, size: 2 + Math.random() * 4 });
  }
}
function platColor(t) {
  if (t === T_RED) return { top: '#ff2e5e', edge: '#a3123a', glow: 'rgba(255,46,94,0.35)' };
  if (t === T_FRAGILE) return { top: '#cfe8ff', edge: '#7fa8cc', glow: 'rgba(207,232,255,0.25)' };
  if (t === T_SPRING) return { top: '#ffb52e', edge: '#c07a10', glow: 'rgba(255,181,46,0.45)' };
  return { top: '#35e0e6', edge: '#17888e', glow: 'rgba(53,224,230,0.3)' };
}

// ---------- scoring / events ----------
function award(n) {
  score += n;
  if (score > best) { best = score; saveBest(); }
}
function onPass(plat, centered) {
  plat.gone = true;
  depth++;
  level = Math.floor(depth / 12) + 1;
  streak++;
  if (centered) {
    award(2); perfectStreak++;
    if (perfectStreak > 1 || depth > 1) addFloat('PERFECT  +2', '#fff6b0', 19);
    sfx.perfect(perfectStreak);
    burst(W/2, ballVisualY(), 12, '#fff1a1', 270);
  } else {
    award(1); perfectStreak = 0;
    if (streak > 1) addFloat('+' + streak + ' CHAIN', '#9df6e0', 18);
    tone(490+Math.min(streak,6)*50,0.11,'sine',0.12);
  }
  flash = Math.max(flash,0.12);
  if (!fireball && streak >= 3) {
    fireball = true; fireCharge = 3;
    addFloat('ON FIRE', '#ffd076', 28); sfx.fireball(); buzz(24);
    shake = Math.max(shake,3);
  }
  if (depth % 12 === 0) {
    addFloat('LEVEL ' + level,'#ffffff',27);
    sfx.milestone(); buzz(12);
  }
}
function onSmash(plat) {
  plat.gone = true; depth++; level = Math.floor(depth / 12) + 1;
  award(2);
  fireCharge--;
  const sy = worldToScreen(plat.y);
  burst(W/2,sy,25,plat.type===T_RED?'#ff526d':'#ffcc74',340);
  shake=8; flash=0.28;
  addFloat('SMASH  +2','#ffc56f',20);
  sfx.smash();buzz(18);
  if (fireCharge <= 0) { fireball=false;streak=0;perfectStreak=0; }
  if (depth % 12 === 0) {addFloat('LEVEL ' + level,'#ffffff',27);sfx.milestone();}
}
function onBounce(plat) {
  bounceT=0;
  rings.push({y:worldToScreen(plat.y),r:BALL_R,life:1});
  if (plat.type===T_SPRING) {
    ball.vy=SPRING_V; sfx.spring(); addFloat('BOOST','#ffdc84',18);
    burst(W/2,worldToScreen(plat.y),12,'#ffd28c',200);
  } else {ball.vy=BOUNCE_V;sfx.bounce(streak);}
  if (plat.type===T_FRAGILE) {
    plat.gone=true;sfx.shatter();
    burst(W/2,worldToScreen(plat.y),18,'#dcefff',240);
  }
  streak=0;perfectStreak=0;fireball=false;fireCharge=0;
  shake=Math.max(shake,2.3);buzz(7);
}
function onDeath(reason) {
  if (state!=='play') return;
  state='dead';deadT=0;deathReason=reason;dragging=false;rotVel=0;
  sfx.death();buzz([50,30,80]);shake=12;flash=0.45;
  burst(W/2,ballVisualY(),35,'#ff6b85',350);
}


// ---------- physics ----------
function step(dt) {
  ensurePlatforms();
  const previous = ball.y + BALL_R;
  ball.vy = Math.min(MAX_FALL,ball.vy + GRAV * dt);
  ball.y += ball.vy * dt;
  // Smooth tracking in both directions keeps the ball and next two rings in view.
  const target = ball.y - ballScreenY();
  camY += (target-camY) * (1-Math.exp(-7.5*dt));
  if (ball.vy > 0) {
    const foot = ball.y + BALL_R;
    for (const p of platforms) {
      if (p.gone || p.y < previous-0.05 || p.y > foot+0.05) continue;
      const gapOffset=angDist(0,p.gapA+p.rot);
      const clearance=Math.max(0.19,p.gapW/2-0.095);
      if (gapOffset < clearance) {
        const centered=gapOffset < Math.min(0.24,p.gapW*0.145);
        onPass(p,centered);ball.y=p.y+BALL_R+1;
      } else if (fireball) {
        onSmash(p);ball.y=p.y+BALL_R+1;
      } else if (p.type===T_RED && angDist(0,p.dangerA+p.rot) < p.dangerW/2+0.08) {
        ball.y=p.y-BALL_R;onDeath('RED ZONE');
      } else {
        ball.y=p.y-BALL_R;onBounce(p);
      }
      break;
    }
  }
  if (fireball && Math.random()<Math.min(0.75,dt*36)) {
    parts.push({x:W/2+(Math.random()-.5)*24,y:ballVisualY()+12,
      vx:(Math.random()-.5)*85,vy:80+Math.random()*90,life:.45,
      col:Math.random()<.5?'#ffbd67':'#ff6b60',size:3+Math.random()*5});
  }
}
function animateEffects(dt) {
  bounceT += dt;elapsed += dt;
  flash=Math.max(0,flash-dt*1.5);shake=Math.max(0,shake-dt*26);
  dangerPulse+=dt*3;
  for(let i=parts.length-1;i>=0;i--) {
    const p=parts[i];p.life-=dt;
    if(p.life<=0){parts.splice(i,1);continue;}
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=520*dt;
  }
  for(let i=floats.length-1;i>=0;i--) {
    const f=floats[i];f.life-=dt*.9;f.y-=44*dt;
    if(f.life<=0)floats.splice(i,1);
  }
  for(let i=rings.length-1;i>=0;i--) {
    const r=rings[i];r.life-=dt*2.4;r.r+=150*dt;
    if(r.life<=0)rings.splice(i,1);
  }
  for(const d of dust){
    d.y+=d.v*dt;d.tw+=dt*1.4;
    if(d.y>H+5){d.y=-5;d.x=Math.random()*W;}
  }
  if(state==='dead')deadT+=dt;
}


// ---------- input ----------
let dragging = false, lastX = 0, pointerId = null;
const keys = {left:false,right:false};
const muteBox = {x:0,y:0,w:48,h:48};
function layoutMute() { muteBox.x=W-56;muteBox.y=10; }
function toggleSound(){
  muted=!muted;
  try{localStorage.setItem(SOUND_KEY,muted?'off':'on');}catch(e){}
  if(muted)audioSuspend();else audioResume();
}
function onDown(x,y,id) {
  initAudio();
  if(AC&&AC.state==='suspended'&&!muted) {try{AC.resume();}catch(e){}}
  layoutMute();
  if(x>=muteBox.x&&x<=muteBox.x+muteBox.w&&y>=muteBox.y&&y<=muteBox.y+muteBox.h){
    toggleSound();return false;
  }
  if(state==='dead') {
    if(deadT>=0.23){reset((Math.random()*0x7fffffff)|0);state='play';}
    return false;
  }
  if(state==='ready')state='play';
  if(state!=='play')return false;
  dragging=true;lastX=x;pointerId=id;rotVel=0;
  return true;
}
function onMove(x,id){
  if(!dragging||state!=='play'||pointerId!==id)return;
  const dx=clamp(x-lastX,-95,95);lastX=x;
  const radians=dx*(W<600?0.0145:0.0115);
  for(const p of platforms)p.rot+=radians;
  towerAngle+=radians;
}
function onUp(id){if(pointerId===id){dragging=false;pointerId=null;rotVel=0;}}
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();
  if(onDown(e.clientX,e.clientY,e.pointerId)){
    try{cv.setPointerCapture(e.pointerId);}catch(err){}
  }
});
cv.addEventListener('pointermove',e=>onMove(e.clientX,e.pointerId));
cv.addEventListener('pointerup',e=>onUp(e.pointerId));
cv.addEventListener('pointercancel',e=>onUp(e.pointerId));
window.addEventListener('blur',()=>{keys.left=false;keys.right=false;dragging=false;});
window.addEventListener('keydown',e=>{
  if(['ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();
  if(e.code==='ArrowLeft'||e.code==='KeyA')keys.left=true;
  if(e.code==='ArrowRight'||e.code==='KeyD')keys.right=true;
  if(e.code==='Space'||e.code==='Enter'){
    if(state==='ready')state='play';
    else if(state==='dead'&&deadT>=.23){reset((Math.random()*0x7fffffff)|0);state='play';}
  }
  if(e.code==='KeyM'&&!e.repeat)toggleSound();
});
window.addEventListener('keyup',e=>{
  if(e.code==='ArrowLeft'||e.code==='KeyA')keys.left=false;
  if(e.code==='ArrowRight'||e.code==='KeyD')keys.right=false;
});
function updateKeyboard(dt){
  if(state!=='play')return;
  const direction=(keys.right?1:0)-(keys.left?1:0);
  if(!direction)return;
  const r=direction*dt*3.65;
  towerAngle+=r;
  for(const p of platforms)p.rot+=r;
}


// ---------- render ----------
function drawTower(){
  const cx=W/2,r=towerRadius();
  const g=ctx.createLinearGradient(cx-r,0,cx+r,0);
  g.addColorStop(0,'#101c3b');g.addColorStop(.23,'#304466');
  g.addColorStop(.49,'#51658a');g.addColorStop(.72,'#293d62');
  g.addColorStop(1,'#101b38');
  ctx.fillStyle=g;ctx.fillRect(cx-r,-24,r*2,H+48);
  ctx.strokeStyle='rgba(204,229,255,.13)';ctx.lineWidth=1;
  for(const v of [-.65,-.24,.25,.67]){
    ctx.beginPath();ctx.moveTo(cx+v*r,0);ctx.lineTo(cx+v*r,H);ctx.stroke();
  }
  ctx.fillStyle='rgba(10,16,36,.3)';
  ctx.fillRect(cx-r-3,0,3,H);ctx.fillRect(cx+r,0,3,H);
}
// The ring's front rim and the BALL'S collision plane now have the same y.
// Canvas angle PI/2 is the front of the tower; physics angle 0 is that front.
function annulus(cx,cy,outer,inner,a,b,fill){
  ctx.beginPath();
  ctx.ellipse(cx,cy,outer,outer*.285,0,a,b,false);
  ctx.ellipse(cx,cy,inner,inner*.285,0,b,a,true);
  ctx.closePath();ctx.fillStyle=fill;ctx.fill();
}
function drawPlatform(p) {
  const top=worldToScreen(p.y), cx=W/2, outer=towerRadius()*2.55;
  if(top < -85||top > H+90)return;
  const inner=towerRadius()*.98,cy=top-outer*.285;
  const c=platColor(p.type);
  const front=p.gapA+p.rot+Math.PI/2;
  const start=front+p.gapW/2,end=front+TAU-p.gapW/2;
  ctx.save();
  // Solid extruded underside, drawn behind the deck.
  annulus(cx,cy+9,outer,inner,start,end,'#162544');
  const base=ctx.createLinearGradient(0,cy-outer*.29,0,cy+outer*.3);
  if(p.type===T_SPRING){
    base.addColorStop(0,'#ffe3a1');base.addColorStop(.5,'#f7c66e');base.addColorStop(1,'#d29a48');
  }else if(p.type===T_FRAGILE){
    base.addColorStop(0,'#f1f9ff');base.addColorStop(.5,'#cce8f6');base.addColorStop(1,'#8eb8cb');
  }else{
    base.addColorStop(0,'#e0f7ec');base.addColorStop(.5,'#8de1cb');base.addColorStop(1,'#49a995');
  }
  ctx.shadowColor='rgba(5,15,36,.25)';ctx.shadowBlur=8;ctx.shadowOffsetY=5;
  annulus(cx,cy,outer,inner,start,end,base);
  ctx.shadowBlur=0;ctx.shadowOffsetY=0;
  // Red is a danger SECTOR, not an entire mysterious instant-death ring.
  if(p.type===T_RED){
    const hazard=p.dangerA+p.rot+Math.PI/2;
    annulus(cx,cy,outer+0.4,inner-0.4,hazard-p.dangerW/2,hazard+p.dangerW/2,'#f55465');
    ctx.strokeStyle='rgba(255,236,236,.52)';ctx.lineWidth=2;
    const z=hazard;
    ctx.beginPath();ctx.ellipse(cx,cy,outer,outer*.285,0,z-p.dangerW/2,z+p.dangerW/2);ctx.stroke();
  }
  ctx.lineWidth=1.6;ctx.strokeStyle='rgba(255,255,255,.36)';
  ctx.beginPath();ctx.ellipse(cx,cy,outer,outer*.285,0,start,end,false);ctx.stroke();
  // Recognizable cracks and springs use the same angular space as collisions.
  if(p.type===T_FRAGILE) {
    ctx.strokeStyle='#5f98b0';ctx.lineWidth=1.4;
    for(let k=0;k<5;k++){
      const a=start+(k+1)*(end-start)/6;
      ctx.beginPath();
      ctx.moveTo(cx+Math.cos(a)*inner,cy+Math.sin(a)*inner*.285);
      ctx.lineTo(cx+Math.cos(a+.13)*outer,cy+Math.sin(a+.13)*outer*.285);
      ctx.stroke();
    }
  }
  if(p.type===T_SPRING) {
    ctx.strokeStyle='#ad7832';ctx.lineWidth=3;
    for(let k=0;k<4;k++){
      const a=start+(k+1)*(end-start)/5,r=(inner+outer)/2;
      ctx.beginPath();ctx.arc(cx+Math.cos(a)*r,cy+Math.sin(a)*r*.285,3,0,TAU);ctx.stroke();
    }
  }
  ctx.restore();
}

function drawBall() {
  const x = W / 2, y = ballVisualY();
  // impact squash: strong squash on bounce, springs back over ~0.25s
  // combined with velocity stretch for a lively feel
  const impact = Math.max(0, 1 - bounceT / 0.25);
  const impactSquash = 1 - 0.35 * Math.sin(impact * Math.PI); // 1 -> 0.65 -> 1
  const velStretch = clamp(1 + ball.vy / 4000, 0.85, 1.2);
  const squash = impactSquash * velStretch;
  ctx.save();
  ctx.translate(x, y); ctx.scale(1 / Math.sqrt(squash), squash);
  if (fireball) {
    ctx.shadowColor = '#ff7a2e'; ctx.shadowBlur = 34;
    const g = ctx.createRadialGradient(0, 0, 2, 0, 0, BALL_R + 4);
    g.addColorStop(0, '#fff3d6'); g.addColorStop(0.5, '#ffb52e'); g.addColorStop(1, '#ff4a1e');
    ctx.fillStyle = g;
  } else {
    ctx.shadowColor = '#35e0e6'; ctx.shadowBlur = 26;
    const g = ctx.createRadialGradient(-4, -5, 2, 0, 0, BALL_R + 2);
    g.addColorStop(0, '#ffffff'); g.addColorStop(0.55, '#bdf6ff'); g.addColorStop(1, '#35b8c6');
    ctx.fillStyle = g;
  }
  ctx.beginPath(); ctx.arc(0, 0, BALL_R, 0, 6.29); ctx.fill();
  ctx.restore();
}
function drawMute() {
  layoutMute();
  const x = muteBox.x, y = muteBox.y;
  ctx.save();
  ctx.globalAlpha = 0.55;
  ctx.strokeStyle = '#c9d4ff'; ctx.fillStyle = '#c9d4ff'; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x + 8, y + 18); ctx.lineTo(x + 14, y + 18); ctx.lineTo(x + 20, y + 12);
  ctx.lineTo(x + 20, y + 32); ctx.lineTo(x + 14, y + 26); ctx.lineTo(x + 8, y + 26);
  ctx.closePath(); ctx.fill();
  if (muted) {
    ctx.beginPath(); ctx.moveTo(x + 24, y + 16); ctx.lineTo(x + 36, y + 28); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x + 36, y + 16); ctx.lineTo(x + 24, y + 28); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.arc(x + 22, y + 22, 6, -0.9, 0.9); ctx.stroke();
    ctx.beginPath(); ctx.arc(x + 22, y + 22, 10, -0.9, 0.9); ctx.stroke();
  }
  ctx.restore();
}
function label(t,x,y,px,color,weight){
  ctx.font=(weight||700)+' '+px+'px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif';
  ctx.fillStyle=color;ctx.fillText(t,x,y);
}
function render(){
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#11162d');bg.addColorStop(.6,'#172341');bg.addColorStop(1,'#243a54');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  // Quiet architectural grid and vertical light, not a particle blizzard.
  ctx.strokeStyle='rgba(187,216,237,.055)';ctx.lineWidth=1;
  for(let x=W/2%48;x<W;x+=48){
    ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();
  }
  for(const d of dust){
    ctx.globalAlpha=.12+.14*Math.sin(d.tw);ctx.fillStyle='#d4efff';
    ctx.fillRect(d.x,d.y,d.s,d.s);
  }
  ctx.globalAlpha=1;
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  drawTower();
  const visible=platforms.filter(p=>!p.gone&&Math.abs(worldToScreen(p.y)-H/2)<H/2+110);
  // Farther (higher on screen) first, near lower rings last.
  visible.sort((a,b)=>a.y-b.y);
  for(const p of visible)drawPlatform(p);
  for(const p of parts){
    ctx.globalAlpha=clamp(p.life*1.8,0,1);
    ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.size/2,0,TAU);ctx.fill();
  }
  ctx.globalAlpha=1;
  if(state!=='dead')drawBall();
  for(const r of rings){
    ctx.globalAlpha=clamp(r.life*.65,0,1);
    ctx.strokeStyle='#d8ffeb';ctx.lineWidth=2.5;
    ctx.beginPath();ctx.ellipse(W/2,r.y,r.r,r.r*.3,0,0,TAU);ctx.stroke();
  }
  ctx.globalAlpha=1;ctx.restore();
  for(const f of floats){
    ctx.globalAlpha=clamp(f.life*1.5,0,1);
    ctx.textAlign='center';label(f.txt,f.x,f.y,f.size,f.col,800);
  }
  ctx.globalAlpha=1;
  if(flash>0){
    ctx.fillStyle='rgba(255,243,206,'+Math.min(.16,flash*.22)+')';
    ctx.fillRect(0,0,W,H);
  }
  const top=ctx.createLinearGradient(0,0,0,138);
  top.addColorStop(0,'rgba(11,16,33,.91)');
  top.addColorStop(1,'rgba(11,16,33,0)');
  ctx.fillStyle=top;ctx.fillRect(0,0,W,138);
  ctx.textAlign='center';
  label(String(score),W/2,64,47,'#ffffff',800);
  label('BEST '+best,W/2,85,12,'#9baec4',650);
  // Progress is earned in rings, not inflated by perfect bonuses.
  const barW=Math.min(172,W*.42),barX=(W-barW)/2,barY=102;
  ctx.fillStyle='rgba(255,255,255,.14)';ctx.fillRect(barX,barY,barW,3);
  ctx.fillStyle=fireball?'#ffb870':'#9de8d0';
  ctx.fillRect(barX,barY,barW*(depth%12)/12,3);
  ctx.textAlign='left';label('LV '+level,15,31,12,'#bfd1df',750);
  if(streak>0){
    ctx.textAlign='left';
    label(fireball?'FIRE  '+fireCharge:'CHAIN  '+streak,15,53,12,
      fireball?'#ffc17c':'#a0eed6',800);
    if(!fireball){
      for(let i=0;i<3;i++){
        ctx.fillStyle=i<streak?'#9de8d0':'rgba(255,255,255,.2)';
        ctx.fillRect(16+i*15,60,10,3);
      }
    }
  }
  if(state==='ready'){
    ctx.fillStyle='rgba(9,14,29,.56)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';
    label('HELIX',W/2,H*.39-34,44,'#f5fbff',850);
    label('DESCEND',W/2,H*.39+1,36,'#a5ead8',850);
    label('DRAG TO SPIN THE TOWER',W/2,H*.39+47,13,'#d7e8ed',700);
    label('DROP THROUGH THE OPENINGS',W/2,H*.39+70,12,'#b1c6d0',500);
    const pillY=H*.39+111;
    ctx.fillStyle='#c4f3df';ctx.beginPath();
    if(ctx.roundRect)ctx.roundRect(W/2-93,pillY-24,186,48,24);
    else ctx.rect(W/2-93,pillY-24,186,48);
    ctx.fill();
    ctx.fillStyle='#132b33';label('TAP TO PLAY',W/2,pillY+6,16,'#132b33',800);
  }else if(state==='dead'&&deadT>.18){
    ctx.fillStyle='rgba(10,16,32,.79)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';
    label('RUN OVER',W/2,H*.37-58,13,'#ff8c99',800);
    label(String(score),W/2,H*.37+13,76,'#ffffff',800);
    label('BEST  '+best,W/2,H*.37+40,15,'#bdd2d9',650);
    label('LEVEL '+level+'  ·  '+depth+' RINGS',W/2,H*.37+66,13,'#bdd2d9',650);
    if(deadT>.23){
      const y=H*.37+117;
      ctx.fillStyle='#c4f3df';ctx.beginPath();
      if(ctx.roundRect)ctx.roundRect(W/2-94,y-24,188,48,24);
      else ctx.rect(W/2-94,y-24,188,48);
      ctx.fill();ctx.fillStyle='#132b33';
      label('PLAY AGAIN',W/2,y+6,16,'#132b33',800);
    }
  }
  drawMute();
}

// ---------- main loop ----------
let last=performance.now();
function loop(now){
  let dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;
  if(document.hidden)dt=0;
  if(dt>0){
    updateKeyboard(dt);
    if(state==='play'){
      // Bounded substeps preserve fair gaps even on busy mobile frames.
      let remain=dt;
      while(remain>0&&state==='play'){
        const h=Math.min(1/120,remain);step(h);remain-=h;
      }
    }
    animateEffects(dt);
  }
  render();
  requestAnimationFrame(loop);
}
reset(12345);
requestAnimationFrame(loop);


// Lightweight deterministic hooks for gameplay smoke tests.
window.__hx={
  get state(){return state;},
  get score(){return score;},
  get best(){return best;},
  get depth(){return depth;},
  get level(){return level;},
  get ball(){return {y:ball.y,vy:ball.vy,screenY:ballVisualY()};},
  get fireball(){return fireball;},
  get streak(){return streak;},
  get platCount(){return platforms.length;},
  get towerAngle(){return towerAngle;},
  platforms(){return platforms.slice(0,8).map(p=>({
    y:p.y,type:p.type,gapA:p.gapA,rot:p.rot,gapW:p.gapW,
    dangerA:p.dangerA,dangerW:p.dangerW,gone:p.gone
  }));},
  rotate(dx){towerAngle+=dx;for(const p of platforms)p.rot+=dx;},
  alignGap(){
    const by=ball.y+BALL_R;
    const p=platforms.find(p=>!p.gone&&p.y>=by);
    if(!p)return -1;
    const d=angNorm(-p.gapA-p.rot);
    towerAngle+=d;for(const q of platforms)q.rot+=d;
    return p.type;
  },
  drop(){ball.vy=MAX_FALL;},
  kill(){onDeath('debug');},
  restart(){reset(12345);state='play';},
  start(){if(state==='ready')state='play';},
  toggleMute(){toggleSound();}
};

</script>
