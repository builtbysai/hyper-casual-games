<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Stack Twist</title>
<meta name="theme-color" content="#0b1026">
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0b1026; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: pointer; }
  #mute { position: fixed; top: 14px; right: 16px; z-index: 5; font: 11px/1 ui-monospace, monospace;
    letter-spacing: .18em; color: rgba(255,255,255,.55); background: none; border: none;
    cursor: pointer; padding: 8px; }
  #mute:hover { color: #fff; }
</style>
</head>
<body>
<canvas id="g"></canvas>
<button id="mute" type="button">SOUND ON</button>
<script>
'use strict';
/* STACK TWIST 3D — tap-timing tower in real perspective 3D.
 * Blocks swing along alternating axes (X, Z, X, Z...). Tap drops.
 * Overhang slices off with tumbling debris. Wind gusts (level 8+) shove
 * the swinging block — telegraphed by streaks, a flag, and an indicator.
 */
const cv = document.getElementById('g');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize); resize();

// ---------- tiny 3D ----------
const BH = 0.55;                 // block height (world units)
const BASE = 2.3;                // starting footprint
let camAz = Math.PI / 4, camT = 0;
const camTarget = { x: 0, y: 0, z: 0 };
const camPos = { x: 0, y: 0, z: 0 };
let focal = 800;

function updateCamera(dt, topY) {
  camT += dt;
  camAz = Math.PI / 4 + Math.sin(camT * 0.07) * 0.05;
  const wantY = topY + 1.4;
  camTarget.x += (0 - camTarget.x) * Math.min(1, dt * 3);
  camTarget.y += (wantY - camTarget.y) * Math.min(1, dt * 3);
  camTarget.z += (0 - camTarget.z) * Math.min(1, dt * 3);
  const dist = 7.2, h = 5.4;
  camPos.x = camTarget.x + Math.cos(camAz) * dist;
  camPos.y = camTarget.y + h;
  camPos.z = camTarget.z + Math.sin(camAz) * dist;
  focal = Math.min(W, H) * 1.5;
}
const _f = { x: 0, y: 0, z: 0 }, _r = { x: 0, y: 0, z: 0 }, _u = { x: 0, y: 0, z: 0 }, _v = { x: 0, y: 0, z: 0 };
function project(x, y, z, out) {
  _f.x = camTarget.x - camPos.x; _f.y = camTarget.y - camPos.y; _f.z = camTarget.z - camPos.z;
  const fl = Math.hypot(_f.x, _f.y, _f.z); _f.x /= fl; _f.y /= fl; _f.z /= fl;
  _r.x = _f.z * 0 - _f.y * 1; _r.y = _f.x * 1 - _f.z * 0; _r.z = 0; // cross(f, up=(0,1,0))
  // cross(f, up): (f.y*0 - f.z*1, f.z*0 - f.x*0, f.x*1 - f.y*0)
  _r.x = -_f.z; _r.y = 0; _r.z = _f.x;
  const rl = Math.hypot(_r.x, _r.y, _r.z); _r.x /= rl; _r.y /= rl; _r.z /= rl;
  _u.x = _r.y * _f.z - _r.z * _f.y; _u.y = _r.z * _f.x - _r.x * _f.z; _u.z = _r.x * _f.y - _r.y * _f.x;
  _v.x = x - camPos.x; _v.y = y - camPos.y; _v.z = z - camPos.z;
  const cx = _v.x * _r.x + _v.y * _r.y + _v.z * _r.z;
  const cy = _v.x * _u.x + _v.y * _u.y + _v.z * _u.z;
  const cz = _v.x * _f.x + _v.y * _f.y + _v.z * _f.z;
  if (cz < 0.1) return null;
  out.x = W / 2 + cx * focal / cz;
  out.y = H / 2 - cy * focal / cz;
  out.d = cz;
  return out;
}
const _p = { x: 0, y: 0, d: 0 };

// ---------- audio ----------
let AC = null, muted = false;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f, t, dur, type, vol) {
  if (muted) return; const a = ac(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type || 'sine'; o.frequency.value = f;
  g.gain.setValueAtTime(vol || 0.12, a.currentTime + t);
  g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + t + dur);
  o.connect(g); g.connect(a.destination);
  o.start(a.currentTime + t); o.stop(a.currentTime + t + dur + 0.02);
}
function thud() {
  if (muted) return; const a = ac(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = 'triangle'; o.frequency.setValueAtTime(140, a.currentTime);
  o.frequency.exponentialRampToValueAtTime(45, a.currentTime + 0.12);
  g.gain.setValueAtTime(0.22, a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + 0.14);
  o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + 0.16);
}
const PENTA = [523.25, 587.33, 659.25, 783.99, 880.0, 1046.5, 1174.7, 1318.5];
document.getElementById('mute').addEventListener('click', e => {
  e.stopPropagation();
  muted = !muted;
  e.target.textContent = muted ? 'SOUND OFF' : 'SOUND ON';
});
function buzz(ms) { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} }

// ---------- game state ----------
const tower = [];   // {x, z, w, d} — y = index * BH
let level = 0, combo = 0, score = 0, best = 0;
let state = 'title'; // title | swing | fall | over
let block = null;    // {axis, pos, w, d, y, vy}
let phase = 0, swingSpeed = 1.6;
let debris = [];     // {x,y,z,vx,vy,vz,w,d,ry,vr,life}
let shake = 0;
let banner = null;   // {text, t}
let flash = 0;
try { best = parseInt(localStorage.getItem('stacktwist3d_best') || '0', 10) || 0; } catch (e) {}

function reset() {
  tower.length = 0;
  tower.push({ x: 0, z: 0, w: BASE, d: BASE });
  level = 0; combo = 0; score = 0;
  debris.length = 0; shake = 0; flash = 0; banner = null;
  spawnBlock();
  state = 'swing';
}
function spawnBlock() {
  const top = tower[tower.length - 1];
  const axis = (tower.length % 2 === 1) ? 'x' : 'z';
  block = {
    axis, w: top.w, d: top.d,
    y: tower.length * BH + 2.2,
    vy: 0, state: 'swing',
    dir: Math.random() < 0.5 ? 1 : -1
  };
  phase = block.dir > 0 ? -Math.PI / 2 : Math.PI / 2;
  swingSpeed = Math.min(3.4, 1.6 + tower.length * 0.055);
  block.pos = Math.sin(phase) * 2.6;
}

// ---------- wind ----------
let windT = 0, windVal = 0, windDir = 1, nextWindDir = 1, prevCyc = 0, gustSeed = 0;
function windUpdate(dt) {
  windT += dt;
  const cyc = (windT % 7) / 7;
  if (cyc < prevCyc) nextWindDir = Math.random() < 0.5 ? 1 : -1; // decide next gust at cycle start
  prevCyc = cyc;
  if (tower.length < 8) { windVal += (0 - windVal) * Math.min(1, dt * 2); return; }
  // calm -> gust -> calm waves, ~7s period
  let target = 0;
  if (cyc > 0.25 && cyc < 0.6) {
    target = Math.sin((cyc - 0.25) / 0.35 * Math.PI);
    if (cyc - dt / 7 <= 0.25) { windDir = nextWindDir; gustSeed = Math.random() * 10; }
  }
  const strength = Math.min(1.5, 0.5 + tower.length * 0.03);
  windVal += (target * strength * windDir - windVal) * Math.min(1, dt * 2.5);
}
function gustForecast() {
  const cyc = (windT % 7) / 7;
  if (tower.length < 8) return null;
  if (cyc > 0.25 && cyc < 0.6) return null; // already gusting
  const until = ((0.25 - cyc + 1) % 1) * 7;
  return until <= 2.2 ? { secs: until, dir: nextWindDir } : null;
}

// wind streak particles (world space around tower top)
const streaks = [];
for (let i = 0; i < 46; i++) streaks.push({ x: 0, y: 0, z: 0, s: 0.5 + Math.random() });
function streakUpdate(dt) {
  const topY = tower.length * BH;
  for (const s of streaks) {
    s.x += windVal * 6 * dt * s.s;
    s.y += Math.sin(camT * 2 + s.z * 3) * 0.2 * dt;
    if (Math.abs(s.x) > 5 || Math.abs(s.z) > 5 || Math.abs(windVal) < 0.05) {
      s.x = -windDir * (3 + Math.random() * 2);
      s.y = topY - 1 + Math.random() * 3.5;
      s.z = (Math.random() - 0.5) * 7;
    }
  }
}

// ---------- input ----------
function onTap() {
  ac();
  if (state === 'title') { reset(); return; }
  if (state === 'over') { reset(); return; }
  if (state === 'swing' && block && block.state === 'swing') {
    block.state = 'fall'; block.vy = 0;
  }
}
cv.addEventListener('pointerdown', onTap);

// ---------- update ----------
function drop(dt) {
  block.vy += 30 * dt;
  block.y -= block.vy * dt;
  const topY = tower.length * BH;
  if (block.y <= topY) {
    block.y = topY;
    land();
  }
}
function land() {
  const top = tower[tower.length - 1];
  const ax = block.axis;
  const cPrev = ax === 'x' ? top.x : top.z;
  const sPrev = ax === 'x' ? top.w : top.d;
  const sBlk = ax === 'x' ? block.w : block.d;
  const lo = Math.max(block.pos - sBlk / 2, cPrev - sPrev / 2);
  const hi = Math.min(block.pos + sBlk / 2, cPrev + sPrev / 2);
  const ov = hi - lo;
  thud();
  if (ov <= 0.02) { gameOver(); return; }
  const off = Math.abs(block.pos - cPrev);
  if (off <= 0.07) {
    // PERFECT
    combo++;
    const nb = { x: top.x, z: top.z, w: top.w, d: top.d };
    if (ax === 'x') nb.x = cPrev; else nb.z = cPrev;
    tower.push(nb);
    flash = 1;
    const n = PENTA[Math.min(PENTA.length - 1, combo - 1 + 2)];
    tone(n, 0, 0.25, 'sine', 0.14); tone(n * 2, 0.02, 0.2, 'sine', 0.06);
    buzz(15);
    banner = combo >= 3 ? { text: 'PERFECT x' + combo, t: 0 } : null;
  } else {
    combo = 0;
    const nc = (lo + hi) / 2, nw = ov;
    const nb = { x: top.x, z: top.z, w: top.w, d: top.d };
    if (ax === 'x') { nb.x = nc; nb.w = nw; } else { nb.z = nc; nb.d = nw; }
    tower.push(nb);
    // debris = the sliced overhang
    const cutLo = block.pos - sBlk / 2 < lo;
    const dw = sBlk - ov;
    const dc = cutLo ? (block.pos - sBlk / 2 + lo) / 2 : (hi + block.pos + sBlk / 2) / 2;
    const d = {
      x: ax === 'x' ? dc : top.x, z: ax === 'z' ? dc : top.z,
      y: topY(), vx: (cutLo ? -1 : 1) * (ax === 'x' ? 1.6 : 0.3), vz: (cutLo ? -1 : 1) * (ax === 'z' ? 1.6 : 0.3),
      vy: 0.5, w: ax === 'x' ? dw : top.w, d: ax === 'z' ? dw : top.d,
      ry: Math.random() * 6.28, vr: (Math.random() - 0.5) * 6, life: 1.6
    };
    debris.push(d);
    tone(220, 0, 0.08, 'square', 0.05);
  }
  level++; score = tower.length - 1;
  if (score > best) { best = score; try { localStorage.setItem('stacktwist3d_best', String(best)); } catch (e) {} }
  if ((tower.length - 1) % 10 === 0) {
    banner = { text: (tower.length - 1) + '', t: 0 };
    [440, 554, 659].forEach((f, i) => tone(f, i * 0.07, 0.2, 'sine', 0.1));
  }
  spawnBlock();
  state = 'swing';
}
function topY() { return (tower.length - 1) * BH; }
function gameOver() {
  state = 'over';
  block.state = 'gone';
  block.vy = 1;
  shake = 0.5;
  tone(330, 0, 0.2, 'sawtooth', 0.08); tone(220, 0.15, 0.25, 'sawtooth', 0.08); tone(147, 0.3, 0.4, 'sawtooth', 0.08);
  buzz(40);
}

// ---------- sky ----------
const SKY_KEYS = [
  { l: 0,   top: [255, 183, 140], bot: [64, 50, 110] },    // dawn
  { l: 12,  top: [120, 180, 255], bot: [200, 230, 255] },  // day
  { l: 26,  top: [255, 140, 90],  bot: [70, 40, 110] },    // dusk
  { l: 42,  top: [20, 26, 64],    bot: [8, 10, 34] },      // night
  { l: 70,  top: [4, 6, 18],      bot: [2, 3, 10] }        // space
];
const stars = [];
for (let i = 0; i < 130; i++) stars.push({ x: Math.random(), y: Math.random(), r: Math.random() * 1.4 + 0.3, tw: Math.random() * 6.28 });
function skyColors(lv) {
  let a = SKY_KEYS[0], b = SKY_KEYS[SKY_KEYS.length - 1];
  for (let i = 0; i < SKY_KEYS.length - 1; i++) {
    if (lv >= SKY_KEYS[i].l && lv <= SKY_KEYS[i + 1].l) { a = SKY_KEYS[i]; b = SKY_KEYS[i + 1]; break; }
  }
  const t = Math.max(0, Math.min(1, (lv - a.l) / Math.max(1, b.l - a.l)));
  const mix = (u, v) => Math.round(u + (v - u) * t);
  return {
    top: `rgb(${mix(a.top[0], b.top[0])},${mix(a.top[1], b.top[1])},${mix(a.top[2], b.top[2])})`,
    bot: `rgb(${mix(a.bot[0], b.bot[0])},${mix(a.bot[1], b.bot[1])},${mix(a.bot[2], b.bot[2])})`,
    night: t > 0.5 ? (t - 0.5) * 2 : 0
  };
}

// ---------- draw ----------
function blockColor(lv, face) {
  const h = (168 + lv * 5) % 360;
  const li = face === 0 ? 62 : face === 1 ? 50 : 40;
  return `hsl(${h},58%,${li}%)`;
}
function drawBox(bx, by, bz, w, d, lv, alpha) {
  // corners
  const x0 = bx - w / 2, x1 = bx + w / 2, z0 = bz - d / 2, z1 = bz + d / 2;
  const y0 = by, y1 = by + BH;
  const c = [
    [x0, y0, z0], [x1, y0, z0], [x1, y0, z1], [x0, y0, z1],
    [x0, y1, z0], [x1, y1, z0], [x1, y1, z1], [x0, y1, z1]
  ];
  const p = c.map(v => { const o = { x: 0, y: 0, d: 0 }; return project(v[0], v[1], v[2], o); });
  if (p.some(v => !v)) return;
  // camera sits at +x,+z quadrant: visible faces are +x (1,2,6,5), +z (2,3,7,6), +y (4,5,6,7)
  const faces = [
    { idx: [1, 2, 6, 5], f: 1 }, { idx: [2, 3, 7, 6], f: 2 }, { idx: [4, 5, 6, 7], f: 0 }
  ];
  // far-to-near among the three (painter within box)
  faces.sort((m, n) => {
    const dm = (p[m.idx[0]].d + p[m.idx[2]].d) / 2, dn = (p[n.idx[0]].d + p[n.idx[2]].d) / 2;
    return dn - dm;
  });
  ctx.globalAlpha = alpha === undefined ? 1 : alpha;
  for (const f of faces) {
    ctx.fillStyle = blockColor(lv, f.f);
    ctx.beginPath();
    ctx.moveTo(p[f.idx[0]].x, p[f.idx[0]].y);
    for (let i = 1; i < 4; i++) ctx.lineTo(p[f.idx[i]].x, p[f.idx[i]].y);
    ctx.closePath(); ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function draw() {
  const lv = tower.length - 1;
  const sky = skyColors(lv);
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, sky.top); g.addColorStop(1, sky.bot);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // stars
  if (sky.night > 0.02) {
    for (const s of stars) {
      const a = sky.night * (0.35 + 0.65 * Math.abs(Math.sin(camT * 1.5 + s.tw)));
      ctx.fillStyle = `rgba(255,255,255,${a.toFixed(2)})`;
      ctx.fillRect(s.x * W, s.y * H * 0.7, s.r, s.r);
    }
  }
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake * 22, (Math.random() - 0.5) * shake * 22);

  // tower (bottom-up)
  for (let i = 0; i < tower.length; i++) {
    const b = tower[i];
    drawBox(b.x, i * BH, b.z, b.w, b.d, i);
  }
  // moving block
  if (block && (state === 'swing' || state === 'fall')) {
    const bx = block.axis === 'x' ? block.pos : tower[tower.length - 1].x;
    const bz = block.axis === 'z' ? block.pos : tower[tower.length - 1].z;
    drawBox(bx, block.y, bz, block.w, block.d, tower.length);
    if (flash > 0) {
      const o = { x: 0, y: 0, d: 0 };
      if (project(bx, block.y + BH / 2, bz, o)) {
        ctx.fillStyle = `rgba(255,255,255,${(flash * 0.5).toFixed(2)})`;
        ctx.beginPath(); ctx.arc(o.x, o.y, 60 * flash + 20, 0, 6.29); ctx.fill();
      }
    }
    // drop guide
    if (block.state === 'swing') {
      const a = { x: 0, y: 0, d: 0 }, b2 = { x: 0, y: 0, d: 0 };
      if (project(bx, block.y, bz, a) && project(bx, tower.length * BH, bz, b2)) {
        ctx.strokeStyle = 'rgba(255,255,255,0.28)';
        ctx.lineWidth = 2; ctx.setLineDash([4, 7]);
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b2.x, b2.y); ctx.stroke();
        ctx.setLineDash([]);
      }
    }
  }
  // debris
  debris = debris.filter(d => d.life > 0);
  for (const d of debris) {
    ctx.save();
    ctx.globalAlpha = Math.max(0, Math.min(1, d.life));
    drawBox(d.x, d.y, d.z, d.w, d.d, tower.length - 1);
    ctx.restore();
  }
  // wind streaks
  if (Math.abs(windVal) > 0.06) {
    ctx.strokeStyle = `rgba(255,255,255,${(Math.min(0.5, Math.abs(windVal) * 0.35)).toFixed(2)})`;
    ctx.lineWidth = 1.5;
    const o1 = { x: 0, y: 0, d: 0 }, o2 = { x: 0, y: 0, d: 0 };
    for (const s of streaks) {
      if (project(s.x, s.y, s.z, o1) && project(s.x - windVal * 0.7, s.y, s.z, o2)) {
        ctx.beginPath(); ctx.moveTo(o1.x, o1.y); ctx.lineTo(o2.x, o2.y); ctx.stroke();
      }
    }
  }
  // summit flag — planted only when the run ends
  if (state === 'over') {
    const top = tower[tower.length - 1];
    const a = { x: 0, y: 0, d: 0 };
    if (project(top.x, tower.length * BH + BH, top.z, a)) {
      const fh = Math.min(W, H) * 0.11;
      ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(a.x, a.y - fh); ctx.stroke();
      const wlen = fh * 0.85;
      const wave = Math.sin(camT * 7) * 3;
      ctx.fillStyle = '#ffd23d';
      ctx.beginPath();
      ctx.moveTo(a.x, a.y - fh);
      ctx.lineTo(a.x + wlen, a.y - fh + fh * 0.2 + wave);
      ctx.lineTo(a.x, a.y - fh + fh * 0.4);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#0b1026';
      ctx.font = '700 ' + Math.round(fh * 0.22) + 'px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(String(score), a.x + wlen * 0.42, a.y - fh + fh * 0.27 + wave * 0.4);
    }
  }
  ctx.restore();

  // wind indicator
  if (tower.length >= 8 && state !== 'title') {
    const s = Math.abs(windVal);
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.font = '600 13px ui-monospace, monospace';
    ctx.textAlign = 'center';
    const label = s < 0.12 ? 'CALM' : (windVal > 0 ? 'WIND →' : '← WIND');
    ctx.fillText(label, W / 2, 112);
    if (s >= 0.12) {
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      ctx.fillRect(W / 2 - 60, 120, 120, 3);
      ctx.fillStyle = '#e0495f';
      ctx.fillRect(W / 2 - 60, 120, 120 * Math.min(1, s / 1.5), 3);
    } else {
      const fc = gustForecast();
      if (fc) {
        ctx.fillStyle = 'rgba(255,210,61,0.85)';
        ctx.font = '600 12px ui-monospace, monospace';
        ctx.fillText(fc.dir > 0 ? 'gust → soon' : '← gust soon', W / 2, 120);
      }
    }
  }

  // score
  ctx.fillStyle = 'rgba(255,255,255,0.92)';
  ctx.textAlign = 'center';
  if (state === 'title') {
    ctx.font = '700 44px system-ui, sans-serif';
    ctx.fillText('STACK TWIST', W / 2, H * 0.32);
    ctx.font = '400 17px system-ui, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.fillText('tap to drop the block', W / 2, H * 0.32 + 40);
    ctx.fillText('wind comes at level 8', W / 2, H * 0.32 + 66);
    if (best > 0) { ctx.fillText('best ' + best, W / 2, H * 0.32 + 96); }
  } else {
    ctx.font = '700 52px system-ui, sans-serif';
    ctx.fillText(String(score), W / 2, 64);
    ctx.font = '400 13px ui-monospace, monospace';
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.fillText('BEST ' + best, W / 2, 86);
  }
  // banner
  if (banner) {
    const a = Math.max(0, 1 - banner.t / 1.4);
    ctx.fillStyle = `rgba(255,255,255,${(a * 0.95).toFixed(2)})`;
    ctx.font = '700 30px system-ui, sans-serif';
    ctx.fillText(banner.text, W / 2, H * 0.4 - banner.t * 30);
  }
  // game over
  if (state === 'over') {
    ctx.fillStyle = 'rgba(5,8,20,0.55)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff';
    ctx.font = '700 40px system-ui, sans-serif';
    ctx.fillText('GAME OVER', W / 2, H * 0.38);
    ctx.font = '400 20px system-ui, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.fillText('score ' + score + '   ·   best ' + best, W / 2, H * 0.38 + 44);
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.font = '400 16px system-ui, sans-serif';
    ctx.fillText('tap to rebuild', W / 2, H * 0.38 + 78);
  }
  if (flash > 0) {
    ctx.fillStyle = `rgba(255,255,255,${(flash * 0.12).toFixed(2)})`;
    ctx.fillRect(0, 0, W, H);
  }
}

// ---------- main loop ----------
let last = performance.now();
function frame(now) {
  let dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (state === 'title') {
    if (tower.length === 0) { tower.push({ x: 0, z: 0, w: BASE, d: BASE }); }
  } else if (state === 'swing' || state === 'fall') {
    phase += dt * swingSpeed * (block.dir || 1);
    if (block.state === 'swing') {
      block.pos = Math.sin(phase) * 2.6 + windVal * 0.9;
    } else if (block.state === 'fall') {
      drop(dt);
    }
    // debris physics
    for (const d of debris) {
      d.vy -= 14 * dt;
      d.x += d.vx * dt; d.y += d.vy * dt; d.z += d.vz * dt;
      d.ry += d.vr * dt; d.life -= dt * 0.7;
    }
  } else if (state === 'over' && block && block.state === 'gone') {
    block.vy += 20 * dt;
    block.y -= block.vy * dt;
    for (const d of debris) {
      d.vy -= 14 * dt;
      d.x += d.vx * dt; d.y += d.vy * dt; d.z += d.vz * dt;
      d.life -= dt * 0.7;
    }
  }
  windUpdate(dt);
  streakUpdate(dt);
  if (shake > 0) shake = Math.max(0, shake - dt * 1.4);
  if (flash > 0) flash = Math.max(0, flash - dt * 2.2);
  if (banner) { banner.t += dt; if (banner.t > 1.4) banner = null; }
  updateCamera(dt, tower.length * BH);
  draw();
  requestAnimationFrame(frame);
}
tower.push({ x: 0, z: 0, w: BASE, d: BASE });
state = 'title';
requestAnimationFrame(frame);

// debug hook for automated playtesting
window.__st = { get state() { return state; }, get level() { return tower.length; },
  get block() { return block; }, tap: onTap, get score() { return score; } };
</script>
